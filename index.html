<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>طليان الشعلة</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:#080b10;
color:#fff;
}

button,input,textarea{
font-family:inherit;
}

button{
cursor:pointer;
}

.hidden{
display:none!important;
}

/* تسجيل الدخول */

#auth{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
background:linear-gradient(145deg,#101a2a,#080b10);
}

.auth-box{
width:100%;
max-width:420px;
background:#151c26;
padding:25px;
border-radius:20px;
border:1px solid #2b3747;
box-shadow:0 15px 50px #0008;
}

.logo{
text-align:center;
font-size:28px;
font-weight:bold;
margin-bottom:8px;
}

.sub{
text-align:center;
color:#9da9b8;
margin-bottom:22px;
}

.auth-box input{
width:100%;
padding:14px;
margin:6px 0;
border:1px solid #354253;
border-radius:10px;
background:#0d131b;
color:#fff;
outline:none;
}

.auth-box button{
width:100%;
padding:14px;
margin-top:8px;
border:0;
border-radius:10px;
font-weight:bold;
}

.signup{
background:#168bff;
color:white;
}

.login{
background:#273241;
color:white;
}

#authMsg{
text-align:center;
min-height:25px;
margin-top:12px;
}

/* التطبيق */

#app{
height:100vh;
display:flex;
flex-direction:column;
}

.header{
height:62px;
background:#151c26;
border-bottom:1px solid #2a3544;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 12px;
}

.title{
font-size:19px;
font-weight:bold;
}

.user-small{
font-size:12px;
color:#76e6a5;
margin-top:3px;
}

.logout{
background:#a82d38;
border:0;
color:white;
padding:9px 12px;
border-radius:9px;
}

/* التبويبات */

.tabs{
display:flex;
background:#111821;
border-bottom:1px solid #2a3544;
}

.tab{
flex:1;
background:transparent;
border:0;
color:#9ca8b7;
padding:13px 5px;
font-weight:bold;
}

.tab.active{
color:#fff;
border-bottom:3px solid #2585ff;
}

/* الصفحات */

.pages{
flex:1;
min-height:0;
}

.page{
height:100%;
overflow-y:auto;
padding:12px;
}

#chatPage{
display:flex;
flex-direction:column;
padding:0;
}

/* الرسائل */

.messages{
flex:1;
overflow-y:auto;
padding:12px;
}

.message{
display:flex;
gap:9px;
margin-bottom:12px;
align-items:flex-start;
}

.avatar{
width:42px;
height:42px;
border-radius:50%;
object-fit:cover;
background:#293646;
flex:none;
}

.message-box{
background:#18222e;
padding:8px 11px;
border-radius:13px;
max-width:78%;
}

.message-name{
font-size:12px;
color:#62a8ff;
font-weight:bold;
margin-bottom:3px;
}

.message-text{
line-height:1.55;
word-break:break-word;
}

/* الكتابة */

.composer{
display:flex;
gap:6px;
padding:9px;
background:#151c26;
border-top:1px solid #2a3544;
}

.composer input{
flex:1;
min-width:0;
background:#0d131b;
border:1px solid #354253;
border-radius:10px;
color:#fff;
padding:12px;
outline:none;
}

.send{
width:48px;
border:0;
border-radius:10px;
background:#168bff;
color:white;
font-size:18px;
}

/* المنشورات */

.post-form,.post,.profile{
background:#151c26;
border:1px solid #2a3544;
border-radius:15px;
padding:13px;
margin-bottom:12px;
}

.post-form textarea{
width:100%;
height:90px;
resize:none;
background:#0d131b;
border:1px solid #354253;
border-radius:10px;
color:#fff;
padding:12px;
outline:none;
}

.publish{
width:100%;
border:0;
border-radius:10px;
background:#168bff;
color:white;
padding:12px;
margin-top:8px;
font-weight:bold;
}

.post-head{
display:flex;
align-items:center;
gap:9px;
}

.post-name{
font-weight:bold;
}

.post-text{
white-space:pre-wrap;
line-height:1.7;
margin:12px 0;
}

.like{
background:#222d3b;
border:0;
color:white;
border-radius:9px;
padding:8px 13px;
}

/* الحساب */

.profile-head{
display:flex;
align-items:center;
gap:12px;
margin-bottom:15px;
}

.big-avatar{
width:75px;
height:75px;
border-radius:50%;
object-fit:cover;
background:#293646;
}

.profile input{
width:100%;
padding:12px;
margin:6px 0;
background:#0d131b;
border:1px solid #354253;
border-radius:10px;
color:#fff;
}

.save{
width:100%;
padding:12px;
border:0;
border-radius:10px;
background:#168bff;
color:white;
font-weight:bold;
margin-top:8px;
}

.empty{
text-align:center;
color:#7f8b9b;
padding:35px 10px;
}
</style>
</head>

<body>

<div id="auth">

<div class="auth-box">

</div>

</div>

</div>

<button class="logout" id="logout">

</button>

</div>


<div class="tabs">

</button>

<button class="tab" data-page="postsPage">

<button class="tab" data-page="profilePage">
👤 حسابي
</button>

</div>


<div class="pages">

<div id="chatPage" class="page">

<div id="messages" class="messages">

</div>

<div class="composer">

<input

<button class="send" id="send">

</button>

</div>

</div>


<!-- المنشورات -->

<div id="postsPage" class="page hidden">

<div class="post-form">

<textarea

></textarea>

<button class="publish" id="publish">
📢 نشر المنشور
</button>

</div>

<div id="posts">
<div class="empty">
لا توجد منشورات بعد
</div>
</div>

</div>


<!-- الحساب -->

<div id="profilePage" class="page hidden">

<div class="profile">

<div class="profile-head">

<img id="bigAvatar" class="big-avatar">

<div>
<strong id="profileName">
عضو
</strong>

<div id="profileEmail"></div>
</div>

</div>

<input
id="newName"
placeholder="اسم العضو"
>

<input
id="newAvatar"
placeholder="رابط صورة العضو"
>

<button class="save" id="save">
حفظ
</button>

<div id="profileMsg"></div>

</div>

</div>

</div>

</div>

</div>


<script type="module">

}

const firebaseApp=initializeApp(firebaseConfig);

const authBox=document.getElementById("auth");

function avatarFor(name){

return "https://ui-avatars.com/api/?name="
+encodeURIComponent(name||"عضو")
+"&background=168bff&color=fff";

}


/* إنشاء حساب */

document.getElementById("signup").onclick=async()=>{

const name=document.getElementById("name").value.trim();

const email=document.getElementById("email").value.trim();

const password=document.getElementById("password").value;

const avatar=document.getElementById("avatar").value.trim();


if(!name){

authMsg.textContent="⚠️ اكتب اسم العضو";

return;
}

if(!email){

authMsg.textContent="⚠️ اكتب البريد الإلكتروني";

return;
}

if(password.length<6){

authMsg.textContent="⚠️ كلمة المرور يجب أن تكون 6 أحرف على الأقل";

return;
}


authMsg.textContent="جاري إنشاء الحساب...";


try{

const result=
await createUserWithEmailAndPassword(
auth,
email,
password
);


const photo=avatar||avatarFor(name);


await updateProfile(result.user,{
displayName:name,
photoURL:photo
});


await setDoc(
doc(db,"users",result.user.uid),
{
uid:result.user.uid,
name:name,
email:email,
avatar:photo,
createdAt:serverTimestamp()
}
);


authMsg.textContent="✅ تم إنشاء الحساب";

}catch(error){

console.error(error);

authMsg.textContent=
"❌ "+error.code;

}

};


/* تسجيل الدخول */

document.getElementById("login").onclick=async()=>{

const email=document.getElementById("email").value.trim();

const password=document.getElementById("password").value;


if(!email||!password){

authMsg.textContent="⚠️ اكتب البريد وكلمة المرور";

return;
}


authMsg.textContent="جاري تسجيل الدخول...";


try{

await signInWithEmailAndPassword(
auth,
email,
password
);

}catch(error){

console.error(error);

authMsg.textContent=
"❌ "+error.code;

}

};


/* مراقبة الدخول */

onAuthStateChanged(auth,user=>{

if(user){

authBox.classList.add("hidden");

app.classList.remove("hidden");

showUser(user);

loadMessages();

loadPosts();

}else{

authBox.classList.remove("hidden");

app.classList.add("hidden");

}

});


/* عرض المستخدم */

function showUser(user){

const name=user.displayName||"عضو";

const photo=user.photoURL||avatarFor(name);


document.getElementById("currentUser")
.textContent=name;

document.getElementById("profileName")
.textContent=name;

document.getElementById("profileEmail")
.textContent=user.email||"";

document.getElementById("bigAvatar")
.src=photo;

document.getElementById("newName")
.value=name;

document.getElementById("newAvatar")
.value=user.photoURL||"";

}


/* خروج */

document.getElementById("logout").onclick=async()=>{

await signOut(auth);

};


/* التبويبات */

document.querySelectorAll(".tab").forEach(tab=>{

tab.onclick=()=>{

document.querySelectorAll(".tab")
.forEach(x=>x.classList.remove("active"));

tab.classList.add("active");


document.querySelectorAll(".page")
.forEach(x=>x.classList.add("hidden"));

document.getElementById(tab.dataset.page)
.classList.remove("hidden");

};

});


/* إرسال رسالة */

async function sendMessage(){

const input=document.getElementById("messageInput");

const text=input.value.trim();

const user=auth.currentUser;


if(!user||!text)return;


try{

await addDoc(
collection(db,"messages"),
{
uid:user.uid,
name:user.displayName||"عضو",
avatar:user.photoURL||avatarFor(user.displayName),
text:text,
createdAt:serverTimestamp()
}
);

input.value="";

}catch(error){

console.error(error);

alert("تعذر إرسال الرسالة");

}

}


document.getElementById("send")
.onclick=sendMessage;


document.getElementById("messageInput")
.addEventListener("keydown",event=>{

if(event.key==="Enter"){

sendMessage();

}

});


/* قراءة الرسائل */

function loadMessages(){

const q=query(
collection(db,"messages"),
orderBy("createdAt","asc")
);


onSnapshot(q,snapshot=>{

const box=document.getElementById("messages");

box.innerHTML="";


if(snapshot.empty){

box.innerHTML=
'<div class="empty">لا توجد رسائل بعد</div>';

return;

}


snapshot.forEach(item=>{

const data=item.data();


const row=document.createElement("div");

row.className="message";


const img=document.createElement("img");

img.className="avatar";

img.src=
data.avatar||avatarFor(data.name);


img.onerror=()=>{

img.src=avatarFor(data.name);

};


const body=document.createElement("div");

body.className="message-box";


const name=document.createElement("div");

name.className="message-name";

name.textContent=
data.name||"عضو";


const text=document.createElement("div");

text.className="message-text";

text.textContent=
data.text||"";


body.append(name,text);

row.append(img,body);

box.appendChild(row);

});


box.scrollTop=box.scrollHeight;

});

}


/* نشر */

const input=document.getElementById("postText");

const text=input.value.trim();

const user=auth.currentUser;


if(!user||!text)return;

collection(db,"posts"),

uid:user.uid,
name:user.displayName||"عضو",
