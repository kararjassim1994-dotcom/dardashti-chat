<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>طليان الشعلة</title>
<style>
body{font-family:Arial;background:#111;color:#fff;margin:0}
.box{max-width:400px;margin:60px auto;padding:25px;background:#222;border-radius:15px}
input,button{width:100%;padding:14px;margin:8px 0;box-sizing:border-box;border:0;border-radius:8px}
input{background:#333;color:#fff}
button{background:#1877f2;color:#fff;font-weight:bold}
#msg{text-align:center;margin-top:15px}
</style>
</head>

<body>

<div class="box">
<h2>🔥 طليان الشعلة</h2>

<input id="email" type="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">

<button id="login">تسجيل الدخول</button>

<div id="msg"></div>
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


const firebaseConfig={
apiKey:"AIzaSyAuFZxL_pmEm7weqkMQVGRME8VHeVs4fDU",
authDomain:"dardashti-chat.firebaseapp.com",
projectId:"dardashti-chat",
storageBucket:"dardashti-chat.firebasestorage.app",
messagingSenderId:"779042757468",
appId:"1:779042757468:web:7646d3cdadf46f315a3f99"
};


const app=initializeApp(firebaseConfig);
const auth=getAuth(app);

const msg=document.getElementById("msg");


document.getElementById("login").addEventListener("click",async()=>{

msg.textContent="جاري تسجيل الدخول...";

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;


if(!email || !password){
msg.textContent="⚠️ اكتب البريد وكلمة المرور";
return;
}


try{

await signInWithEmailAndPassword(
auth,
email,
password
);

msg.textContent="✅ تم تسجيل الدخول بنجاح";

}catch(error){

msg.textContent="❌ "+error.code;

console.error(error);

}

});

</script>

</body>
</html>
