<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>كرار جاسم</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:Arial,Tahoma,sans-serif;
  background:#070b12;
  color:#fff;
}

body{
  background:
    linear-gradient(135deg,#06101dcc,#101827dd),
    url("https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=1800&q=80")
    center/cover fixed no-repeat;
}

button,input{font-family:inherit}
button{cursor:pointer}
.hidden{display:none!important}

:root{
  --panel:#101925ed;
  --panel2:#182333ee;
  --line:#314156;
  --blue:#1687ff;
  --green:#27c47b;
  --red:#c83b4a;
  --muted:#9aa9bb;
}

/* LOGIN */

#loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.loginBox{
  width:100%;
  max-width:440px;
  background:var(--panel);
  padding:24px;
  border-radius:22px;
  border:1px solid #ffffff20;
  box-shadow:0 20px 70px #000b;
  backdrop-filter:blur(12px);
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:900;
  margin-bottom:6px;
}

.description{
  text-align:center;
  color:#c5d0dc;
  line-height:1.7;
  margin-bottom:18px;
}

.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-bottom:12px;
}

.tab,.btn{
  border:0;
  border-radius:10px;
  padding:12px;
  font-weight:bold;
}

.tab{
  background:#1a2635;
  color:#ccd7e4;
  border:1px solid var(--line);
}

.tab.active,
.primary{
  background:var(--blue);
  color:#fff;
}

.form{display:none}
.form.active{display:block}

input{
  width:100%;
  padding:13px;
  margin:5px 0;
  border:1px solid var(--line);
  border-radius:10px;
  background:#0b121c;
  color:#fff;
  outline:none;
}

.btn{
  width:100%;
  margin-top:7px;
  color:#fff;
}

.secondary{background:#293648}

#authMessage{
  text-align:center;
  min-height:24px;
  color:#ffb4b4;
  margin-top:10px;
}

.status{
  text-align:center;
  color:#79e2aa;
  font-size:12px;
  margin-top:10px;
}

/* APP */

#chatApp{
  height:100vh;
  display:flex;
  flex-direction:column;
}

.header{
  min-height:64px;
  background:#0e1723ed;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px;
  gap:8px;
}

.headerUser{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}

.headerAvatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#26364a;
}

.title{
  font-size:20px;
  font-weight:900;
}

.username{
  font-size:12px;
  color:#72e3a4;
  margin-top:2px;
}

.headerActions{
  display:flex;
  gap:6px;
  align-items:center;
  flex-wrap:wrap;
}

.iconBtn{
  border:0;
  background:#223044;
  color:#fff;
  padding:9px 10px;
  border-radius:9px;
}

.logout{background:#a82f3c}
.adminBtn{background:#8a5cf6}

/* VOICE */

.voicePanel{
  background:#0d1622e8;
  border-bottom:1px solid var(--line);
  padding:9px;
}

.voiceTitle{
  text-align:center;
  font-weight:bold;
  color:#dbe6f2;
  margin-bottom:7px;
}

.voiceSlots{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}

.voiceSlot{
  min-height:82px;
  background:#172233;
  border:1px solid var(--line);
  border-radius:12px;
  padding:7px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
}

.voiceSlot.active{
  border-color:var(--green);
}

.micIcon{font-size:25px}

.voiceName{
  font-size:11px;
  color:#c0cad6;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.voiceStatus{
  font-size:10px;
  color:#8797aa;
  text-align:center;
}

.voiceSlot button{
  border:0;
  border-radius:8px;
  padding:6px 8px;
  background:var(--blue);
  color:#fff;
  font-size:11px;
  font-weight:bold;
}

/* ROOMS */

.roomsBar{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:8px;
  background:#0c1420e8;
  border-bottom:1px solid var(--line);
}

.roomBtn{
  white-space:nowrap;
  border:1px solid var(--line);
  background:#182333;
  color:#dce7f4;
  border-radius:9px;
  padding:8px 11px;
}

.roomBtn.active{
  background:#1687ff;
  border-color:#1687ff;
}

/* CONTENT */

.content{
  flex:1;
  display:flex;
  min-height:0;
  overflow:hidden;
}

.feed{
  flex:1;
  overflow-y:auto;
  padding:12px;
  background:#0005;
}

.side{
  width:250px;
  background:#0e1724e8;
  border-right:1px solid var(--line);
  overflow-y:auto;
  padding:10px;
}

.sideTitle{
  font-weight:bold;
  margin:5px 0 10px;
}

.onlineCount{
  color:#74e2a5;
  font-size:12px;
  margin-bottom:8px;
}

.member{
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px;
  border-radius:9px;
  background:#162131;
  margin-bottom:6px;
  cursor:pointer;
}

.member img{
  width:34px;
  height:34px;
  border-radius:50%;
  object-fit:cover;
}

.memberName{
  font-size:12px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#35d47f;
  margin-right:auto;
}

.composer{
  display:flex;
  gap:7px;
  padding:8px;
  background:#111a26ee;
  border-top:1px solid var(--line);
  align-items:center;
}

.composer input{
  margin:0;
  flex:1;
}

.send{
  width:48px;
  height:46px;
  border:0;
  border-radius:10px;
  background:var(--blue);
  color:#fff;
  font-size:18px;
}

.empty{
  text-align:center;
  color:#7f8da0;
  padding:35px 10px;
}

.post{
  background:#101a27ed;
  border:1px solid #ffffff12;
  border-radius:14px;
  padding:10px;
  margin-bottom:10px;
}

.postHead{
  display:flex;
  gap:8px;
  align-items:center;
}

.postHead img{
  width:40px;
  height:40px;
  border-radius:50%;
  object-fit:cover;
}

.postName{
  font-weight:bold;
  color:#75b7ff;
}

.postRoom{
  font-size:10px;
  color:#7f90a5;
}

.postText{
  white-space:pre-wrap;
  word-break:break-word;
  line-height:1.55;
  margin:9px 0;
}

.postActions{
  display:flex;
  gap:6px;
  border-top:1px solid #ffffff10;
  padding-top:7px;
}

.postActions button{
  border:0;
  border-radius:8px;
  background:#1d2a3b;
  color:#dce7f4;
  padding:7px 10px;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:10000;
  background:#000c;
  display:none;
  align-items:center;
  justify-content:center;
  padding:12px;
}

.modal.show{display:flex}

.box{
  width:100%;
  max-width:620px;
  max-height:94vh;
  overflow:auto;
  background:#0f1825;
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
}

.boxHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.boxTitle{
  font-size:20px;
  font-weight:bold;
}

.close{
  border:0;
  background:var(--red);
  color:#fff;
  border-radius:9px;
  width:38px;
  height:38px;
  font-size:22px;
}

.profilePreview{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #315273;
  margin:5px auto 10px;
  display:block;
}

.profileBox{text-align:center}

.profileBox label{
  display:block;
  text-align:right;
  font-size:12px;
  color:#aebbc9;
  margin-top:8px;
}

.danger{background:var(--red)!important}

.adminRow{
  display:flex;
  align-items:center;
  gap:6px;
  background:#172333;
  padding:8px;
  border-radius:10px;
  margin-bottom:7px;
}

.adminRow .grow{
  flex:1;
  min-width:0;
}

.adminRow button{
  border:0;
  border-radius:8px;
  padding:7px;
  color:#fff;
}

@media(max-width:760px){

  .side{display:none}

  .voiceSlots{
    grid-template-columns:repeat(5,90px);
    overflow-x:auto;
  }

  .header .title{
    font-size:17px;
  }
}
</style>
</head>

<body>

<div id="loginPage">
  <div class="loginBox">

    <div class="logo">كرار جاسم</div>

    <div class="description">
      دردشة عراقية متعددة الغرف والمجتمع<br>
      تواصل، نشر، صور، ورسائل خاصة
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="visitor">زائر</button>
      <button class="tab" data-tab="login">دخول</button>
      <button class="tab" data-tab="signup">عضوية</button>
    </div>

    <div id="visitorForm" class="form active">
      <input id="visitorName" placeholder="اسم الزائر" maxlength="30">
      <button id="visitorButton" class="btn primary">دخول كزائر</button>
    </div>

    <div id="loginForm" class="form">
      <input id="emailInput" type="email" placeholder="البريد الإلكتروني">
      <input id="passwordInput" type="password" placeholder="كلمة المرور">
      <button id="loginButton" class="btn primary">تسجيل الدخول</button>
    </div>

    <div id="signupForm" class="form">
      <input id="nameInput" placeholder="اسم العضو" maxlength="30">
      <input id="signupEmail" type="email" placeholder="البريد الإلكتروني">
      <input id="signupPassword" type="password" placeholder="كلمة المرور - 6 أحرف على الأقل">
      <button id="signupButton" class="btn primary">إنشاء العضوية</button>
    </div>

    <div id="authMessage"></div>

    <div class="status">● Firebase متصل</div>
  </div>
</div>


<div id="chatApp" class="hidden">

  <header class="header">

    <div class="headerUser">

      <img id="headerAvatar" class="headerAvatar" alt="الصورة الشخصية">

      <div>
        <div class="title">كرار جاسم</div>
        <div id="currentUsername" class="username">عضو</div>
      </div>

    </div>

    <div class="headerActions">

      <button id="profileBtn" class="iconBtn">👤 حسابي</button>

      <button id="adminBtn" class="iconBtn adminBtn hidden">
        🛡️ إشراف
      </button>

      <button id="logoutButton" class="iconBtn logout">
        خروج
      </button>

    </div>

  </header>


  <section class="voicePanel">

    <div class="voiceTitle">
      🎙️ البث الصوتي — 5 مايكات
    </div>

    <div id="voiceSlots" class="voiceSlots"></div>

  </section>


  <nav id="roomsBar" class="roomsBar"></nav>


  <main class="content">

    <section id="feed" class="feed">
      <div class="empty">جاري تحميل المحادثة...</div>
    </section>

    <aside class="side">

      <div class="sideTitle">👥 الأعضاء</div>

      <div id="onlineCount" class="onlineCount">
        0 عضو
      </div>

      <div id="membersList"></div>

    </aside>

  </main>


  <div class="composer">

    <input
      id="messageInput"
      placeholder="اكتب رسالة في الغرفة..."
      maxlength="2000"
    >

    <button id="sendButton" class="send">➤</button>

  </div>

</div>


<!-- PROFILE -->

<div id="profileModal" class="modal">

  <div class="box profileBox">

    <div class="boxHead">

      <div class="boxTitle">👤 حسابي</div>

      <button class="close" data-close="profileModal">×</button>

    </div>

    <img id="profilePreview" class="profilePreview" alt="الصورة">

    <label>الاسم</label>

    <input id="profileName" maxlength="30">

    <label>الصورة الشخصية</label>

    <input id="profilePhoto" type="file" accept="image/*">

    <button id="saveProfile" class="btn primary">
      حفظ التغييرات
    </button>

    <div id="profileStatus"></div>

  </div>

</div>


<!-- ADMIN -->

<div id="adminModal" class="modal">

  <div class="box">

    <div class="boxHead">

      <div class="boxTitle">🛡️ لوحة الإشراف</div>

      <button class="close" data-close="adminModal">×</button>

    </div>

    <button id="deleteAllBtn" class="btn danger">
      🗑️ حذف جميع الرسائل
    </button>

    <div id="adminStatus"
         style="text-align:center;color:#9fb0c2;margin:8px">
    </div>

    <div id="adminList"></div>

  </div>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signInAnonymously,
  updateProfile,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  where,
  limit,
  onSnapshot,
  serverTimestamp,
  doc,
  setDoc,
  getDoc,
  deleteDoc,
  getDocs,
  writeBatch
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-storage.js";


const firebaseConfig = {
  apiKey:"AIzaSyAuFZxL_pmEm7weqkMQVGRME8VHeVs4fDU",
  authDomain:"dardashti-chat.firebaseapp.com",
  projectId:"dardashti-chat",
  storageBucket:"dardashti-chat.firebasestorage.app",
  messagingSenderId:"779042757468",
  appId:"1:779042757468:web:7646d3cdadf46f315a3f99"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const storage = getStorage(app);


const ADMIN_UID =
  "N6KoWvu1IxbgWtVE46fmCsydZbF3";


const rooms = [
  "بغداد","البصرة","نينوى","الأنبار","ديالى",
  "كركوك","صلاح الدين","واسط","بابل","كربلاء",
  "النجف","القادسية","المثنى","ذي قار","ميسان",
  "أربيل","السليمانية","دهوك"
];


let currentUser = null;

let currentProfile = {
  name:"عضو",
  photo:""
};

let currentRoom = rooms[0];

let unsubscribePosts = null;
let unsubscribeMembers = null;
let unsubscribeVoice = null;

let currentStream = null;
let mySlot = null;

const voiceIds = [
  "voice1",
  "voice2",
  "voice3",
  "voice4",
  "voice5"
];


function $(id){
  return document.getElementById(id);
}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/[&<>"']/g,char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[char]));

}


function avatarFor(name,photo){

  if(photo){
    return photo;
  }

  return "https://ui-avatars.com/api/?name=" +
    encodeURIComponent(name || "عضو") +
    "&background=1687ff&color=fff";

}


function isAdmin(){

  return !!currentUser &&
    currentUser.uid === ADMIN_UID;

}


function message(text){

  $("authMessage").textContent = text || "";

}


function friendlyError(error){

  const code = error?.code || "";

  const errors = {

    "auth/invalid-credential":
      "البريد الإلكتروني أو كلمة المرور غير صحيحة.",

    "auth/email-already-in-use":
      "البريد الإلكتروني مستخدم مسبقًا.",

    "auth/invalid-email":
      "البريد الإلكتروني غير صحيح.",

    "auth/weak-password":
      "كلمة المرور ضعيفة.",

    "permission-denied":
      "ليس لديك صلاحية لتنفيذ هذه العملية.",

    "storage/unauthorized":
      "ليس لديك صلاحية لرفع الصورة.",

    "storage/canceled":
      "تم إلغاء رفع الصورة.",

    "storage/unknown":
      "حدث خطأ في Storage."

  };

  return errors[code] ||
    error?.message ||
    "حدث خطأ غير معروف.";

}


/* TABS */

document.querySelectorAll(".tab").forEach(tab => {

  tab.addEventListener("click",() => {

    document
      .querySelectorAll(".tab")
      .forEach(x => x.classList.remove("active"));

    document
      .querySelectorAll(".form")
      .forEach(x => x.classList.remove("active"));

    tab.classList.add("active");

    const form =
      $(tab.dataset.tab + "Form");

    if(form){
      form.classList.add("active");
    }

    message("");

  });

});


/* VISITOR */

$("visitorButton").addEventListener("click",async()=>{

  const name =
    $("visitorName").value.trim();

  if(name.length < 2){

    message("اكتب اسمًا من حرفين على الأقل.");

    return;

  }

  localStorage.setItem(
    "visitorName",
    name
  );

  try{

    await signInAnonymously(auth);

  }catch(error){

    console.error(error);

    message("❌ " + friendlyError(error));

  }

});


/* LOGIN */

$("loginButton").addEventListener("click",async()=>{

  const email =
    $("emailInput").value.trim();

  const password =
    $("passwordInput").value;

  if(!email || !password){

    message("أدخل البريد الإلكتروني وكلمة المرور.");

    return;

  }

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(error){

    console.error(error);

    message("❌ " + friendlyError(error));

  }

});


/* SIGNUP */

$("signupButton").addEventListener("click",async()=>{

  const name =
    $("nameInput").value.trim();

  const email =
    $("signupEmail").value.trim();

  const password =
    $("signupPassword").value;

  if(name.length < 2){

    message("الاسم يجب أن يكون حرفين على الأقل.");

    return;

  }

  if(!email){

    message("أدخل البريد الإلكتروني.");

    return;

  }

  if(password.length < 6){

    message("كلمة المرور يجب أن تكون 6 أحرف على الأقل.");

    return;

  }

  try{

    const result =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

    await updateProfile(
      result.user,
      {
        displayName:name
      }
    );

    await setDoc(
      doc(db,"users",result.user.uid),
      {
        uid:result.user.uid,
        name:name,
        email:email,
        photo:"",
        role:"user",
        banned:false,
        createdAt:serverTimestamp()
      },
      {merge:true}
    );

    await setDoc(
      doc(db,"moderation",result.user.uid),
      {
        banned:false,
        micMuted:false,
        updatedAt:serverTimestamp()
      },
      {merge:true}
    );

  }catch(error){

    console.error(error);

    message("❌ " + friendlyError(error));

  }

});


/* PROFILE */

async function loadProfile(user){

  const userRef =
    doc(db,"users",user.uid);

  const snap =
    await getDoc(userRef);

  if(!snap.exists()){

    await setDoc(
      userRef,
      {
        uid:user.uid,
        name:user.isAnonymous
          ? localStorage.getItem("visitorName") || "زائر"
          : user.displayName || "عضو",
        email:user.email || "",
        photo:"",
        role:"user",
        banned:false,
        createdAt:serverTimestamp()
      },
      {merge:true}
    );

  }

  const finalSnap =
    await getDoc(userRef);

  currentProfile =
    finalSnap.exists()
      ? finalSnap.data()
      : {
          name:"عضو",
          photo:""
        };

}


/* AUTH */

onAuthStateChanged(auth,async user=>{

  if(!user){

    currentUser = null;

    $("loginPage").classList.remove("hidden");

    $("chatApp").classList.add("hidden");

    return;

  }

  currentUser = user;

  try{

    await loadProfile(user);

    const moderation =
      await getDoc(
        doc(db,"moderation",user.uid)
      );

    if(
      moderation.exists() &&
      moderation.data().banned === true
    ){

      await signOut(auth);

      message("🚫 هذا الحساب محظور.");

      return;

    }

    $("loginPage").classList.add("hidden");

    $("chatApp").classList.remove("hidden");

    $("currentUsername").textContent =
      currentProfile.name +
      (user.isAnonymous ? " (زائر)" : "");

    $("headerAvatar").src =
      avatarFor(
        currentProfile.name,
        currentProfile.photo
      );

    $("adminBtn").classList.toggle(
      "hidden",
      !isAdmin()
    );

    renderRooms();

    renderVoice();

    loadPosts();

    loadMembers();

  }catch(error){

    console.error(error);

    message("❌ " + friendlyError(error));

  }

});


/* ROOMS */

function renderRooms(){

  const bar =
    $("roomsBar");

  bar.innerHTML = "";

  rooms.forEach(room=>{

    const button =
      document.createElement("button");

    button.className =
      "roomBtn" +
      (room === currentRoom ? " active" : "");

    button.textContent =
      "📍 " + room;

    button.onclick = ()=>{

      currentRoom = room;

      renderRooms();

      loadPosts();

    };

    bar.appendChild(button);

  });

}


/* POSTS */

function loadPosts(){

  if(unsubscribePosts){
    unsubscribePosts();
  }

  const q =
    query(
      collection(db,"messages"),
      where("room","==",currentRoom),
      limit(200)
    );

  unsubscribePosts =
    onSnapshot(
      q,
      snapshot=>{

        const posts = [];

        snapshot.forEach(item=>{

          posts.push({
            id:item.id,
            data:item.data()
          });

        });

        posts.sort((a,b)=>{

          const ta =
            a.data.createdAt?.toMillis?.() || 0;

          const tb =
            b.data.createdAt?.toMillis?.() || 0;

          return ta - tb;

        });

        const feed =
          $("feed");

        feed.innerHTML = "";

        if(!posts.length){

          feed.innerHTML =
            '<div class="empty">لا توجد رسائل بعد.</div>';

          return;

        }

        posts.forEach(item=>{

          const post =
            document.createElement("article");

          post.className = "post";

          const data =
            item.data;

          post.innerHTML = `

            <div class="postHead">

              <img src="${avatarFor(data.name,data.photo)}">

              <div>

                <div class="postName">
                  ${escapeHtml(data.name || "عضو")}
                </div>

                <div class="postRoom">
                  📍 ${escapeHtml(data.room || "")}
                </div>

              </div>

            </div>

            <div class="postText">
              ${escapeHtml(data.text || "")}
            </div>

            <div class="postActions">

              ${
                isAdmin()
                ?
                '<button class="danger" data-delete>🗑️ حذف</button>'
                :
                ''
              }

            </div>

          `;

          const del =
            post.querySelector("[data-delete]");

          if(del){

            del.onclick = async()=>{

              if(!confirm("حذف الرسالة؟")){
                return;
              }

              try{

                await deleteDoc(
                  doc(db,"messages",item.id)
                );

              }catch(error){

                alert(friendlyError(error));

              }

            };

          }

          feed.appendChild(post);

        });

        feed.scrollTop =
          feed.scrollHeight;

      },
      error=>{

        console.error(error);

        $("feed").innerHTML =
          '<div class="empty">❌ ' +
          escapeHtml(friendlyError(error)) +
          '</div>';

      }
    );

}


/* SEND */

async function sendMessage(){

  const input =
    $("messageInput");

  const text =
    input.value.trim();

  if(!text || !currentUser){
    return;
  }

  try{

    const moderation =
      await getDoc(
        doc(db,"moderation",currentUser.uid)
      );

    if(
      moderation.exists() &&
      moderation.data().banned === true
    ){

      alert("🚫 الحساب محظور.");

      return;

    }

    await addDoc(
      collection(db,"messages"),
      {
        uid:currentUser.uid,
        name:currentProfile.name || "عضو",
        photo:currentProfile.photo || "",
        room:currentRoom,
        text:text,
        createdAt:serverTimestamp()
      }
    );

    input.value = "";

  }catch(error){

    console.error(error);

    alert(
      "❌ تعذر إرسال الرسالة:\n" +
      friendlyError(error)
    );

  }

}


$("sendButton").onclick =
  sendMessage;

$("messageInput").addEventListener(
  "keydown",
  event=>{

    if(event.key === "Enter"){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* MEMBERS */

function loadMembers(){

  if(unsubscribeMembers){
    unsubscribeMembers();
  }

  unsubscribeMembers =
    onSnapshot(
      query(
        collection(db,"users"),
        limit(100)
      ),
      snapshot=>{

        $("membersList").innerHTML = "";

        let count = 0;

        snapshot.forEach(item=>{

          const data =
            item.data();

          if(data.banned === true){
            return;
          }

          count++;

          const div =
            document.createElement("div");

          div.className = "member";

          div.innerHTML = `

            <img src="${avatarFor(data.name,data.photo)}">

            <span class="memberName">
              ${escapeHtml(data.name || "عضو")}
            </span>

            <span class="dot"></span>

          `;

          $("membersList")
            .appendChild(div);

        });

        $("onlineCount").textContent =
          count + " عضو";

      },
      error=>{

        console.error(error);

      }
    );

}


/* PROFILE MODAL */

$("profileBtn").onclick = ()=>{

  $("profileName").value =
    currentProfile.name || "";

  $("profilePreview").src =
    avatarFor(
      currentProfile.name,
      currentProfile.photo
    );

  $("profilePhoto").value = "";

  $("profileStatus").textContent = "";

  $("profileModal").classList.add("show");

};


/* IMAGE PREVIEW */

$("profilePhoto").addEventListener(
  "change",
  ()=>{

    const file =
      $("profilePhoto").files[0];

    if(!file){
      return;
    }

    if(!file.type.startsWith("image/")){

      $("profileStatus").textContent =
        "❌ اختر صورة فقط.";

      $("profilePhoto").value = "";

      return;

    }

    if(file.size > 5 * 1024 * 1024){

      $("profileStatus").textContent =
        "❌ الحد الأقصى للصورة 5MB.";

      $("profilePhoto").value = "";

      return;

    }

    $("profilePreview").src =
      URL.createObjectURL(file);

  }
);


/* SAVE PROFILE + STORAGE */

$("saveProfile").onclick =
  async()=>{

    if(!currentUser){
      return;
    }

    const status =
      $("profileStatus");

    try{

      status.textContent =
        "جاري الحفظ...";

      const name =
        $("profileName")
          .value
          .trim();

      if(name.length < 2){

        throw new Error(
          "الاسم يجب أن يكون حرفين على الأقل."
        );

      }

      let photo =
        currentProfile.photo || "";

      const file =
        $("profilePhoto").files[0];

      if(file){

        if(!file.type.startsWith("image/")){

          throw new Error(
            "الملف المختار ليس صورة."
          );

        }

        if(file.size > 5 * 1024 * 1024){

          throw new Error(
            "حجم الصورة أكبر من 5MB."
          );

        }

        /*
          مهم:
          كل مستخدم يرفع داخل مجلده فقط.
        */

        const safeType =
          file.type === "image/png"
            ? "png"
            : file.type === "image/webp"
              ? "webp"
              : "jpg";

        const path =
          "profiles/" +
          currentUser.uid +
          "/avatar_" +
          Date.now() +
          "." +
          safeType;

        const storageRef =
          ref(storage,path);

        await uploadBytes(
          storageRef,
          file,
          {
            contentType:file.type
          }
        );

        photo =
          await getDownloadURL(
            storageRef
          );

      }

      await setDoc(
        doc(
          db,
          "users",
          currentUser.uid
        ),
        {
          uid:currentUser.uid,
          name:name,
          photo:photo
        },
        {merge:true}
      );

      try{

        await updateProfile(
          currentUser,
          {
            displayName:name,
            photoURL:photo || null
          }
        );

      }catch(error){

        console.warn(
          "Auth update:",
          error
        );

      }

      currentProfile = {
        ...currentProfile,
        name:name,
        photo:photo
      };

      $("profilePreview").src =
        avatarFor(name,photo);

      $("headerAvatar").src =
        avatarFor(name,photo);

      $("currentUsername").textContent =
        name +
        (currentUser.isAnonymous
          ? " (زائر)"
          : "");

      status.textContent =
        "✅ تم حفظ الحساب والصورة.";

    }catch(error){

      console.error(
        "PROFILE IMAGE ERROR:",
        error
      );

      status.textContent =
        "❌ " +
        friendlyError(error);

    }

  };


/* ADMIN */

$("adminBtn").onclick =
  async()=>{

    if(!isAdmin()){
      return;
    }

    $("adminModal")
      .classList.add("show");

    await loadAdmin();

  };


async function loadAdmin(){

  $("adminList").innerHTML =
    '<div class="empty">جاري التحميل...</div>';

  try{

    const snapshot =
      await getDocs(
        query(
          collection(db,"users"),
          limit(100)
        )
      );

    $("adminList").innerHTML = "";

    snapshot.forEach(item=>{

      const data =
        item.data();

      const row =
        document.createElement("div");

      row.className =
        "adminRow";

      row.innerHTML = `

        <div class="grow">

          <b>
            ${escapeHtml(data.name || "عضو")}
          </b>

          <div style="font-size:10px;color:#8494a8;word-break:break-all">
            ${escapeHtml(data.uid || "")}
          </div>

        </div>

        <button class="danger">
          حظر
        </button>

      `;

      row.querySelector("button")
        .onclick = async()=>{

          if(data.uid === ADMIN_UID){
            return;
          }

          try{

            await setDoc(
              doc(db,"moderation",data.uid),
              {
                banned:true,
                updatedAt:serverTimestamp()
              },
              {merge:true}
            );

            await loadAdmin();

          }catch(error){

            alert(
              friendlyError(error)
            );

          }

        };

      $("adminList")
        .appendChild(row);

    });

  }catch(error){

    console.error(error);

    $("adminList").innerHTML =
      '<div class="empty">❌ ' +
      escapeHtml(friendlyError(error)) +
      '</div>';

  }

}


/* DELETE ALL */

$("deleteAllBtn").onclick =
  async()=>{

    if(!isAdmin()){
      return;
    }

    if(!confirm(
      "حذف جميع الرسائل؟"
    )){
      return;
    }

    try{

      while(true){

        const snapshot =
          await getDocs(
            query(
              collection(db,"messages"),
              limit(400)
            )
          );

        if(snapshot.empty){
          break;
        }

        const batch =
          writeBatch(db);

        snapshot.forEach(item=>{
          batch.delete(item.ref);
        });

        await batch.commit();

        if(snapshot.size < 400){
          break;
        }

      }

      $("adminStatus").textContent =
        "✅ تم حذف الرسائل.";

    }catch(error){

      $("adminStatus").textContent =
        "❌ " + friendlyError(error);

    }

  };


/* VOICE UI */

function renderVoice(){

  const container =
    $("voiceSlots");

  container.innerHTML = "";

  voiceIds.forEach(id=>{

    const div =
      document.createElement("div");

    div.className =
      "voiceSlot";

    div.id = id;

    div.innerHTML = `

      <div class="micIcon">🎙️</div>

      <div class="voiceName"
           id="${id}Name">
        شاغر
      </div>

      <div class="voiceStatus"
           id="${id}Status">
        اضغط للتحدث
      </div>

      <button id="${id}Btn">
        تشغيل
      </button>

    `;

    $(id+"Btn").onclick =
      ()=>toggleMic(id);

    container.appendChild(div);

  });

  watchVoice();

}


/* VOICE */

function watchVoice(){

  if(unsubscribeVoice){
    unsubscribeVoice();
  }

  unsubscribeVoice =
    onSnapshot(
      collection(db,"voiceSlots"),
      snapshot=>{

        const slots = {};

        snapshot.forEach(item=>{
          slots[item.id] = item.data();
        });

        voiceIds.forEach(id=>{

          const slot =
            $(id);

          const name =
            $(id+"Name");

          const status =
            $(id+"Status");

          const button =
            $(id+"Btn");

          const data =
            slots[id];

          if(!data){

            slot.classList.remove("active");

            name.textContent =
              "شاغر";

            status.textContent =
              "اضغط للتحدث";

            button.textContent =
              "تشغيل";

            return;

          }

          slot.classList.add("active");

          name.textContent =
            data.name || "عضو";

          if(data.uid === currentUser?.uid){

            status.textContent =
              "🎙️ أنت تتحدث";

            button.textContent =
              "إيقاف";

          }else{

            status.textContent =
              "🔊 مباشر";

            button.textContent =
              "استماع";

          }

        });

      },
      error=>{

        console.error(
          "VOICE:",
          error
        );

      }
    );

}


async function toggleMic(slotId){

  if(!currentUser){

    alert("سجل الدخول أولًا.");

    return;

  }

  if(currentUser.isAnonymous){

    alert(
      "استخدام المايك يحتاج عضوية."
    );

    return;

  }

  if(mySlot === slotId){

    await leaveMic();

    return;

  }

  if(mySlot){

    alert(
      "لديك مايك يعمل بالفعل."
    );

    return;

  }

  try{

    const moderation =
      await getDoc(
        doc(
          db,
          "moderation",
          currentUser.uid
        )
      );

    if(moderation.exists()){

      const data =
        moderation.data();

      if(data.banned === true){

        alert("🚫 الحساب محظور.");

        return;

      }

      if(data.micMuted === true){

        alert(
          "🎤 تم منعك من استخدام المايك."
        );

        return;

      }

    }

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "الميكروفون يحتاج HTTPS."
      );

    }

    const slot =
      await getDoc(
        doc(db,"voiceSlots",slotId)
      );

    if(slot.exists()){

      alert("هذا المايك مشغول.");

      return;

    }

    currentStream =
      await navigator.mediaDevices.getUserMedia({
        audio:true,
        video:false
      });

    mySlot = slotId;

    await setDoc(
      doc(db,"voiceSlots",slotId),
      {
        uid:currentUser.uid,
        name:currentProfile.name || "عضو",
        createdAt:serverTimestamp()
      }
    );

  }catch(error){

    if(currentStream){

      currentStream
        .getTracks()
        .forEach(track=>track.stop());

    }

    currentStream = null;

    mySlot = null;

    alert(
      "❌ تعذر تشغيل المايك:\n" +
      friendlyError(error)
    );

  }

}


async function leaveMic(){

  if(!mySlot){

    if(currentStream){

      currentStream
        .getTracks()
        .forEach(track=>track.stop());

      currentStream = null;

    }

    return;

  }

  const slot =
    mySlot;

  try{

    await deleteDoc(
      doc(db,"voiceSlots",slot)
    );

  }catch(error){

    console.warn(error);

  }

  if(currentStream){

    currentStream
      .getTracks()
      .forEach(track=>track.stop());

  }

  currentStream = null;

  mySlot = null;

}


/* CLOSE */

document
  .querySelectorAll("[data-close]")
  .forEach(button=>{

    button.onclick = ()=>{

      const modal =
        $(button.dataset.close);

      if(modal){
        modal.classList.remove("show");
      }

    };

  });


document
  .querySelectorAll(".modal")
  .forEach(modal=>{

    modal.onclick = event=>{

      if(event.target === modal){

        modal.classList.remove("show");

      }

    };

  });


/* LOGOUT */

$("logoutButton").onclick =
  async()=>{

    await leaveMic();

    if(unsubscribePosts){
      unsubscribePosts();
    }

    if(unsubscribeMembers){
      unsubscribeMembers();
    }

    if(unsubscribeVoice){
      unsubscribeVoice();
    }

    await signOut(auth);

  };


window.addEventListener(
  "beforeunload",
  ()=>{

    if(currentStream){

      currentStream
        .getTracks()
        .forEach(track=>track.stop());

    }

  }
);

</script>
