<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>كرار جاسم</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:Arial,Tahoma,sans-serif;
  background:#070b12;
  color:#fff;
}

body{
  background:
    linear-gradient(135deg,#06101dcc,#101827dd),
    url("https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=1800&q=80")
    center/cover fixed no-repeat;
}

button,input{font-family:inherit}
button{cursor:pointer}
.hidden{display:none!important}

:root{
  --panel:#101925ed;
  --panel2:#182333ee;
  --line:#314156;
  --blue:#1687ff;
  --green:#27c47b;
  --red:#c83b4a;
  --muted:#9aa9bb;
}

/* LOGIN */

#loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.loginBox{
  width:100%;
  max-width:440px;
  background:var(--panel);
  padding:24px;
  border-radius:22px;
  border:1px solid #ffffff20;
  box-shadow:0 20px 70px #000b;
  backdrop-filter:blur(12px);
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:900;
  margin-bottom:6px;
}

.description{
  text-align:center;
  color:#c5d0dc;
  line-height:1.7;
  margin-bottom:18px;
}

.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-bottom:12px;
}

.tab,.btn{
  border:0;
  border-radius:10px;
  padding:12px;
  font-weight:bold;
}

.tab{
  background:#1a2635;
  color:#ccd7e4;
  border:1px solid var(--line);
}

.tab.active,
.primary{
  background:var(--blue);
  color:#fff;
}

.form{display:none}
.form.active{display:block}

.loginBox input,
.composer input,
.profileBox input,
.dmComposer input{
  width:100%;
  padding:13px;
  margin:5px 0;
  border:1px solid var(--line);
  border-radius:10px;
  background:#0b121c;
  color:#fff;
  outline:none;
}

.btn{
  width:100%;
  margin-top:7px;
  color:#fff;
}

.secondary{background:#293648}

.status{
  text-align:center;
  color:#79e2aa;
  font-size:12px;
  margin-top:10px;
}

#authMessage{
  text-align:center;
  min-height:24px;
  color:#ffb4b4;
  margin-top:10px;
}

/* APP */

#chatApp{
  height:100vh;
  display:flex;
  flex-direction:column;
}

.header{
  min-height:64px;
  background:#0e1723ed;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px;
  gap:8px;
  backdrop-filter:blur(10px);
}

.headerUser{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}

.headerAvatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#26364a;
}

.title{
  font-size:20px;
  font-weight:900;
}

.username{
  font-size:12px;
  color:#72e3a4;
  margin-top:2px;
}

.headerActions{
  display:flex;
  gap:6px;
  align-items:center;
  flex-wrap:wrap;
}

.iconBtn{
  border:0;
  background:#223044;
  color:#fff;
  padding:9px 10px;
  border-radius:9px;
}

.logout{background:#a82f3c}
.adminBtn{background:#8a5cf6}

/* VOICE */

.voicePanel{
  background:#0d1622e8;
  border-bottom:1px solid var(--line);
  padding:9px;
}

.voiceTitle{
  text-align:center;
  font-weight:bold;
  color:#dbe6f2;
  margin-bottom:7px;
}

.voiceSlots{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}

.voiceSlot{
  min-height:82px;
  background:#172233;
  border:1px solid var(--line);
  border-radius:12px;
  padding:7px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
}

.voiceSlot.active{
  border-color:var(--green);
  box-shadow:0 0 0 1px #27c47b33;
}

.micIcon{font-size:25px}

.voiceName{
  font-size:11px;
  color:#c0cad6;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.voiceStatus{
  font-size:10px;
  color:#8797aa;
  text-align:center;
}

.voiceSlot button{
  border:0;
  border-radius:8px;
  padding:6px 8px;
  background:var(--blue);
  color:#fff;
  font-size:11px;
  font-weight:bold;
}

.voiceSlot.active button{
  background:var(--red);
}

/* ROOMS */

.roomsBar{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:8px;
  background:#0c1420e8;
  border-bottom:1px solid var(--line);
  scrollbar-width:none;
}

.roomsBar::-webkit-scrollbar{display:none}

.roomBtn{
  white-space:nowrap;
  border:1px solid var(--line);
  background:#182333;
  color:#dce7f4;
  border-radius:9px;
  padding:8px 11px;
}

.roomBtn.active{
  background:#1687ff;
  border-color:#1687ff;
}

/* CONTENT */

.content{
  flex:1;
  display:flex;
  min-height:0;
  overflow:hidden;
}

.feed{
  flex:1;
  overflow-y:auto;
  padding:12px;
  background:#0005;
}

.side{
  width:250px;
  background:#0e1724e8;
  border-right:1px solid var(--line);
  overflow-y:auto;
  padding:10px;
}

.sideTitle{
  font-weight:bold;
  margin:5px 0 10px;
}

.onlineCount{
  color:#74e2a5;
  font-size:12px;
  margin-bottom:8px;
}

.member{
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px;
  border-radius:9px;
  background:#162131;
  margin-bottom:6px;
  cursor:pointer;
}

.member:hover{background:#213047}

.member img{
  width:34px;
  height:34px;
  border-radius:50%;
  object-fit:cover;
}

.memberName{
  font-size:12px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#35d47f;
  margin-right:auto;
}

.composer{
  display:flex;
  gap:7px;
  padding:8px;
  background:#111a26ee;
  border-top:1px solid var(--line);
  align-items:center;
}

.composer input{
  margin:0;
  flex:1;
}

.send{
  width:48px;
  height:46px;
  border:0;
  border-radius:10px;
  background:var(--blue);
  color:#fff;
  font-size:18px;
}

.replyBar{
  background:#1c2a3c;
  border-top:1px solid #3a4d64;
  padding:7px 10px;
  font-size:12px;
  display:none;
}

.replyBar.show{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.cancelReply{
  border:0;
  background:transparent;
  color:#ff9ca6;
}

/* POSTS */

.post{
  background:#101a27ed;
  border:1px solid #ffffff12;
  border-radius:14px;
  padding:10px;
  margin-bottom:10px;
  box-shadow:0 7px 25px #0003;
}

.postHead{
  display:flex;
  gap:8px;
  align-items:center;
}

.postHead img{
  width:40px;
  height:40px;
  border-radius:50%;
  object-fit:cover;
}

.postMeta{
  min-width:0;
}

.postName{
  font-weight:bold;
  color:#75b7ff;
}

.postRoom{
  font-size:10px;
  color:#7f90a5;
}

.postText{
  white-space:pre-wrap;
  word-break:break-word;
  line-height:1.55;
  margin:9px 0;
}

.postActions{
  display:flex;
  gap:6px;
  border-top:1px solid #ffffff10;
  padding-top:7px;
  margin-top:7px;
}

.postActions button{
  border:0;
  border-radius:8px;
  background:#1d2a3b;
  color:#dce7f4;
  padding:7px 10px;
}

.empty{
  text-align:center;
  color:#7f8da0;
  padding:35px 10px;
}

/* MODALS */

.modal{
  position:fixed;
  inset:0;
  z-index:10000;
  background:#000c;
  display:none;
  align-items:center;
  justify-content:center;
  padding:12px;
  backdrop-filter:blur(7px);
}

.modal.show{display:flex}

.box{
  width:100%;
  max-width:620px;
  max-height:94vh;
  overflow:auto;
  background:#0f1825;
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
  box-shadow:0 25px 80px #000;
}

.boxHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.boxTitle{
  font-size:20px;
  font-weight:bold;
}

.close{
  border:0;
  background:var(--red);
  color:#fff;
  border-radius:9px;
  width:38px;
  height:38px;
  font-size:22px;
}

.profileBox{text-align:center}

.profilePreview{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #315273;
  margin:5px auto 10px;
  display:block;
}

.profileBox label{
  display:block;
  text-align:right;
  font-size:12px;
  color:#aebbc9;
  margin-top:8px;
}

#profileStatus{
  min-height:22px;
  margin-top:8px;
  font-size:12px;
}

/* ADMIN */

.adminList{
  max-height:360px;
  overflow:auto;
}

.adminRow{
  display:flex;
  align-items:center;
  gap:6px;
  background:#172333;
  padding:8px;
  border-radius:10px;
  margin-bottom:7px;
}

.adminRow .grow{
  flex:1;
  min-width:0;
}

.adminRow button{
  border:0;
  border-radius:8px;
  padding:7px;
  font-size:11px;
  color:#fff;
}

.danger{background:var(--red)}
.ok{background:#218c60}
.neutral{background:#334258}

/* DM */

.dmLayout{
  display:grid;
  grid-template-columns:180px 1fr;
  gap:8px;
  min-height:430px;
}

.dmList{
  background:#121d2a;
  border-radius:10px;
  padding:7px;
  overflow:auto;
}

.dmUser{
  padding:8px;
  border-radius:8px;
  background:#1b2939;
  margin-bottom:5px;
  cursor:pointer;
}

.dmUser.active{background:#1687ff}

.dmChat{
  display:flex;
  flex-direction:column;
  background:#0b131e;
  border-radius:10px;
  min-width:0;
}

.dmMessages{
  flex:1;
  overflow:auto;
  padding:8px;
}

.dmMsg{
  background:#182537;
  border-radius:9px;
  padding:7px;
  margin-bottom:6px;
  max-width:82%;
  font-size:13px;
}

.dmMsg.mine{
  margin-right:auto;
  background:#174a77;
}

.dmComposer{
  display:flex;
  gap:5px;
  padding:7px;
}

.dmComposer input{
  flex:1;
  margin:0;
}

.dmComposer button{
  border:0;
  border-radius:8px;
  background:var(--blue);
  color:#fff;
  padding:0 14px;
}

/* MOBILE */

@media(max-width:760px){

  .side{
    display:none;
  }

  .voiceSlots{
    grid-template-columns:repeat(5,90px);
    overflow-x:auto;
  }

  .header .title{
    font-size:17px;
  }

  .headerActions .iconBtn{
    padding:7px;
  }

  .dmLayout{
    grid-template-columns:1fr;
  }

  .dmList{
    max-height:120px;
    display:flex;
    overflow-x:auto;
    gap:5px;
  }

  .dmUser{
    min-width:110px;
  }

}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage">

  <div class="loginBox">

    <div class="logo">كرار جاسم</div>

    <div class="description">

    <div class="tabs">

    </div>

      <input id="visitorName" placeholder="اسم الزائر" maxlength="30">
      <button id="visitorButton" class="btn primary">

      </button>
    </div>

    <div id="loginForm" class="form">

      <input
        id="emailInput"
        type="email"
        placeholder="البريد الإلكتروني"
      >

      <input
        id="passwordInput"
        type="password"
        placeholder="كلمة المرور"
      >

      <button id="loginButton" class="btn primary">

      </button>

    </div>

    <div id="signupForm" class="form">

      <input
        id="nameInput"
        placeholder="اسم العضو"

      <input
        id="signupEmail"
        type="email"

      >

      <input
        id="signupPassword"

      >

      <button id="signupButton" class="btn primary">
        إنشاء العضوية
      </button>

    </div>

    <div id="authMessage"></div>

    <div class="status">

    </div>

  </div>

</div>


<!-- APP -->

<div id="chatApp" class="hidden">

  <header class="header">

        </div>
      </div>

    </div>

    <div class="headerActions">

      <button id="profileBtn" class="iconBtn">

      </button>

      <button id="dmBtn" class="iconBtn">

      </button>

      <button id="adminBtn" class="iconBtn adminBtn hidden">

      </button>

      <button id="logoutButton" class="iconBtn logout">
        خروج
      </button>

    </div>

  </header>


  <!-- VOICE -->

  <section class="voicePanel">

    <div class="voiceTitle">
      🎙️ البث الصوتي — 5 مايكات

    <div id="voiceSlots" class="voiceSlots"></div>

  </section>


  <!-- ROOMS -->

  <!-- CONTENT -->

  <main class="content">

      <div class="empty">

    </section>


    <aside class="side">

      <div class="sideTitle">
        👥 الموجودون الآن
      </div>

      <div id="onlineCount" class="onlineCount">

  <div id="replyBar" class="replyBar">

    </button>

  </div>


  <div class="composer">

    <input
      id="messageInput"
      placeholder="اكتب رسالة في الغرفة..."
      maxlength="2000"
    >

    <button
      id="sendButton"
      class="send"
    >
      ➤
    </button>

  </div>

</div>


<!-- PROFILE -->

<div id="profileModal" class="modal">

  <div class="box profileBox">

    <div class="boxHead">

      <div class="boxTitle">
        👤 حسابي
      </div>

      <button
        class="close"
        data-close="profileModal"
      >
        ×
      </button>

    </div>

    <img
      id="profilePreview"
      class="profilePreview"
      src=""
    >

    <label>الاسم</label>

    <input
      id="profileName"
      maxlength="30"
    >

    <label>الصورة الشخصية</label>

    <input
      id="profilePhoto"
      type="file"
      accept="image/*"
    >

    <button
      id="saveProfile"
      class="btn primary"
    >
      حفظ التغييرات
    </button>

    <div id="profileStatus"></div>

  </div>

</div>


<!-- DM -->

<div id="dmModal" class="modal">

  <div class="box">

    <div class="boxHead">

      <div class="boxTitle">
        💬 المحادثة الخاصة
      </div>

      <button
        class="close"
        data-close="dmModal"
      >
        ×
      </button>

    </div>

    <div class="dmLayout">

      <div id="dmList" class="dmList">
        <div class="empty">
          اختر عضوًا
        </div>
      </div>

      <div class="dmChat">

        <div id="dmMessages" class="dmMessages">

          <div class="empty">
            اختر عضوًا لبدء المحادثة
          </div>

        </div>

        <div class="dmComposer">

          <input
            id="dmInput"
            placeholder="رسالة خاصة..."
            maxlength="2000"
          >

          <button id="dmSend">
            إرسال
          </button>

        </div>

      </div>

    </div>

  </div>

</div>


<!-- ADMIN -->

<div id="adminModal" class="modal">

  <div class="box">

    <div class="boxHead">

      <div class="boxTitle">
        🛡️ لوحة الإشراف
      </div>

      <button
        class="close"
        data-close="adminModal"
      >
        ×
      </button>

    </div>

    <button
      id="deleteAllBtn"
      class="btn danger"
    >
      🗑️ حذف جميع الرسائل
    </button>

    <div
      id="adminStatus"
      style="text-align:center;color:#9fb0c2;margin:8px"
    ></div>

    <div
      class="adminList"
      id="adminList"
    ></div>

  </div>

</div>

function escapeHtml(value){

  return String(value ?? "")
    .replace(/[&<>"']/g, char => {

      const map = {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      };

      return map[char];

function avatarFor(name, photo){

  if(photo && String(photo).trim()){
    return photo;
  }

  return "https://ui-avatars.com/api/?name=" +
    encodeURIComponent(name || "عضو") +
    "&background=1687ff&color=fff";

}

function friendlyError(error){

  const code = error?.code || "";

  const map = {

    "auth/invalid-credential":
      "البريد الإلكتروني أو كلمة المرور غير صحيحة.",

    "auth/wrong-password":
      "كلمة المرور غير صحيحة.",

    "auth/user-not-found":
      "الحساب غير موجود.",

    "auth/email-already-in-use":
      "البريد الإلكتروني مستخدم مسبقًا.",

    "auth/invalid-email":
      "البريد الإلكتروني غير صحيح.",

    "auth/weak-password":
      "كلمة المرور ضعيفة.",

    "permission-denied":
      "ليس لديك صلاحية لتنفيذ هذه العملية."

  };

  return map[code] || error?.message || "حدث خطأ غير معروف.";

}

async function ensureProfile(user, fallbackName){

  const userRef =
    doc(db, "users", user.uid);

  const snap =
    await getDoc(userRef);

  if(!snap.exists()){

    const name =
      fallbackName ||
      user.displayName ||
      "عضو";

    await setDoc(
      userRef,
      {
        uid:user.uid,
        name:name,
        email:user.email || "",
        photo:"",
        role:"user",
        banned:false,
        createdAt:serverTimestamp()
      },
      {merge:true}
    );

  }

  const finalSnap =
    await getDoc(userRef);

  if(finalSnap.exists()){

    currentProfile =
      finalSnap.data();

  }else{

    currentProfile = {
      name:fallbackName || "عضو",
      photo:""
    };

  }

}

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      currentUser = null;

        .classList.remove("hidden");

      $("chatApp")
        .classList.add("hidden");

      return;
    }

    currentUser = user;

      localStorage.getItem("visitorName") ||

        user.isAnonymous
          ? visitorName

      const moderation =
        await getDoc(
          doc(db,"moderation",user.uid)

        moderation.data().banned === true
      ){

        await signOut(auth);

        showAuthMessage(
          "🚫 هذا الحساب محظور."
        );

        return;
      }

      showApp();

    }catch(error){

      console.error(error);

      showAuthMessage(

        friendlyError(error)
      );

    }

  }

/* =========================================================
   LOAD POSTS
   تم تغيير الاستعلام:
   لا نستخدم where + orderBy معًا حتى
   لا تتعطل الرسائل بسبب Composite Index.
========================================================= */

function loadPosts(){

  if(unsubscribePosts){

    unsubscribePosts();

    unsubscribePosts = null;

  }

  $("feed").innerHTML =
    '<div class="empty">جاري تحميل الرسائل...</div>';

  const q =
    query(
      collection(db,"messages"),
      where("room","==",currentRoom),
      limit(200)
    );

  unsubscribePosts =
    onSnapshot(
      q,
      snapshot => {

        const posts = [];

        snapshot.forEach(item => {

          posts.push({
            id:item.id,
            data:item.data()
          });

        });

        posts.sort((a,b) => {

          const ta =
            a.data.createdAt?.toMillis?.() || 0;

          const tb =
            b.data.createdAt?.toMillis?.() || 0;

          return ta - tb;

        });

        const feed =
          $("feed");

        feed.innerHTML = "";

        if(posts.length === 0){

          feed.innerHTML =
            '<div class="empty">لا توجد رسائل في هذه الغرفة بعد.</div>';

          return;
        }

        posts.forEach(item => {

          renderChatMessage(
            item.id,
            item.data
          );

        });

        requestAnimationFrame(() => {

          feed.scrollTop =
            feed.scrollHeight;

        });

      },
      error => {

        console.error(
          "messages snapshot error:",
          error
        );

        $("feed").innerHTML =
          '<div class="empty">❌ تعذر تحميل الرسائل: ' +
          escapeHtml(friendlyError(error)) +
          '</div>';

      }
    );

}

function renderChatMessage(id,data){

  const element =
    document.createElement("article");

  element.className = "post";

  let date = "الآن";

  if(data.createdAt?.toDate){

    date =
      data.createdAt
        .toDate()
        .toLocaleString("ar-IQ");

  }

  const deleteButton =
    isAdmin()
      ? '<button data-delete class="danger">🗑️ حذف</button>'
      : "";

  element.innerHTML = `

    <div class="postHead">

      <img
        src="${avatarFor(data.name,data.photo)}"
      >

      <div class="postMeta">

        <div class="postName">
          ${escapeHtml(data.name || "عضو")}
        </div>

        <div class="postRoom">
          📍 ${escapeHtml(data.room || currentRoom)}
          ·
          ${escapeHtml(date)}
        </div>

      </div>

    </div>

    <div class="postText">
      ${escapeHtml(data.text || "")}
    </div>

    ${
      data.replyTo
      ?
      `
      <div class="roomIntro">
        ↩️ رد على:
        <b>${escapeHtml(data.replyTo)}</b>
      </div>
      `
      :
      ""
    }

    <div class="postActions">

      ${deleteButton}

      <button data-reply>
        ↩️ رد
      </button>

    </div>

  `;


  const deleteButtonElement =
    element.querySelector("[data-delete]");

  if(deleteButtonElement){

    deleteButtonElement.addEventListener(
      "click",
      async () => {

        if(!confirm("حذف الرسالة؟")){
          return;
        }

        try{

          await deleteDoc(
            doc(db,"messages",id)
          );

        }catch(error){

          alert(
            "تعذر حذف الرسالة: " +
            friendlyError(error)
          );

        }

      }
    );

  }


  const replyButton =
    element.querySelector("[data-reply]");

  if(replyButton){

    replyButton.addEventListener(
      "click",
      () => {

        replyTo = {
          name:data.name || "عضو"
        };

        $("replyText").textContent =
          "↩️ الرد على: " +
          (data.name || "عضو");

        $("replyBar")
          .classList.add("show");

        $("messageInput").focus();

      }
    );

  }


  $("feed").appendChild(element);

}

/* =========================================================
   SAVE PROFILE
========================================================= */

$("saveProfile").addEventListener(
  "click",
  async () => {

    if(!currentUser){
      return;
    }

    const status =
      $("profileStatus");

    try{

      status.textContent =
        "جاري الحفظ...";


      const name =
        $("profileName")
          .value
          .trim();


      if(name.length < 2){

        throw new Error(
          "الاسم يجب أن يكون حرفين على الأقل."
        );

      }


      let photo =
        currentProfile.photo || "";


      const file =
        $("profilePhoto").files[0];


      /* رفع الصورة */

      if(file){

        if(!file.type.startsWith("image/")){

          throw new Error(
            "الملف المختار ليس صورة."
          );

        }

        if(file.size > 5 * 1024 * 1024){

          throw new Error(
            "حجم الصورة أكبر من 5MB."
          );

        }


        const extension =
          file.name
            .split(".")
            .pop()
            .replace(/[^a-zA-Z0-9]/g,"");


        const filePath =
          "profiles/" +
          currentUser.uid +
          "/avatar_" +
          Date.now() +
          "." +
          (extension || "jpg");


        const storageRef =
          ref(
            storage,
            filePath
          );


        await uploadBytes(
          storageRef,
          file,
          {
            contentType:file.type
          }
        );


        photo =
          await getDownloadURL(
            storageRef
          );

      }


      /* تحديث Firestore */

      await setDoc(
        doc(
          db,
          "users",
          currentUser.uid
        ),
        {
          uid:currentUser.uid,
          name:name,
          photo:photo
        },
        {
          merge:true
        }
      );


      /* تحديث Firebase Auth */

      try{

        await updateProfile(
          currentUser,
          {
            displayName:name,
            photoURL:photo || null
          }
        );

      }catch(error){

        console.warn(
          "Auth profile update:",
          error
        );

      }


      currentProfile = {
        ...currentProfile,
        name:name,
        photo:photo
      };


      $("profileName").value =
        name;

      $("profilePreview").src =
        avatarFor(name,photo);

      $("headerAvatar").src =
        avatarFor(name,photo);

      $("currentUsername").textContent =
        name +
        (currentUser.isAnonymous
          ? " (زائر)"
          : "");


      status.textContent =
        "✅ تم حفظ الحساب والصورة بنجاح.";

    }catch(error){

      console.error(
        "PROFILE SAVE ERROR:",
        error
      );

      status.textContent =
        "❌ " +
        friendlyError(error);

    }

  }
);

async function loadAdmin(){

  $("adminList").innerHTML =
    '<div class="empty">جاري التحميل...</div>';

  try{

    const snapshot =
      await getDocs(
        query(
          collection(db,"users"),
          limit(100)
        )
      );

    $("adminList").innerHTML = "";

    snapshot.forEach(item => {

      const data =
        item.data();

      const row =
        document.createElement("div");

      row.className =
        "adminRow";

      row.innerHTML = `

        <div class="grow">

          <b>
            ${escapeHtml(data.name || "عضو")}
          </b>

          <div style="font-size:10px;color:#8494a8;word-break:break-all">
            ${escapeHtml(data.uid || "")}
          </div>

        </div>

        <button class="neutral">
          مايك
        </button>

        <button class="danger">
          حظر
        </button>

      `;


      row.children[1].addEventListener(
        "click",
        () => toggleMute(data.uid)
      );


      row.children[2].addEventListener(
        "click",
        () => toggleBan(data.uid)
      );


      $("adminList")
        .appendChild(row);

    });

  }catch(error){

    console.error(error);

    $("adminList").innerHTML =
      '<div class="empty">❌ تعذر تحميل لوحة الإشراف.</div>';

  }

}


/* =========================================================
   MUTE
========================================================= */

async function toggleMute(uid){

  if(!isAdmin() || uid === ADMIN_UID){
    return;
  }

  try{

    const moderationRef =
      doc(db,"moderation",uid);

    const snap =
      await getDoc(
        moderationRef
      );

    const newValue =
      !(snap.exists() &&
        snap.data().micMuted === true);


    await setDoc(
      moderationRef,
      {
        micMuted:newValue,
        updatedAt:serverTimestamp()
      },
      {
        merge:true
      }
    );


    await loadAdmin();

  }catch(error){

    alert(
      "❌ تعذر تغيير حالة المايك:\n" +
      friendlyError(error)
    );

  }

}

/* =========================================================
   DELETE ALL MESSAGES
========================================================= */

$("deleteAllBtn").addEventListener(
  "click",
  async () => {

    if(!isAdmin()){
      return;
    }

    if(
      !confirm(
        "سيتم حذف جميع رسائل الدردشة. هل أنت متأكد؟"
      )
    ){
      return;
    }

    const status =
      $("adminStatus");

    status.textContent =
      "جاري الحذف...";

    try{

      let total = 0;

      while(true){

        const snapshot =
          await getDocs(
            query(
              collection(db,"messages"),
              limit(400)
            )
          );

        if(snapshot.empty){
          break;
        }

        const batch =
          writeBatch(db);

        snapshot.forEach(item => {

          batch.delete(item.ref);

        });

        await batch.commit();

        total += snapshot.size;

        if(snapshot.size < 400){
          break;
        }

      }

      status.textContent =
        "✅ تم حذف " +
        total +
        " رسالة.";

    }catch(error){

      console.error(error);

      status.textContent =
        "❌ " +
        friendlyError(error);

    }

  }
);

/* =========================================================
   VOICE COLLECTION
========================================================= */

function voicePeerCollection(slotId){

  return collection(
    db,
    "voiceCalls",
    slotId,
    "peers"
  );

}


/* =========================================================
   WEBRTC CLEANUP
========================================================= */

function cleanupPeer(key){

  const pc =
    peerConnections.get(key);

  if(pc){

    try{

      pc.onicecandidate = null;
      pc.ontrack = null;
      pc.close();

    }catch(error){

      console.warn(error);

    }

    peerConnections.delete(key);

  }


  const unsubscribers =
    candidateUnsubscribers.get(key) || [];

  unsubscribers.forEach(fn => {

    try{
      fn();
    }catch(error){}

  });

  candidateUnsubscribers.delete(key);


  const audio =
    remoteAudioEls.get(key);

  if(audio){

    try{

      audio.pause();
      audio.srcObject = null;
      audio.remove();

    }catch(error){}

    remoteAudioEls.delete(key);

  }

}


/* =========================================================
   STOP SLOT LISTENING
========================================================= */

function stopAllListeningForSlot(slotId){

  for(
    const [key]
    of peerConnections.entries()
  ){

    if(key.startsWith(slotId + "_")){

      cleanupPeer(key);

    }

  }

}


/* =========================================================
   CREATE PEER
========================================================= */

function createPeer(slotId,peerUid,role){

  const key =
    slotId +
    "_" +
    peerUid +
    "_" +
    role;


  if(peerConnections.has(key)){

    return {
      pc:peerConnections.get(key),
      key:key
    };

  }


  const pc =
    new RTCPeerConnection({

      iceServers:[
        {
          urls:"stun:stun.l.google.com:19302"
        },
        {
          urls:"stun:stun1.l.google.com:19302"
        }
      ]

    });


  peerConnections.set(
    key,
    pc
  );


  return {
    pc,
    key
  };

}


/* =========================================================
   ADD ICE
========================================================= */

async function addIce(pc,candidate){

  if(!candidate){
    return;
  }

  try{

    await pc.addIceCandidate(
      new RTCIceCandidate(candidate)
    );

  }catch(error){

    console.warn(
      "ICE error:",
      error
    );

  }

}


/* =========================================================
   SPEAKER PUBLISH
========================================================= */

async function publishToListeners(slotId){

  if(!currentStream || !currentUser){
    return;
  }


  const snapshot =
    await getDocs(
      voicePeerCollection(slotId)
    );


  for(const peerDoc of snapshot.docs){

    const listenerUid =
      peerDoc.id;

    if(
      listenerUid === currentUser.uid
    ){
      continue;
    }


    const peerData =
      peerDoc.data();


    if(
      peerData.speaker === currentUser.uid &&
      peerData.offer
    ){
      continue;
    }


    const {
      pc,
      key
    } =
      createPeer(
        slotId,
        listenerUid,
        "caller"
      );


    currentStream
      .getTracks()
      .forEach(track => {

        pc.addTrack(
          track,
          currentStream
        );

      });


    const callerCandidates =
      collection(
        db,
        "voiceCalls",
        slotId,
        "peers",
        listenerUid,
        "callerCandidates"
      );


    const calleeCandidates =
      collection(
        db,
        "voiceCalls",
        slotId,
        "peers",
        listenerUid,
        "calleeCandidates"
      );


    pc.onicecandidate =
      async event => {

        if(!event.candidate){
          return;
        }

        try{

          await addDoc(
            callerCandidates,
            {
              candidate:
                event.candidate.toJSON(),
              from:
                currentUser.uid,
              createdAt:
                serverTimestamp()
            }
          );

        }catch(error){

          console.warn(error);

        }

      };


    const unsubscribe =
      onSnapshot(
        calleeCandidates,
        snapshot => {

          snapshot
            .docChanges()
            .forEach(change => {

              if(
                change.type === "added"
              ){

                const candidate =
                  change.doc.data()
                    .candidate;

                addIce(
                  pc,
                  candidate
                );

              }

            });

        }
      );


    candidateUnsubscribers.set(
      key,
      [unsubscribe]
    );


    const offer =
      await pc.createOffer();


    await pc.setLocalDescription(
      offer
    );


    await setDoc(
      doc(
        db,
        "voiceCalls",
        slotId,
        "peers",
        listenerUid
      ),
      {
        speaker:
          currentUser.uid,

        offer:{
          type:offer.type,
          sdp:offer.sdp
        },

        updatedAt:
          serverTimestamp()

      },
      {
        merge:true
      }
    );


    /* مراقبة answer */

    const peerRef =
      doc(
        db,
        "voiceCalls",
        slotId,
        "peers",
        listenerUid
      );


    const answerUnsubscribe =
      onSnapshot(
        peerRef,
        async peerSnapshot => {

          if(!peerSnapshot.exists()){
            return;
          }

          const data =
            peerSnapshot.data();

          if(
            data.answer &&
            pc.signalingState ===
              "have-local-offer"
          ){

            try{

              await pc.setRemoteDescription(
                new RTCSessionDescription(
                  data.answer
                )
              );

            }catch(error){

              console.warn(
                "answer error:",
                error
              );

            }

          }

        }
      );


    const old =
      candidateUnsubscribers.get(key) || [];

    candidateUnsubscribers.set(
      key,
      [
        ...old,
        answerUnsubscribe
      ]
    );

  }

}


/* =========================================================
   LISTEN TO SPEAKER
========================================================= */

async function startListening(
  slotId,
  speakerUid
){

  if(!currentUser){
    return;
  }

  if(speakerUid === currentUser.uid){
    return;
  }


  try{

    const peerRef =
      doc(
        db,
        "voiceCalls",
        slotId,
        "peers",
        currentUser.uid
      );


    /* المستمع ينشئ مكان الإشارة */

    await setDoc(
      peerRef,
      {
        listener:
          currentUser.uid,

        joinedAt:
          serverTimestamp()

      },
      {
        merge:true
      }
    );


    const key =
      slotId +
      "_" +
      currentUser.uid +
      "_callee";


    if(peerConnections.has(key)){

      $(""+slotId+"Status").textContent =
        "🔊 جاري الاستماع";

      return;

    }


    const {
      pc
    } =
      createPeer(
        slotId,
        currentUser.uid,
        "callee"
      );


    pc.ontrack =
      event => {

        const stream =
          event.streams?.[0];

        if(!stream){
          return;
        }


        let audio =
          remoteAudioEls.get(key);


        if(!audio){

          audio =
            document.createElement(
              "audio"
            );

          audio.autoplay = true;

          audio.playsInline = true;

          audio.controls = false;

          audio.volume = 1;

          audio.style.display =
            "none";

          document.body.appendChild(
            audio
          );

          remoteAudioEls.set(
            key,
            audio
          );

        }


        audio.srcObject =
          stream;


        audio.play().catch(() => {

          /*
            بعض أجهزة iPhone تحتاج
            تفاعل المستخدم مع الصفحة.
            الضغط على زر الاستماع يعتبر
            تفاعلًا مباشرًا.
          */

        });

      };


    const callerCandidates =
      collection(
        db,
        "voiceCalls",
        slotId,
        "peers",
        currentUser.uid,
        "callerCandidates"
      );


    const calleeCandidates =
      collection(
        db,
        "voiceCalls",
        slotId,
        "peers",
        currentUser.uid,
        "calleeCandidates"
      );


    pc.onicecandidate =
      async event => {

        if(!event.candidate){
          return;
        }

        try{

          await addDoc(
            calleeCandidates,
            {
              candidate:
                event.candidate.toJSON(),

              from:
                currentUser.uid,

              createdAt:
                serverTimestamp()
            }
          );

        }catch(error){

          console.warn(error);

        }

      };


    const callerUnsubscribe =
      onSnapshot(
        callerCandidates,
        snapshot => {

          snapshot
            .docChanges()
            .forEach(change => {

              if(
                change.type === "added"
              ){

                addIce(
                  pc,
                  change.doc.data().candidate
                );

              }

            });

        }
      );


    const peerUnsubscribe =
      onSnapshot(
        peerRef,
        async snapshot => {

          if(!snapshot.exists()){
            return;
          }

          const data =
            snapshot.data();


          if(
            data.offer &&
            pc.signalingState ===
              "stable"
          ){

            try{

              await pc.setRemoteDescription(
                new RTCSessionDescription(
                  data.offer
                )
              );


              const answer =
                await pc.createAnswer();


              await pc.setLocalDescription(
                answer
              );


              await updateDoc(
                peerRef,
                {
                  answer:{
                    type:answer.type,
                    sdp:answer.sdp
                  },

                  answerBy:
                    currentUser.uid,

                  answerAt:
                    serverTimestamp()
                }
              );


              const status =
                $(slotId + "Status");

              if(status){

                status.textContent =
                  "🔊 جاري الاستماع";

              }

            }catch(error){

              console.error(
                "WEBRTC ANSWER ERROR:",
                error
              );

            }

          }

        }
      );


    candidateUnsubscribers.set(
      key,
      [
        callerUnsubscribe,
        peerUnsubscribe
      ]
    );


  }catch(error){

    console.error(
      "LISTEN ERROR:",
      error
    );

    alert(
      "❌ تعذر تشغيل الاستماع:\n" +
      friendlyError(error)
    );

  }

}


/* =========================================================
   WATCH VOICE
========================================================= */

function watchVoice(){

  if(unsubscribeVoice){

    unsubscribeVoice();

    unsubscribeVoice = null;

  }


  unsubscribeVoice =
    onSnapshot(
      collection(db,"voiceSlots"),
      snapshot => {

        const slots = {};

        snapshot.forEach(item => {

          slots[item.id] =
            item.data();

        });


        voiceIds.forEach(slotId => {

          const element =
            $(slotId);

          if(!element){
            return;
          }


          const button =
            $(slotId + "Btn");

          const name =
            $(slotId + "Name");

          const status =
            $(slotId + "Status");


          const data =
            slots[slotId];


          if(!data){

            element
              .classList
              .remove("active");

            name.textContent =
              "شاغر";

            status.textContent =
              "اضغط للتحدث";

            button.textContent =
              "تشغيل";

            button.disabled =
              false;


            stopAllListeningForSlot(
              slotId
            );


            return;

          }


          element
            .classList
            .add("active");


          name.textContent =
            data.name || "عضو";


          const mine =
            data.uid ===
            currentUser?.uid;


          if(mine){

            status.textContent =
              "🎙️ أنت تتحدث";

            button.textContent =
              "إيقاف";

            button.disabled =
              false;

            button.onclick =
              () => toggleMic(slotId);


            publishToListeners(
              slotId
            ).catch(error => {

              console.warn(
                "publish:",
                error
              );

            });

          }else{

            status.textContent =
              "🔊 مباشر";

            button.textContent =
              "استماع";

            button.disabled =
              false;

            button.onclick =
              () => startListening(
                slotId,
                data.uid
              );

          }

        });

      },
      error => {

        console.error(
          "VOICE SNAPSHOT ERROR:",
          error
        );

        voiceIds.forEach(id => {

          const status =
            $(id + "Status");

          if(status){

            status.textContent =
              "❌ لا يمكن تحميل المايك";

          }

        });

      }
    );

}


/* =========================================================
   TOGGLE MICROPHONE
========================================================= */

async function toggleMic(slotId){

  if(!currentUser){

    alert(
      "سجل الدخول أولًا."
    );

    return;

  }


  if(currentUser.isAnonymous){

    alert(
      "سجل دخول بعضوية لاستخدام المايك."
    );

    return;

  }


  if(mySlot === slotId){

    await leaveCurrentMic();

    return;

  }


  if(mySlot){

    alert(
      "أوقف المايك الحالي أولًا."
    );

    return;

  }


  try{

    /* فحص الحظر */

    const moderation =
      await getDoc(
        doc(
          db,
          "moderation",
          currentUser.uid
        )
      );


    if(moderation.exists()){

      const data =
        moderation.data();


      if(data.banned === true){

        alert(
          "🚫 الحساب محظور."
        );

        return;

      }


      if(data.micMuted === true){

        alert(
          "🎤 تم منعك من استخدام المايك."
        );

        return;

      }

    }


    /* فحص HTTPS */

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "الميكروفون يحتاج HTTPS ومتصفح يدعم WebRTC."
      );

    }


    /* التأكد أن المايك غير مشغول */

    const slotSnapshot =
      await getDoc(
        doc(
          db,
          "voiceSlots",
          slotId
        )
      );


    if(slotSnapshot.exists()){

      alert(
        "هذا المايك مشغول."
      );

      return;

    }


    /* تشغيل الميكروفون */

    currentStream =
      await navigator.mediaDevices
        .getUserMedia({

          audio:{
            echoCancellation:true,
            noiseSuppression:true,
            autoGainControl:true,
            channelCount:1
          },

          video:false

        });


    /* إيقاف المسارات غير المطلوبة */

    currentStream
      .getAudioTracks()
      .forEach(track => {

        track.enabled = true;

      });


    mySlot = slotId;


    /* إنشاء المايك */

    await setDoc(
      doc(
        db,
        "voiceSlots",
        slotId
      ),
      {
        uid:
          currentUser.uid,

        name:
          currentProfile.name,

        createdAt:
          serverTimestamp()
      }
    );


    /*
      إنشاء مستند المتحدث.
      المستمعون سيضيفون أنفسهم تحته.
    */

    await setDoc(
      doc(
        db,
        "voiceCalls",
        slotId,
        "speaker"
      ),
      {
        uid:
          currentUser.uid,

        name:
          currentProfile.name,

        createdAt:
          serverTimestamp()
      }
    );


  }catch(error){

    console.error(
      "MIC ERROR:",
      error
    );


    if(currentStream){

      currentStream
        .getTracks()
        .forEach(track => {

          track.stop();

        });

    }


    currentStream = null;

    mySlot = null;


    alert(
      "❌ تعذر تشغيل المايك:\n" +
      friendlyError(error)
    );

  }

}


/* =========================================================
   LEAVE MICROPHONE
========================================================= */

async function leaveCurrentMic(){

  if(!mySlot){

    if(currentStream){

      currentStream
        .getTracks()
        .forEach(track => {

          track.stop();

        });

      currentStream = null;

    }

    return;

  }


  const slot =
    mySlot;


  try{

    await deleteDoc(
      doc(
        db,
        "voiceSlots",
        slot
      )
    );

  }catch(error){

    console.warn(
      "voice slot delete:",
      error
    );

  }


  try{

    await deleteDoc(
      doc(
        db,
        "voiceCalls",
        slot,
        "speaker"
      )
    );

  }catch(error){

    console.warn(
      "speaker delete:",
      error
    );

  }


  stopAllListeningForSlot(
    slot
  );


  if(currentStream){

    currentStream
      .getTracks()
      .forEach(track => {

        track.stop();

      });

  }


  currentStream = null;

  mySlot = null;

}


/* =========================================================
   CLOSE MODALS
========================================================= */

document
  .querySelectorAll("[data-close]")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        const modal =
          $(button.dataset.close);

        if(modal){

          modal.classList.remove(
            "show"
          );

        }

      }
    );

  });


document
  .querySelectorAll(".modal")
  .forEach(modal => {

    modal.addEventListener(
      "click",
      event => {

        if(event.target === modal){

          modal.classList.remove(
            "show"
          );

        }

      }
    );

  });


/* =========================================================
   BEFORE UNLOAD
========================================================= */

window.addEventListener(
  "beforeunload",
  () => {

    if(currentStream){

      currentStream
        .getTracks()
        .forEach(track => {

          track.stop();

        });

    }

  }
);
