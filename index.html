<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🔥 طليان الشعلة</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Tahoma,sans-serif;background:#070b10;color:#fff}
body{
background:
linear-gradient(#0009,#0009),
url("./background.jpeg") center/cover fixed no-repeat;
}
button,input{font-family:inherit}
button{cursor:pointer}
.hidden{display:none!important}

#loginPage{
min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px
}
.loginBox{
width:100%;max-width:430px;background:#101722ee;padding:24px;
border-radius:20px;border:1px solid #ffffff20;box-shadow:0 20px 60px #000b
}
.logo{text-align:center;font-size:29px;font-weight:bold;margin-bottom:8px}
.description{text-align:center;color:#b9c5d4;line-height:1.7;margin-bottom:18px}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.tab{border:1px solid #344255;background:#18222e;color:#ddd;padding:10px 4px;border-radius:9px}
.tab.active{background:#1687ff;color:#fff}

.form{display:none}
.form.active{display:block}

input{
width:100%;padding:13px;margin:5px 0;border:1px solid #344255;
border-radius:10px;background:#0c131b;color:#fff;outline:none
}
.btn{width:100%;padding:13px;margin-top:7px;border:0;border-radius:10px;color:#fff;font-weight:bold}
.primary{background:#1687ff}
.secondary{background:#293646}
#authMessage{text-align:center;min-height:24px;margin-top:10px;color:#ffb5b5}
.status{text-align:center;color:#70e0a1;font-size:12px;margin-top:8px}

/* APP */
#chatApp{height:100vh;display:flex;flex-direction:column}
.header{
min-height:64px;background:#101722ee;border-bottom:1px solid #293646;
display:flex;align-items:center;justify-content:space-between;padding:8px 10px;gap:6px
}
.headerRight{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.title{font-size:19px;font-weight:bold}
.username{font-size:12px;color:#70e0a1;margin-top:3px}
.header button{
border:0;color:#fff;border-radius:8px;padding:8px 9px;font-weight:bold
}
.adminOpen{background:#8b5cf6}
.logout{background:#a92d38}

/* VOICE */
.voicePanel{background:#101720dd;border-bottom:1px solid #293646;padding:9px}
.voiceTitle{text-align:center;font-weight:bold;margin-bottom:7px}
.voiceSlots{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.voiceSlot{
background:#18222ecc;border:1px solid #344255;border-radius:12px;
padding:8px;text-align:center
}
.voiceSlot.active{border-color:#22c77a}
.voiceName{font-size:12px;color:#c4cfdd;margin:4px 0}
.voiceStatus{font-size:11px;color:#8995a5;margin-bottom:5px}
.voiceSlot button{
border:0;border-radius:8px;padding:7px 10px;background:#1687ff;color:#fff;font-weight:bold
}

/* MESSAGES */
.messages{flex:1;overflow-y:auto;padding:12px;background:#0004}
.message{display:flex;gap:8px;margin-bottom:12px}
.avatar{width:40px;height:40px;border-radius:50%;background:#293646}
.messageContent{background:#18222eea;border-radius:12px;padding:8px 10px;max-width:82%}
.messageName{color:#62aaff;font-size:12px;font-weight:bold;margin-bottom:3px}
.messageText{line-height:1.5;word-break:break-word}
.empty{text-align:center;color:#7e8a99;padding:30px}

.composer{
display:flex;gap:6px;padding:8px;background:#151d28ee;border-top:1px solid #293646
}
.composer input{flex:1;margin:0}
.send{width:50px;border:0;border-radius:10px;background:#1687ff;color:#fff;font-size:18px}

/* MODAL */
.modal{
position:fixed;inset:0;background:#000d;z-index:5000;display:none;
align-items:center;justify-content:center;padding:10px
}
.modal.show{display:flex}
.box{
width:100%;max-width:650px;max-height:94vh;overflow:auto;
background:#101722;border:1px solid #344255;border-radius:18px;padding:14px;
box-shadow:0 20px 70px #000
}
.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.modalTitle{font-size:20px;font-weight:bold}
.close{
width:38px;height:38px;border:0;border-radius:9px;background:#a92d38;color:#fff;font-size:22px
}

/* ADMIN */
.adminTabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-bottom:10px}
.adminTab{border:0;border-radius:8px;padding:9px;background:#293646;color:#fff}
.adminTab.active{background:#1687ff}
.adminSection{display:none}
.adminSection.active{display:block}
.member{
border:1px solid #344255;background:#18222e;border-radius:11px;padding:10px;margin:7px 0
}
.memberTop{display:flex;justify-content:space-between;gap:8px}
.memberName{font-weight:bold}
.memberUid{font-size:10px;color:#8290a1;word-break:break-all;margin:4px 0}
.adminBtns{display:flex;gap:5px;flex-wrap:wrap}
.adminBtns button{
border:0;border-radius:7px;padding:7px 9px;color:#fff;font-weight:bold
}
.ban{background:#a92d38}
.unban{background:#168b59}
.mute{background:#b47716}
.unmute{background:#1687ff}
.delete{background:#6d3340}
.kick{background:#b91c1c}
.voiceKick{background:#7c3aed}

@media(max-width:430px){
.title{font-size:15px}
.header button{padding:7px;font-size:11px}
.gamesGrid{grid-template-columns:1fr 1fr}
.voiceSlot button{font-size:11px}
}
</style>
</head>

<script>
(function(){
  function initLoginTabs(){
    document.querySelectorAll(".tab").forEach(function(b){
      b.addEventListener("click",function(){
        document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("active");});
        document.querySelectorAll(".form").forEach(function(x){x.classList.remove("active");});
        b.classList.add("active");
        var target=document.getElementById(b.dataset.tab+"Form");
        if(target) target.classList.add("active");
        var msg=document.getElementById("authMessage");
        if(msg) msg.textContent="";
      });
    });
  }
  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",initLoginTabs);
  }else{
    initLoginTabs();
  }
})();
</script>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signInAnonymously,
updateProfile,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

import {
getFirestore,
collection,
doc,
getDoc,
getDocs,
setDoc,
deleteDoc,
addDoc,
updateDoc,
query,
orderBy,
onSnapshot,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig={
apiKey:"AIzaSyAuFZxL_pmEm7weqkMQVGRME8VHeVs4fDU",
authDomain:"dardashti-chat.firebaseapp.com",
projectId:"dardashti-chat",
storageBucket:"dardashti-chat.firebasestorage.app",
messagingSenderId:"779042757468",
appId:"1:779042757468:web:7646d3cdadf46f315a3f99"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);


/* =================================================
   ضع UID حسابك هنا
================================================= */

const ADMIN_UIDS=["N6KoWvu1IxbgWtVE46fmCsydZbF3"];


/* =========================
   عناصر
========================= */

const loginPage=document.getElementById("loginPage");
const chatApp=document.getElementById("chatApp");
const authMessage=document.getElementById("authMessage");

let stopMessages=null;
let stopVoice=null;
let currentStream=null;
let myVoiceSlot=null;
let currentModeration={};
let stopAdminMessages=null;
let stopAdminVoice=null;
let stopMyModeration=null;


/* =========================
   الأدوات
========================= */

function isAdmin(){
const u=auth.currentUser;
return !!u && ADMIN_UIDS.includes(u.uid);
}

async function moderation(uid){
try{
const s=await getDoc(doc(db,"moderation",uid));
return s.exists()?s.data():{};
}catch{
return {};
}
}

function showChat(name){
loginPage.classList.add("hidden");
chatApp.classList.remove("hidden");

document.getElementById("currentUsername").textContent=name;

if(isAdmin())
document.getElementById("adminOpen").classList.remove("hidden");
else
document.getElementById("adminOpen").classList.add("hidden");

loadMessages();
watchVoice();
watchMyModeration();
}


/* =========================
   TABS
========================= */

document.querySelectorAll(".tab").forEach(b=>{
b.onclick=()=>{
document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
document.querySelectorAll(".form").forEach(x=>x.classList.remove("active"));

b.classList.add("active");
document.getElementById(b.dataset.tab+"Form").classList.add("active");
authMessage.textContent="";
};
});


/* =========================
   VISITOR
========================= */

async function visitorLogin(){

const name=document.getElementById("visitorName").value.trim();

if(name.length<2){
authMessage.textContent="⚠️ اكتب اسمًا صحيحًا";
return;
}

try{

localStorage.setItem("visitorName",name);

if(!auth.currentUser)
await signInAnonymously(auth);

}catch(e){
authMessage.textContent="❌ "+(e.code||e.message);
}

}

document.getElementById("visitorButton").onclick=visitorLogin;


/* =========================
   SIGNUP
========================= */

document.getElementById("signupButton").onclick=async()=>{

const name=document.getElementById("nameInput").value.trim();
const email=document.getElementById("signupEmail").value.trim();
const password=document.getElementById("signupPassword").value;

if(name.length<2){
authMessage.textContent="⚠️ اكتب اسم العضو";
return;
}

if(password.length<6){
authMessage.textContent="⚠️ كلمة المرور يجب أن تكون 6 أحرف على الأقل";
return;
}

try{

const r=await createUserWithEmailAndPassword(
auth,email,password
);

await updateProfile(r.user,{displayName:name});

await setDoc(
doc(db,"users",r.user.uid),
{
uid:r.user.uid,
name,
email,
role:"user",
banned:false,
micBanned:false,
createdAt:serverTimestamp()
},
{merge:true}
);

await setDoc(
doc(db,"moderation",r.user.uid),
{
banned:false,
micMuted:false,
updatedAt:serverTimestamp()
},
{merge:true}
);

authMessage.textContent="✅ تم إنشاء الحساب";

}catch(e){
authMessage.textContent="❌ "+(e.code||e.message);
}

};


/* =========================
   LOGIN
========================= */

document.getElementById("loginButton").onclick=async()=>{

const email=document.getElementById("emailInput").value.trim();
const password=document.getElementById("passwordInput").value;

if(!email||!password){
authMessage.textContent="⚠️ اكتب البيانات";
return;
}

try{
await signInWithEmailAndPassword(auth,email,password);
}catch(e){
authMessage.textContent="❌ "+(e.code||e.message);
}

};


/* =========================
   AUTH
========================= */

onAuthStateChanged(auth,async user=>{

if(!user){

if(stopMessages)stopMessages();
if(stopVoice)stopVoice();
if(stopMyModeration)stopMyModeration();

cleanupMic();

loginPage.classList.remove("hidden");
chatApp.classList.add("hidden");
return;
}

const mod=await moderation(user.uid);
currentModeration=mod;

if(mod.banned){

await signOut(auth);
authMessage.textContent="🚫 حسابك محظور";
return;
}

const name=user.isAnonymous
?(localStorage.getItem("visitorName")||"زائر")
:(user.displayName||"عضو");

showChat(name);

});


/* =========================
   مراقبة الحظر والطرد لحظيًا
========================= */
function watchMyModeration(){
  if(stopMyModeration) stopMyModeration();
  const u=auth.currentUser;
  if(!u || u.isAnonymous) return;
  stopMyModeration=onSnapshot(doc(db,"moderation",u.uid),async snap=>{
    const d=snap.exists()?snap.data():{};
    currentModeration=d;
    if(d.banned){
      alert("🚫 تم طردك/حظرك من الدردشة بواسطة المشرف");
      await stopMic();
      await signOut(auth);
    }
  });
}

/* =========================
   LOGOUT
========================= */

document.getElementById("logoutButton").onclick=async()=>{

await stopMic();

localStorage.removeItem("visitorName");

await signOut(auth);

};


/* =========================
   CHAT
========================= */

async function sendMessage(){

const input=document.getElementById("messageInput");
const text=input.value.trim();
const u=auth.currentUser;

if(!u||!text)return;

if(currentModeration.banned){
alert("🚫 حسابك محظور");
return;
}

input.value="";
input.focus();

// لا ننتظر الشبكة هنا؛ هذا يجعل إرسال عدة رسائل متتالية سريعًا.
addDoc(
collection(db,"messages"),
{
uid:u.uid,
name:u.displayName||localStorage.getItem("visitorName")||"زائر",
text,
createdAt:serverTimestamp()
}
).catch(e=>{
console.error("sendMessage",e);
alert("❌ تعذر إرسال الرسالة: "+(e.code||e.message));
});

}

document.getElementById("sendButton").onclick=sendMessage;

document.getElementById("messageInput").onkeydown=e=>{
if(e.key==="Enter"){
e.preventDefault();
sendMessage();
}
};


function loadMessages(){

if(stopMessages)stopMessages();

const box=document.getElementById("messages");

let renderTimer=null;
stopMessages=onSnapshot(
query(collection(db,"messages"),orderBy("createdAt","asc")),
snap=>{

if(renderTimer)clearTimeout(renderTimer);
renderTimer=setTimeout(()=>{

const docs=snap.docs.slice(-200);
const frag=document.createDocumentFragment();

if(!docs.length){
box.innerHTML='<div class="empty">لا توجد رسائل بعد</div>';
return;
}

for(const s of docs){
const d=s.data();
const row=document.createElement("div");
row.className="message";

const avatar=document.createElement("img");
avatar.className="avatar";
avatar.loading="lazy";
avatar.src="https://ui-avatars.com/api/?name="+encodeURIComponent(d.name||"عضو")+"&background=1687ff&color=fff";

const content=document.createElement("div");
content.className="messageContent";

const name=document.createElement("div");
name.className="messageName";
name.textContent=d.name||"عضو";

const text=document.createElement("div");
text.className="messageText";
text.textContent=d.text||"";

content.append(name,text);
row.append(avatar,content);
frag.appendChild(row);
}

box.innerHTML="";
box.appendChild(frag);
box.scrollTop=box.scrollHeight;
},60);

},
e=>{
console.error(e);
box.innerHTML='<div class="empty">❌ تعذر تحميل الرسائل</div>';
}
);

}


/* =========================
   VOICE — WebRTC
   ========================= */

const voiceSlots=[
 {id:"slot1",box:document.getElementById("voiceSlot1"),name:document.getElementById("voiceName1"),status:document.getElementById("voiceStatus1"),button:document.getElementById("voiceButton1")},
 {id:"slot2",box:document.getElementById("voiceSlot2"),name:document.getElementById("voiceName2"),status:document.getElementById("voiceStatus2"),button:document.getElementById("voiceButton2")}
];

const rtcConfig={
 iceServers:[
  {urls:"stun:stun.l.google.com:19302"},
  {urls:"stun:stun1.l.google.com:19302"}
 ]
};

let currentStream=null;
let myVoiceSlot=null;
let stopVoice=null;
const voicePeers=new Map();
const voiceUnsubs=new Map();
const remoteAudios=new Map();

function closePeer(uid){
 const pc=voicePeers.get(uid);
 if(pc){try{pc.close()}catch{} voicePeers.delete(uid)}
 const u=voiceUnsubs.get(uid);
 if(u){try{u()}catch{} voiceUnsubs.delete(uid)}
 const a=remoteAudios.get(uid);
 if(a){try{a.pause()}catch{} a.srcObject=null; a.remove(); remoteAudios.delete(uid)}
}

function closeAllPeers(){
 [...voicePeers.keys()].forEach(closePeer);
}

function playRemote(uid,stream){
 let a=remoteAudios.get(uid);
 if(!a){
  a=document.createElement("audio");
  a.autoplay=true;
  a.playsInline=true;
  a.setAttribute("playsinline","");
  a.style.display="none";
  document.body.appendChild(a);
  remoteAudios.set(uid,a);
 }
 a.srcObject=stream;
 a.play().catch(()=>{});
}

async function startMic(index){
 const u=auth.currentUser;
 if(!u){alert("يجب تسجيل الدخول");return}
 if(location.protocol!=="https:" && location.hostname!=="localhost"){
  alert("❌ المايك يحتاج HTTPS. استخدم رابط Firebase Hosting أو GitHub Pages.");
  return;
 }
 const slot=voiceSlots[index];
 const ref=doc(db,"voiceSlots",slot.id);
 try{
  const old=await getDoc(ref);
  if(old.exists()){
   if(old.data().uid===u.uid){await stopMic();return}
   // الدخول كمستمع يتم من زر المايك المشغول
   await connectListener(slot.id,old.data().uid);
   return;
  }
  if(myVoiceSlot){alert("⚠️ لديك مايك مفتوح بالفعل");return}
  const mod=await moderation(u.uid);
  if(mod.banned){alert("🚫 حسابك محظور");return}
  if(mod.micMuted){alert("🎤 تم منعك من استخدام المايك");return}

  currentStream=await navigator.mediaDevices.getUserMedia({
   audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},
   video:false
  });

  await setDoc(ref,{
   uid:u.uid,
   name:u.displayName||localStorage.getItem("visitorName")||"عضو",
   createdAt:serverTimestamp()
  });
  myVoiceSlot=slot.id;
  slot.status.textContent="🎤 أنت تتحدث";
  slot.button.textContent="إيقاف المايك";
 }catch(e){
  console.error(e); cleanupMic();
  alert("❌ تعذر تشغيل المايك:\n"+(e.name||e.code||e.message));
 }
}

async function stopMic(){
 if(myVoiceSlot){
  try{
   const ref=doc(db,"voiceSlots",myVoiceSlot);
   const s=await getDoc(ref);
   if(s.exists() && s.data().uid===auth.currentUser?.uid) await deleteDoc(ref);
  }catch(e){console.error(e)}
 }
 cleanupMic(); closeAllPeers(); myVoiceSlot=null;
}

function cleanupMic(){
 if(currentStream) currentStream.getTracks().forEach(t=>{try{t.stop()}catch{}});
 currentStream=null;
}

async function connectListener(slotId,speakerUid){
 const u=auth.currentUser;
 if(!u || u.uid===speakerUid)return;
 const peerId=u.uid;
 closePeer(peerId);

 try{
  const pc=new RTCPeerConnection(rtcConfig);
  voicePeers.set(peerId,pc);

  pc.ontrack=e=>{if(e.streams[0])playRemote(peerId,e.streams[0])};

  pc.onconnectionstatechange=()=>{
   if(pc.connectionState==="connected"){
    const s=voiceSlots.find(x=>x.id===slotId);
    if(s) s.status.textContent="🔊 تستمع للبث";
   }
   if(["failed","closed"].includes(pc.connectionState)) closePeer(peerId);
  };

  const peerRef=doc(db,"voiceCalls",slotId,"peers",peerId);
  const offerCandidates=collection(db,"voiceCalls",slotId,"peers",peerId,"offerCandidates");
  const answerCandidates=collection(db,"voiceCalls",slotId,"peers",peerId,"answerCandidates");

  pc.onicecandidate=async e=>{
   if(e.candidate) try{await addDoc(offerCandidates,e.candidate.toJSON())}catch(err){console.error(err)}
  };

  const offer=await pc.createOffer({offerToReceiveAudio:true});
  await pc.setLocalDescription(offer);

  await setDoc(peerRef,{
   listenerUid:peerId,
   speakerUid,
   offer:{type:offer.type,sdp:offer.sdp},
   createdAt:serverTimestamp()
  },{merge:true});

  const un1=onSnapshot(peerRef,async s=>{
   const d=s.data();
   if(!d?.answer || pc.currentRemoteDescription)return;
   try{await pc.setRemoteDescription(new RTCSessionDescription(d.answer))}catch(e){console.error(e)}
  });

  const un2=onSnapshot(answerCandidates,s=>{
   s.docChanges().forEach(async ch=>{
    if(ch.type==="added")try{await pc.addIceCandidate(new RTCIceCandidate(ch.doc.data()))}catch(e){console.error(e)}
   });
  });

  voiceUnsubs.set(peerId,()=>{
   try{un1()}catch{} try{un2()}catch{}
  });

  const slot=voiceSlots.find(x=>x.id===slotId);
  if(slot)slot.status.textContent="🔊 جاري الاتصال...";
 }catch(e){
  console.error(e);
  closePeer(peerId);
  alert("❌ تعذر الاتصال بالبث الصوتي: "+(e.code||e.message));
 }
}

function watchSpeaker(slotId,speakerUid){
 const peers=collection(db,"voiceCalls",slotId,"peers");
 const key="speaker:"+slotId;
 const old=voiceUnsubs.get(key);
 if(old)old();

 const unsub=onSnapshot(peers,snap=>{
  snap.docChanges().forEach(async ch=>{
   if(ch.type==="removed"){closePeer(ch.doc.id);return}
   const d=ch.doc.data(), peerId=ch.doc.id;
   if(!d.offer || peerId===speakerUid || voicePeers.has(peerId))return;

   try{
    const pc=new RTCPeerConnection(rtcConfig);
    voicePeers.set(peerId,pc);
    currentStream?.getTracks().forEach(t=>pc.addTrack(t,currentStream));

    const peerRef=doc(db,"voiceCalls",slotId,"peers",peerId);
    const offers=collection(db,"voiceCalls",slotId,"peers",peerId,"offerCandidates");
    const answers=collection(db,"voiceCalls",slotId,"peers",peerId,"answerCandidates");

    pc.onicecandidate=async e=>{
     if(e.candidate)try{await addDoc(answers,e.candidate.toJSON())}catch(err){console.error(err)}
    };

    pc.onconnectionstatechange=()=>{
     if(["failed","closed"].includes(pc.connectionState))closePeer(peerId);
    };

    const un=onSnapshot(offers,s=>{
     s.docChanges().forEach(async ch=>{
      if(ch.type==="added")try{await pc.addIceCandidate(new RTCIceCandidate(ch.doc.data()))}catch(e){console.error(e)}
     });
    });

    voiceUnsubs.set(peerId,un);
    await pc.setRemoteDescription(new RTCSessionDescription(d.offer));
    const answer=await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await setDoc(peerRef,{answer:{type:answer.type,sdp:answer.sdp}},{merge:true});
   }catch(e){console.error("speaker peer",e)}
  });
 });
 voiceUnsubs.set(key,unsub);
}

voiceSlots.forEach((s,i)=>s.button.onclick=()=>startMic(i));

function watchVoice(){
 if(stopVoice)stopVoice();
 stopVoice=onSnapshot(collection(db,"voiceSlots"),snap=>{
  const data={}; snap.forEach(s=>data[s.id]=s.data());

  voiceSlots.forEach(s=>{
   const d=data[s.id];
   if(!d){
    s.box.classList.remove("active");
    s.name.textContent="شاغر";
    s.status.textContent="جاهز";
    s.button.textContent="تشغيل المايك";
    return;
   }

   s.box.classList.add("active");
   s.name.textContent=d.name||"عضو";

   if(auth.currentUser?.uid===d.uid){
    s.status.textContent="🎤 أنت تتحدث";
    s.button.textContent="إيقاف المايك";
    if(currentStream)watchSpeaker(s.id,d.uid);
   }else{
    s.status.textContent="🔊 اضغط للاستماع";
    s.button.textContent="🔊 استماع";
   }
  });
 });
}

/* MEMBERS */

async function loadMembers(){
  const box=document.getElementById("membersList");
  box.innerHTML="جاري التحميل...";
  if(!isAdmin()){ box.innerHTML="❌ غير مصرح"; return; }

  try{
    const snap=await getDocs(collection(db,"users"));
    box.innerHTML="";

    if(snap.empty){
      box.innerHTML='<div class="empty">لا توجد سجلات أعضاء داخل users</div>';
      return;
    }

    snap.forEach(s=>{
      const d=s.data();
      const uid=d.uid||s.id;

      const item=document.createElement("div");
      item.className="member";

      const top=document.createElement("div");
      top.className="memberTop";

      const name=document.createElement("div");
      name.className="memberName";
      name.textContent=d.name||"بدون اسم";

      const buttons=document.createElement("div");
      buttons.className="adminBtns";

      const ban=document.createElement("button");
      ban.className=d.banned?"unban":"ban";
      ban.textContent=d.banned?"فك الحظر":"حظر";
      ban.onclick=()=>setBan(uid,!d.banned);

      const mute=document.createElement("button");
      mute.className=d.micBanned||d.micMuted?"unmute":"mute";
      mute.textContent=d.micBanned||d.micMuted?"السماح بالمايك":"منع المايك";
      mute.onclick=()=>setMute(uid,!(d.micBanned||d.micMuted));

      const kick=document.createElement("button");
      kick.className="kick";
      kick.textContent="🚫 طرد";
      kick.onclick=()=>kickMember(uid);

      const voiceKick=document.createElement("button");
      voiceKick.className="voiceKick";
      voiceKick.textContent="🎤 طرد من البث";
      voiceKick.onclick=()=>kickFromVoice(uid);

      buttons.append(ban,mute,kick,voiceKick);
      top.append(name,buttons);

      const uidEl=document.createElement("div");
      uidEl.className="memberUid";
      uidEl.textContent="UID: "+uid;

      item.append(top,uidEl);
      box.appendChild(item);
    });
  }catch(e){
    console.error(e);
    box.innerHTML="❌ تعذر تحميل الأعضاء: "+(e.code||e.message);
  }
}

async function setBan(uid,value){
  if(!isAdmin() || !uid) return;
  if(uid===auth.currentUser?.uid){
    alert("لا يمكنك حظر نفسك");
    return;
  }

  try{
    await setDoc(doc(db,"moderation",uid),{
      banned:value,
      updatedAt:serverTimestamp()
    },{merge:true});

    await setDoc(doc(db,"users",uid),{
      banned:value
    },{merge:true});

    if(value){
      await removeUserFromVoice(uid);
    }

    alert(value?"🚫 تم طرد/حظر العضو":"✅ تم فك الحظر");
    loadMembers();
    loadAdminVoice();
  }catch(e){
    console.error(e);
    alert("❌ فشل الحظر/فك الحظر: "+(e.code||e.message));
  }
}

async function kickMember(uid){
  if(!isAdmin() || !uid) return;
  if(uid===auth.currentUser?.uid){
    alert("لا يمكنك طرد نفسك");
    return;
  }

  if(!confirm("طرد هذا العضو؟")) return;

  try{
    // الطرد هنا يطبق حظرًا فورياً ويزيله من المايك.
    await setDoc(doc(db,"moderation",uid),{
      banned:true,
      updatedAt:serverTimestamp()
    },{merge:true});

    await setDoc(doc(db,"users",uid),{
      banned:true
    },{merge:true});

    await removeUserFromVoice(uid);

    alert("🚫 تم طرد العضو");
    loadMembers();
    loadAdminVoice();
  }catch(e){
    console.error(e);
    alert("❌ تعذر طرد العضو: "+(e.code||e.message));
  }
}

async function setMute(uid,value){
  if(!isAdmin() || !uid) return;

  try{
    await setDoc(doc(db,"moderation",uid),{
      micMuted:value,
      updatedAt:serverTimestamp()
    },{merge:true});

    await setDoc(doc(db,"users",uid),{
      micBanned:value
    },{merge:true});

    if(value){
      await removeUserFromVoice(uid);
    }

    alert(value?"🎤 تم منع المايك":"🎤 تم السماح بالمايك");
    loadMembers();
    loadAdminVoice();
  }catch(e){
    console.error(e);
    alert("❌ تعذر تغيير حالة المايك: "+(e.code||e.message));
  }
}

async function removeUserFromVoice(uid){
  for(const slotId of ["slot1","slot2"]){
    try{
      const ref=doc(db,"voiceSlots",slotId);
      const s=await getDoc(ref);
      if(s.exists() && s.data().uid===uid){
        await deleteDoc(ref);
      }
    }catch(e){
      console.error("removeUserFromVoice",e);
    }
  }
}

async function kickFromVoice(uid){
  if(!isAdmin() || !uid) return;

  try{
    await removeUserFromVoice(uid);
    alert("🎤 تم إخراج العضو من البث الصوتي");
    loadAdminVoice();
  }catch(e){
    console.error(e);
    alert("❌ تعذر إخراج العضو: "+(e.code||e.message));
  }
}

/* ADMIN MESSAGES */

function loadAdminMessages(){
  if(stopAdminMessages)stopAdminMessages();

  const box=document.getElementById("adminMessagesList");

  if(!isAdmin()){
    box.innerHTML="❌ غير مصرح";
    return;
  }

  stopAdminMessages=onSnapshot(
    query(collection(db,"messages"),orderBy("createdAt","desc")),
    snap=>{
      box.innerHTML="";

      if(snap.empty){
        box.innerHTML='<div class="empty">لا توجد رسائل</div>';
        return;
      }

      snap.forEach(s=>{
        const d=s.data();

        const item=document.createElement("div");
        item.className="member";

        const text=document.createElement("div");
        text.innerHTML=
          "<b>"+escapeHtml(d.name||"عضو")+"</b><br>"+
          escapeHtml(d.text||"");

        const btn=document.createElement("button");
        btn.className="delete";
        btn.textContent="🗑️ حذف الرسالة";
        btn.style.marginTop="7px";

        btn.onclick=async()=>{
          if(!isAdmin()) return;
          if(!confirm("حذف هذه الرسالة نهائيًا؟")) return;

          try{
            await deleteDoc(doc(db,"messages",s.id));
            item.remove();
          }catch(e){
            console.error(e);
            alert(
              "❌ فشل حذف الرسالة.\n"+
              "غالبًا تحتاج تعديل Firestore Rules للسماح للمشرف.\n"+
              (e.code||e.message)
            );
          }
        };

        item.append(text,btn);
        box.appendChild(item);
      });
    },
    e=>{
      console.error(e);
      box.innerHTML="❌ تعذر تحميل الرسائل: "+(e.code||e.message);
    }
  );
}

function escapeHtml(text){
  const d=document.createElement("div");
  d.textContent=text;
  return d.innerHTML;
}

/* ADMIN VOICE */

function loadAdminVoice(){
  if(stopAdminVoice)stopAdminVoice();

  const box=document.getElementById("adminVoiceList");

  if(!isAdmin()){
    box.innerHTML="❌ غير مصرح";
    return;
  }

  stopAdminVoice=onSnapshot(
    collection(db,"voiceSlots"),
    snap=>{
      box.innerHTML="";

      if(snap.empty){
        box.innerHTML='<div class="empty">جميع المايكات شاغرة</div>';
        return;
      }

      snap.forEach(s=>{
        const d=s.data();

        const item=document.createElement("div");
        item.className="member";

        const title=document.createElement("div");
        title.innerHTML=
          "<b>🎤 "+escapeHtml(d.name||"عضو")+"</b><br>"+
          "<small>"+escapeHtml(d.uid||"")+"</small>";

        const btn=document.createElement("button");
        btn.className="delete";
        btn.textContent="🎤 إخلاء المايك";
        btn.style.marginTop="7px";

        btn.onclick=async()=>{
          if(!isAdmin()) return;

          try{
            await deleteDoc(doc(db,"voiceSlots",s.id));
            item.remove();
            alert("🎤 تم إخلاء المايك");
          }catch(e){
            console.error(e);
            alert("❌ تعذر إخلاء المايك: "+(e.code||e.message));
          }
        };

        item.append(title,btn);
        box.appendChild(item);
      });
    },
    e=>{
      console.error(e);
      box.innerHTML="❌ تعذر تحميل المايكات: "+(e.code||e.message);
    }
  );
}

    msg.textContent="❌ حدث خطأ في تشغيل النسخة: "+e.message;
  }
});

  var msg=document.getElementById("authMessage");
  var r=e && e.reason;
  if(msg && r && !msg.textContent){
    msg.textContent="❌ تعذر تشغيل Firebase: "+(r.code||r.message||r);
  }
});
