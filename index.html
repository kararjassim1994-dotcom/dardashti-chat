<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>كرار جاسم</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:Arial,Tahoma,sans-serif;
  background:#070b12;
  color:#fff;
}
body{
  background:
    linear-gradient(135deg,#06101dcc,#101827dd),
    url("https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=1800&q=80")
    center/cover fixed no-repeat;
}
button,input{font-family:inherit}
button{cursor:pointer}
.hidden{display:none!important}

:root{
  --panel:#101925ed;
  --panel2:#182333ee;
  --line:#314156;
  --blue:#1687ff;
  --green:#27c47b;
  --red:#c83b4a;
  --muted:#9aa9bb;
}

#loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.loginBox{
  width:100%;
  max-width:440px;
  background:var(--panel);
  padding:24px;
  border-radius:22px;
  border:1px solid #ffffff20;
  box-shadow:0 20px 70px #000b;
  backdrop-filter:blur(12px);
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:900;
  margin-bottom:6px;
}

.description{
  text-align:center;
  color:#c5d0dc;
  line-height:1.7;
  margin-bottom:18px;
}

.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-bottom:12px;
}

.tab,.btn{
  border:0;
  border-radius:10px;
  padding:12px;
  font-weight:bold;
}

.tab{
  background:#1a2635;
  color:#ccd7e4;
  border:1px solid var(--line);
}

.tab.active,.primary{
  background:var(--blue);
  color:#fff;
}

.form{display:none}
.form.active{display:block}

.loginBox input,
.composer input,
.profileBox input,
.dmComposer input{
  width:100%;
  padding:13px;
  margin:5px 0;
  border:1px solid var(--line);
  border-radius:10px;
  background:#0b121c;
  color:#fff;
  outline:none;
}

.btn{
  width:100%;
  margin-top:7px;
  color:#fff;
}

.secondary{background:#293648}

.status{
  text-align:center;
  color:#79e2aa;
  font-size:12px;
  margin-top:10px;
}

#authMessage{
  text-align:center;
  min-height:24px;
  color:#ffb4b4;
  margin-top:10px;
}

#chatApp{
  height:100vh;
  display:flex;
  flex-direction:column;
}

.header{
  min-height:64px;
  background:#0e1723ed;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px;
  gap:8px;
  backdrop-filter:blur(10px);
}

.headerUser{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}

.headerAvatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#26364a;
}

.title{
  font-size:20px;
  font-weight:900;
}

.username{
  font-size:12px;
  color:#72e3a4;
  margin-top:2px;
}

.headerActions{
  display:flex;
  gap:6px;
  align-items:center;
  flex-wrap:wrap;
}

.iconBtn{
  border:0;
  background:#223044;
  color:#fff;
  padding:9px 10px;
  border-radius:9px;
}

.logout{background:#a82f3c}
.adminBtn{background:#8a5cf6}

.voicePanel{
  background:#0d1622e8;
  border-bottom:1px solid var(--line);
  padding:9px;
}

.voiceTitle{
  text-align:center;
  font-weight:bold;
  color:#dbe6f2;
  margin-bottom:7px;
}

.voiceSlots{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}

.voiceSlot{
  min-height:82px;
  background:#172233;
  border:1px solid var(--line);
  border-radius:12px;
  padding:7px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
}

.voiceSlot.active{
  border-color:var(--green);
  box-shadow:0 0 0 1px #27c47b33;
}

.micIcon{font-size:25px}

.voiceName{
  font-size:11px;
  color:#c0cad6;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.voiceStatus{
  font-size:10px;
  color:#8797aa;
}

.voiceSlot button{
  border:0;
  border-radius:8px;
  padding:6px 8px;
  background:var(--blue);
  color:#fff;
  font-size:11px;
  font-weight:bold;
}

.voiceSlot.active button{
  background:var(--red);
}

.roomsBar{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:8px;
  background:#0c1420e8;
  border-bottom:1px solid var(--line);
  scrollbar-width:none;
}

.roomsBar::-webkit-scrollbar{
  display:none;
}

.roomBtn{
  white-space:nowrap;
  border:1px solid var(--line);
  background:#182333;
  color:#dce7f4;
  border-radius:9px;
  padding:8px 11px;
}

.roomBtn.active{
  background:#1687ff;
  border-color:#1687ff;
}

.content{
  flex:1;
  display:flex;
  min-height:0;
  overflow:hidden;
}

.feed{
  flex:1;
  overflow-y:auto;
  padding:12px;
  background:#0005;
}

.side{
  width:250px;
  background:#0e1724e8;
  border-right:1px solid var(--line);
  overflow-y:auto;
  padding:10px;
}

.sideTitle{
  font-weight:bold;
  margin:5px 0 10px;
}

.onlineCount{
  color:#74e2a5;
  font-size:12px;
  margin-bottom:8px;
}

.member{
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px;
  border-radius:9px;
  background:#162131;
  margin-bottom:6px;
  cursor:pointer;
}

.member:hover{
  background:#213047;
}

.member img{
  width:34px;
  height:34px;
  border-radius:50%;
  object-fit:cover;
}

.memberName{
  font-size:12px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#35d47f;
  margin-right:auto;
}

.composer{
  display:flex;
  gap:7px;
  padding:8px;
  background:#111a26ee;
  border-top:1px solid var(--line);
  align-items:center;
}

.composer input{
  margin:0;
  flex:1;
}

.send{
  width:48px;
  height:46px;
  border:0;
  border-radius:10px;
  background:var(--blue);
  color:#fff;
  font-size:18px;
}

.replyBar{
  background:#1c2a3c;
  border-top:1px solid #3a4d64;
  padding:7px 10px;
  font-size:12px;
  display:none;
}

.replyBar.show{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.cancelReply{
  border:0;
  background:transparent;
  color:#ff9ca6;
}

.post{
  background:#101a27ed;
  border:1px solid #ffffff12;
  border-radius:14px;
  padding:10px;
  margin-bottom:10px;
  box-shadow:0 7px 25px #0003;
}

.postHead{
  display:flex;
  gap:8px;
  align-items:center;
}

.postHead img{
  width:40px;
  height:40px;
  border-radius:50%;
  object-fit:cover;
}

.postMeta{
  min-width:0;
}

.postName{
  font-weight:bold;
  color:#75b7ff;
}

.postRoom{
  font-size:10px;
  color:#7f90a5;
}

.postText{
  white-space:pre-wrap;
  word-break:break-word;
  line-height:1.55;
  margin:9px 0;
}

.postActions{
  display:flex;
  gap:6px;
  border-top:1px solid #ffffff10;
  padding-top:7px;
  margin-top:7px;
}

.postActions button{
  border:0;
  border-radius:8px;
  background:#1d2a3b;
  color:#dce7f4;
  padding:7px 10px;
}

.danger{
  background:var(--red)!important;
  color:#fff!important;
}

.empty{
  text-align:center;
  color:#7f8da0;
  padding:35px 10px;
}

.modal{
  position:fixed;
  inset:0;
  z-index:10000;
  background:#000c;
  display:none;
  align-items:center;
  justify-content:center;
  padding:12px;
  backdrop-filter:blur(7px);
}

.modal.show{
  display:flex;
}

.box{
  width:100%;
  max-width:620px;
  max-height:94vh;
  overflow:auto;
  background:#0f1825;
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
  box-shadow:0 25px 80px #000;
}

.boxHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.boxTitle{
  font-size:20px;
  font-weight:bold;
}

.close{
  border:0;
  background:var(--red);
  color:#fff;
  border-radius:9px;
  width:38px;
  height:38px;
  font-size:22px;
}

.profileBox{
  text-align:center;
}

.profilePreview{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #315273;
  margin:5px auto 10px;
  display:block;
}

.profileBox label{
  display:block;
  text-align:right;
  font-size:12px;
  color:#aebbc9;
  margin-top:8px;
}

.adminList{
  max-height:360px;
  overflow:auto;
}

.adminRow{
  display:flex;
  align-items:center;
  gap:6px;
  background:#172333;
  padding:8px;
  border-radius:10px;
  margin-bottom:7px;
}

.adminRow .grow{
  flex:1;
  min-width:0;
}

.adminRow button{
  border:0;
  border-radius:8px;
  padding:7px;
  font-size:11px;
  color:#fff;
}

.neutral{
  background:#334258;
}

.ok{
  background:#218c60;
}

.dmLayout{
  display:grid;
  grid-template-columns:180px 1fr;
  gap:8px;
  min-height:430px;
}

.dmList{
  background:#121d2a;
  border-radius:10px;
  padding:7px;
  overflow:auto;
}

.dmUser{
  padding:8px;
  border-radius:8px;
  background:#1b2939;
  margin-bottom:5px;
  cursor:pointer;
}

.dmUser.active{
  background:#1687ff;
}

.dmChat{
  display:flex;
  flex-direction:column;
  background:#0b131e;
  border-radius:10px;
  min-width:0;
}

.dmMessages{
  flex:1;
  overflow:auto;
  padding:8px;
}

.dmMsg{
  background:#182537;
  border-radius:9px;
  padding:7px;
  margin-bottom:6px;
  max-width:82%;
  font-size:13px;
}

.dmMsg.mine{
  margin-right:auto;
  background:#174a77;
}

.dmComposer{
  display:flex;
  gap:5px;
  padding:7px;
}

.dmComposer input{
  flex:1;
  margin:0;
}

.dmComposer button{
  border:0;
  border-radius:8px;
  background:var(--blue);
  color:#fff;
  padding:0 14px;
}

@media(max-width:760px){
  .side{display:none}

  .voiceSlots{
    grid-template-columns:repeat(5,90px);
    overflow-x:auto;
  }

  .header .title{
    font-size:17px;
  }

  .headerActions .iconBtn{
    padding:7px;
  }

  .dmLayout{
    grid-template-columns:1fr;
  }

  .dmList{
    max-height:120px;
    display:flex;
    overflow-x:auto;
    gap:5px;
  }

  .dmUser{
    min-width:110px;
  }

  .roomsBar{
    padding:6px;
  }
}
</style>
</head>

<body>

<div id="loginPage">
  <div class="loginBox">

    <div class="logo">كرار جاسم</div>

    <div class="description">
      دردشة عراقية متعددة الغرف والمجتمع<br>
      تواصل، نشر، صور، فيديو، ورسائل خاصة
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="visitor">زائر</button>
      <button class="tab" data-tab="login">دخول</button>
      <button class="tab" data-tab="signup">عضوية</button>
    </div>

    <div id="visitorForm" class="form active">
      <input id="visitorName" placeholder="اسم الزائر" maxlength="30">
      <button id="visitorButton" class="btn primary">دخول كزائر</button>
    </div>

    <div id="loginForm" class="form">
      <input id="emailInput" type="email" placeholder="البريد الإلكتروني">
      <input id="passwordInput" type="password" placeholder="كلمة المرور">
      <button id="loginButton" class="btn primary">تسجيل الدخول</button>
    </div>

    <div id="signupForm" class="form">
      <input id="nameInput" placeholder="اسم العضو" maxlength="30">
      <input id="signupEmail" type="email" placeholder="البريد الإلكتروني">
      <input id="signupPassword" type="password" placeholder="كلمة المرور - 6 أحرف على الأقل">
      <button id="signupButton" class="btn primary">إنشاء العضوية</button>
    </div>

    <div id="authMessage"></div>

    <div class="status">● Firebase متصل</div>

  </div>
</div>

<div id="chatApp" class="hidden">

  <header class="header">

    <div class="headerUser">

      <img id="headerAvatar"
           class="headerAvatar"
           src="https://ui-avatars.com/api/?name=K&background=1687ff&color=fff">

      <div>
        <div class="title">كرار جاسم</div>
        <div id="currentUsername" class="username">عضو</div>
      </div>

    </div>

    <div class="headerActions">

      <button id="profileBtn" class="iconBtn">
        👤 حسابي
      </button>

      <button id="dmBtn" class="iconBtn">
        💬 خاص
      </button>

      <button id="adminBtn" class="iconBtn adminBtn hidden">
        🛡️ إشراف
      </button>

      <button id="logoutButton" class="iconBtn logout">
        خروج
      </button>

    </div>

  </header>

  <section class="voicePanel">

    <div class="voiceTitle">
      🎙️ البث الصوتي — 5 مايكات
    </div>

    <div id="voiceSlots" class="voiceSlots"></div>

  </section>

  <nav id="roomsBar" class="roomsBar"></nav>

  <main class="content">

    <section id="feed" class="feed">
      <div class="empty">
        جاري تحميل المحادثة...
      </div>
    </section>

    <aside class="side">

      <div class="sideTitle">
        👥 الموجودون الآن
      </div>

      <div id="onlineCount" class="onlineCount">
        0 عضو
      </div>

      <div id="membersList"></div>

    </aside>

  </main>

  <div id="replyBar" class="replyBar">

    <span id="replyText"></span>

    <button class="cancelReply" id="cancelReply">
      إلغاء الرد ×
    </button>

  </div>

  <div class="composer">

    <input
      id="messageInput"
      placeholder="اكتب رسالة في الغرفة..."
      maxlength="2000">

    <button id="sendButton" class="send">
      ➤
    </button>

  </div>

</div>

<!-- PROFILE -->

<div id="profileModal" class="modal">

  <div class="box profileBox">

    <div class="boxHead">
      <div class="boxTitle">👤 حسابي</div>
      <button class="close" data-close="profileModal">×</button>
    </div>

    <img id="profilePreview" class="profilePreview">

    <label>الاسم</label>

    <input id="profileName" maxlength="30">

    <label>الصورة</label>

    <input id="profilePhoto" type="file" accept="image/*">

    <button id="saveProfile" class="btn primary">
      حفظ التغييرات
    </button>

    <div id="profileStatus"></div>

  </div>

</div>

<!-- DM -->

<div id="dmModal" class="modal">

  <div class="box">

    <div class="boxHead">

      <div class="boxTitle">
        💬 المحادثة الخاصة
      </div>

      <button class="close" data-close="dmModal">
        ×
      </button>

    </div>

    <div class="dmLayout">

      <div id="dmList" class="dmList">
        <div class="empty">
          اختر عضوًا
        </div>
      </div>

      <div class="dmChat">

        <div id="dmMessages" class="dmMessages">
          <div class="empty">
            اختر عضوًا لبدء المحادثة
          </div>
        </div>

        <div class="dmComposer">

          <input
            id="dmInput"
            placeholder="رسالة خاصة...">

          <button id="dmSend">
            إرسال
          </button>

        </div>

      </div>

    </div>

  </div>

</div>

<!-- ADMIN -->

<div id="adminModal" class="modal">

  <div class="box">

    <div class="boxHead">

      <div class="boxTitle">
        🛡️ لوحة الإشراف
      </div>

      <button class="close" data-close="adminModal">
        ×
      </button>

    </div>

    <button id="deleteAllBtn" class="btn danger">
      🗑️ حذف جميع الرسائل
    </button>

    <div id="adminStatus"
         style="text-align:center;color:#9fb0c2;margin:8px">
    </div>

    <div class="adminList" id="adminList"></div>

  </div>

</div>

<script type="module">

/* =========================
   FIREBASE
========================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,

} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

import {

import {

  getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-storage.js";


const firebaseConfig = {
  apiKey:"AIzaSyAuFZxL_pmEm7weqkMQVGRME8VHeVs4fDU",
  authDomain:"dardashti-chat.firebaseapp.com",
  projectId:"dardashti-chat",
  storageBucket:"dardashti-chat.firebasestorage.app",
  messagingSenderId:"779042757468",
  appId:"1:779042757468:web:7646d3cdadf46f315a3f99"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);


/* =========================

========================= */

const ADMIN_UID = "N6KoWvu1IxbgWtVE46fmCsydZbF3";


/* =========================
   ROOMS
========================= */

const rooms = [
  "بغداد",
  "البصرة",
  "نينوى",
  "الأنبار",
  "ديالى",
  "كركوك",
  "صلاح الدين",
  "واسط",
  "بابل",
  "كربلاء",
  "النجف",
  "القادسية",
  "المثنى",
  "ذي قار",
  "ميسان",
  "أربيل",
  "السليمانية",
  "دهوك"
];


/* =========================
   STATE
========================= */

let currentRoom = rooms[0];

let unsubscribePosts = null;
let unsubscribeMembers = null;
let unsubscribeDM = null;
let voiceUnsubscribe = null;

let currentUser = null;

let currentProfile = {
  name:"عضو",
  photo:""
};

let selectedDM = null;

let replyTo = null;


/*
  مهم:
  تعريف WebRTC مرة واحدة فقط.
  في الملف القديم كان معرفًا مرتين.
*/
const peerConnections = new Map();

const candidateUnsubscribers = new Map();
const remoteAudioEls = new Map();

let currentStream = null;
let mySlot = null;

const voiceIds = [
  "voice1",

];


/* =========================
   HELPERS
========================= */

const $ = id => document.getElementById(id);

function avatarFor(name,photo){

  if(photo) return photo;

  return "https://ui-avatars.com/api/?name="
    + encodeURIComponent(name || "عضو")
    + "&background=1687ff&color=fff";
}

function escapeHtml(value){

  return String(value ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c])
  );
}

function isAdmin(){

  return currentUser &&
         currentUser.uid === ADMIN_UID;
}

function showAuthMessage(text){

  $("authMessage").textContent = text || "";
}


/* =========================
   LOGIN TABS
========================= */

document.querySelectorAll(".tab").forEach(button => {

  button.onclick = () => {

    document.querySelectorAll(".tab")
      .forEach(x => x.classList.remove("active"));

    document.querySelectorAll(".form")
      .forEach(x => x.classList.remove("active"));

    button.classList.add("active");

    const form = $(button.dataset.tab + "Form");

    if(form){
      form.classList.add("active");
    }

    showAuthMessage("");
  };

});


/* =========================
   PROFILE
========================= */

async function ensureProfile(user,nameFallback){

  const userRef = doc(db,"users",user.uid);

  const snap = await getDoc(userRef);

  if(!snap.exists()){

    await setDoc(
      userRef,
      {
        uid:user.uid,
        name:nameFallback || user.displayName || "عضو",
        email:user.email || "",
        photo:"",
        role:"user",
        banned:false,
        createdAt:serverTimestamp()
      },
      {merge:true}
    );

  }

  const finalSnap = await getDoc(userRef);

  currentProfile = finalSnap.exists()
    ? finalSnap.data()
    : {
        name:nameFallback || "عضو",
        photo:""
      };
}

    }

    currentUser = user;

          ? visitorName

        await getDoc(
          doc(db,"moderation",user.uid)

        await signOut(auth);

/* =====================================================
   WEBRTC VOICE
===================================================== */


/*
  إنشاء اتصال واحد فقط لكل مستخدم.
*/

function createPeerConnection(
  slotId,
  peerUid,
  role
){

  const key =
    slotId +
    "_" +
    peerUid +
    "_" +
    role;

  if(peerConnections.has(key)){

    return {
      pc:peerConnections.get(key),
      key
    };

  }

  const pc =
    new RTCPeerConnection({

      iceServers:[
        {
          urls:"stun:stun.l.google.com:19302"
        },
        {
          urls:"stun:stun1.l.google.com:19302"
        }
      ]

    });

  peerConnections.set(
    key,
    pc
  );

  return {
    pc,
    key
  };

}


function cleanupPeer(key){

  const pc =
    peerConnections.get(key);

  if(pc){

    try{

      pc.onicecandidate = null;
      pc.ontrack = null;
      pc.close();

    }catch(error){}

    peerConnections.delete(key);

  }

  const unsubs =
    candidateUnsubscribers.get(key) || [];

  unsubs.forEach(
    unsubscribe => {

      try{
        unsubscribe();
      }catch(error){}

    }
  );

  candidateUnsubscribers.delete(key);

  const audio =
    remoteAudioEls.get(key);

  if(audio){

    try{

      audio.pause();
      audio.srcObject = null;
      audio.remove();

    }catch(error){}

    remoteAudioEls.delete(key);

  }

}


async function addRemoteCandidate(
  pc,
  candidate
){

  if(!candidate) return;

  try{

    await pc.addIceCandidate(
      new RTCIceCandidate(candidate)
    );

  }catch(error){

    console.warn(
      "ICE:",
      error
    );

  }

}


/* =========================
   RENDER VOICE
========================= */

function renderVoice(){

  $("voiceSlots").innerHTML = "";

  voiceIds.forEach(slotId => {

    const element =
      document.createElement("div");

    element.className =
      "voiceSlot";

    element.id =
      slotId;

    element.innerHTML = `

      <div class="micIcon">
        🎙️
      </div>

      <div
        class="voiceName"
        id="${slotId}Name">
        شاغر
      </div>

      <div
        class="voiceStatus"
        id="${slotId}Status">
        اضغط للتحدث
      </div>

      <button
        id="${slotId}Btn">
        تشغيل
      </button>

    `;

    element.querySelector("button").onclick =
      () => toggleMic(slotId);

    $("voiceSlots")
      .appendChild(element);

  });

  watchVoice();

}


/* =========================
   WATCH VOICE
========================= */

function watchVoice(){

  if(voiceUnsubscribe){

    voiceUnsubscribe();

    voiceUnsubscribe = null;
  }

  voiceUnsubscribe =
    onSnapshot(
      collection(db,"voiceSlots"),
      snapshot => {

        const slots = {};

        snapshot.forEach(item => {

          slots[item.id] =
            item.data();

        });

        voiceIds.forEach(slotId => {

          const element =
            $(slotId);

          if(!element) return;

          const data =
            slots[slotId];

          const button =
            $(slotId + "Btn");

          const name =
            $(slotId + "Name");

          const status =
            $(slotId + "Status");

          if(!data){

            element.classList.remove(
              "active"
            );

            name.textContent =
              "شاغر";

            status.textContent =
              "اضغط للتحدث";

            button.textContent =
              "تشغيل";

            button.onclick =
              () => toggleMic(slotId);

            stopListeningForSlot(
              slotId
            );

            return;
          }

          element.classList.add(
            "active"
          );

          name.textContent =
            data.name || "عضو";

          const mine =
            data.uid ===
            currentUser?.uid;

          if(mine){

            status.textContent =
              "🎙️ أنت تتحدث";

            button.textContent =
              "إيقاف";

            button.onclick =
              () => toggleMic(slotId);

          }else{

            status.textContent =
              "🔊 مباشر";

            button.textContent =
              "استماع";

            button.onclick =
              () =>
                startListening(
                  slotId,
                  data.uid
                );

          }

        });

      },
      error => {

        console.error(
          "VOICE ERROR:",
          error
        );

      }
    );

}


/* =========================
   START MIC
========================= */

async function toggleMic(slotId){

  if(!currentUser){

    return;
  }

  if(currentUser.isAnonymous){

    alert(
      "سجل دخول بعضوية لاستخدام المايك"
    );

    return;
  }

  if(mySlot === slotId){

    await leaveCurrentMic();

    return;
  }

  if(mySlot){

    alert(
      "أوقف المايك الحالي أولًا"
    );

    return;
  }

  try{

    const moderation =
      await getDoc(
        doc(
          db,
          "moderation",
          currentUser.uid
        )
      );

    if(
      moderation.exists()
    ){

      const data =
        moderation.data();

      if(data.banned === true){

        alert(
          "🚫 الحساب محظور"
        );

        return;
      }

      if(data.micMuted === true){

        alert(
          "🎤 تم منعك من استخدام المايك"
        );

        return;
      }

    }

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "المتصفح لا يسمح بالمايك. تأكد من HTTPS."
      );

    }

    const slotSnap =
      await getDoc(
        doc(
          db,
          "voiceSlots",
          slotId
        )
      );

    if(slotSnap.exists()){

      alert(
        "المايك مشغول"
      );

      return;
    }

    /*
      طلب إذن المايك
    */

    currentStream =
      await navigator.mediaDevices.getUserMedia({

        audio:{
          echoCancellation:true,
          noiseSuppression:true,
          autoGainControl:true
        },

        video:false

      });

    mySlot =
      slotId;

    await setDoc(
      doc(
        db,
        "voiceSlots",
        slotId
      ),
      {
        uid:currentUser.uid,
        name:currentProfile.name,
        createdAt:serverTimestamp()
      }
    );

    /*
      وثيقة الإشارة الخاصة بالمتحدث
    */

    await setDoc(
      doc(
        db,
        "voiceCalls",
        slotId,
        "peers",
        currentUser.uid
      ),
      {
        speaker:currentUser.uid,
        createdAt:serverTimestamp()
      },
      {
        merge:true
      }
    );

  }catch(error){

    console.error(
      "MIC ERROR:",
      error
    );

    if(currentStream){

      currentStream
        .getTracks()
        .forEach(track => track.stop());

    }

    currentStream = null;
    mySlot = null;

    alert(
      "❌ تعذر تشغيل المايك:\n\n" +
      error.message
    );

  }

}


/* =========================
   LEAVE MIC
========================= */

async function leaveCurrentMic(){

  if(!mySlot){

    return;
  }

  const slot =
    mySlot;

  try{

    await deleteDoc(
      doc(
        db,
        "voiceSlots",
        slot
      )
    );

  }catch(error){

    console.warn(error);

  }

  try{

    await deleteDoc(
      doc(
        db,
        "voiceCalls",
        slot,
        "peers",
        currentUser.uid
      )
    );

  }catch(error){}

  stopListeningForSlot(
    slot
  );

  for(
    const [key]
    of peerConnections.entries()
  ){

    if(
      key.startsWith(
        slot + "_"
      )
    ){

      cleanupPeer(key);

    }

  }

  if(currentStream){

    currentStream
      .getTracks()
      .forEach(
        track => track.stop()
      );

  }

  currentStream = null;

  mySlot = null;

}


/* =========================
   LISTEN TO SPEAKER
========================= */

async function startListening(
  slotId,
  speakerUid
){

  if(!currentUser) return;

  if(
    speakerUid ===
    currentUser.uid
  ){

    return;
  }

  try{

    const peerRef =
      doc(
        db,
        "voiceCalls",
        slotId,
        "peers",
        currentUser.uid
      );

    const peerSnap =
      await getDoc(peerRef);

    /*
      إذا لم توجد offer
      ننشئ طلب انتظار بسيط.
    */

    if(
      !peerSnap.exists() ||
      !peerSnap.data().offer
    ){

      await setDoc(
        peerRef,
        {
          listener:currentUser.uid,
          requestedAt:serverTimestamp()
        },
        {
          merge:true
        }
      );

      alert(
        "البث لم يجهز بعد، اضغط استماع مرة أخرى."
      );

      return;
    }

    await connectAsListener(
      slotId,
      speakerUid,
      peerSnap.data().offer
    );

    const status =
      $(slotId + "Status");

    if(status){

      status.textContent =
        "🔊 جاري الاستماع";

    }

  }catch(error){

    console.error(
      "LISTEN ERROR:",
      error
    );

    alert(
      "❌ تعذر تشغيل الاستماع:\n\n" +
      error.message
    );

  }

}


/* =========================
   CONNECT LISTENER
========================= */

async function connectAsListener(
  slotId,
  speakerUid,
  offer
){

  const {
    pc,
    key
  } =
    createPeerConnection(
      slotId,
      currentUser.uid,
      "listener"
    );

  pc.ontrack =
    event => {

      const stream =
        event.streams &&
        event.streams[0];

      if(!stream) return;

      let audio =
        remoteAudioEls.get(key);

      if(!audio){

        audio =
          document.createElement(
            "audio"
          );

        audio.autoplay = true;
        audio.playsInline = true;
        audio.controls = false;
        audio.volume = 1;

        document.body.appendChild(
          audio
        );

        remoteAudioEls.set(
          key,
          audio
        );

      }

      audio.srcObject =
        stream;

      audio.play()
        .catch(error => {

          console.warn(
            "Audio autoplay:",
            error
          );

        });

    };

  const callerCandidates =
    collection(
      db,
      "voiceCalls",
      slotId,
      "peers",
      currentUser.uid,
      "callerCandidates"
    );

  const calleeCandidates =
    collection(
      db,
      "voiceCalls",
      slotId,
      "peers",
      currentUser.uid,
      "calleeCandidates"
    );

  pc.onicecandidate =
    async event => {

      if(!event.candidate) return;

      await addDoc(
        calleeCandidates,
        {
          candidate:
            event.candidate.toJSON(),
          from:
            currentUser.uid,
          createdAt:
            serverTimestamp()
        }
      );

    };

  const unsubscribe =
    onSnapshot(
      callerCandidates,
      snapshot => {

        snapshot.docChanges()
          .forEach(change => {

            if(
              change.type === "added"
            ){

              addRemoteCandidate(
                pc,
                change.doc.data().candidate
              );

            }

          });

      }
    );

  candidateUnsubscribers.set(
    key,
    [unsubscribe]
  );

  await pc.setRemoteDescription(
    new RTCSessionDescription(
      offer
    )
  );

  const answer =
    await pc.createAnswer();

  await pc.setLocalDescription(
    answer
  );

  await setDoc(
    doc(
      db,
      "voiceCalls",
      slotId,
      "peers",
      currentUser.uid
    ),
    {
      answer:{
        type:answer.type,
        sdp:answer.sdp
      },
      callee:currentUser.uid,
      updatedAt:serverTimestamp()
    },
    {
      merge:true
    }
  );

}


/* =========================
   STOP LISTENING
========================= */

function stopListeningForSlot(
  slotId
){

  for(
    const [key]
    of peerConnections.entries()
  ){

    if(
      key.startsWith(
        slotId + "_"
      )
    ){

      cleanupPeer(key);

    }

  }

}


/* =========================
   CLOSE MODALS
========================= */

document
  .querySelectorAll("[data-close]")
  .forEach(button => {

    button.onclick =
      () => {

        const modal =
          $(button.dataset.close);

        if(modal){

          modal.classList.remove(
            "show"
          );

        }

      };

  });


document
  .querySelectorAll(".modal")
  .forEach(modal => {

    modal.addEventListener(
      "click",
      event => {

        if(
          event.target === modal
        ){

          modal.classList.remove(
            "show"
          );

        }

      }
    );

  });


/* =========================
   PAGE CLOSE
========================= */

window.addEventListener(
  "beforeunload",
  () => {

    if(currentStream){

      currentStream
        .getTracks()
        .forEach(
          track => track.stop()
        );

    }

    for(
      const [key]
      of peerConnections.entries()
    ){

      cleanupPeer(key);

    }

  }
);

</script>
