<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>كرار جاسم</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:Arial,Tahoma,sans-serif;
  background:#070b12;
  color:#fff;
}

body{
  background:
    linear-gradient(135deg,#06101dcc,#101827dd),
    url("https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=1800&q=80")
    center/cover fixed no-repeat;
}

button,input{font-family:inherit}
button{cursor:pointer}
.hidden{display:none!important}

:root{
  --panel:#101925ed;
  --panel2:#182333ee;
  --line:#314156;
  --blue:#1687ff;
  --green:#27c47b;
  --red:#c83b4a;
  --muted:#9aa9bb;
}

#loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.loginBox{
  width:100%;
  max-width:440px;
  background:var(--panel);
  padding:24px;
  border-radius:22px;
  border:1px solid #ffffff20;
  box-shadow:0 20px 70px #000b;
  backdrop-filter:blur(12px);
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:900;
  margin-bottom:6px;
}

.description{
  text-align:center;
  color:#c5d0dc;
  line-height:1.7;
  margin-bottom:18px;
}

.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-bottom:12px;
}

.tab,.btn{
  border:0;
  border-radius:10px;
  padding:12px;
  font-weight:bold;
}

.tab{
  background:#1a2635;
  color:#ccd7e4;
  border:1px solid var(--line);
}

.tab.active,.primary{
  background:var(--blue);
  color:#fff;
}

.form{display:none}
.form.active{display:block}

input{
  width:100%;
  padding:13px;
  margin:5px 0;
  border:1px solid var(--line);
  border-radius:10px;
  background:#0b121c;
  color:#fff;
  outline:none;
}

.btn{
  width:100%;
  margin-top:7px;
  color:#fff;
}

.secondary{background:#293648}

#authMessage{
  text-align:center;
  min-height:24px;
  color:#ffb4b4;
  margin-top:10px;
}

.status{
  text-align:center;
  color:#79e2aa;
  font-size:12px;
  margin-top:10px;
}

#chatApp{
  height:100vh;
  display:flex;
  flex-direction:column;
}

.header{
  min-height:64px;
  background:#0e1723ed;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px;
  gap:8px;
  backdrop-filter:blur(10px);
}

.headerUser{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}

.headerAvatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#26364a;
}

.title{
  font-size:20px;
  font-weight:900;
}

.username{
  font-size:12px;
  color:#72e3a4;
  margin-top:2px;
}

.headerActions{
  display:flex;
  gap:6px;
  align-items:center;
  flex-wrap:wrap;
}

.iconBtn{
  border:0;
  background:#223044;
  color:#fff;
  padding:9px 10px;
  border-radius:9px;
}

.logout{background:#a82f3c}
.adminBtn{background:#8a5cf6}

.roomsBar{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:8px;
  background:#0c1420e8;
  border-bottom:1px solid var(--line);
  scrollbar-width:none;
}

.roomsBar::-webkit-scrollbar{display:none}

.roomBtn{
  white-space:nowrap;
  border:1px solid var(--line);
  background:#182333;
  color:#dce7f4;
  border-radius:9px;
  padding:8px 11px;
}

.roomBtn.active{
  background:#1687ff;
  border-color:#1687ff;
}

.content{
  flex:1;
  display:flex;
  min-height:0;
  overflow:hidden;
}

.feed{
  flex:1;
  overflow-y:auto;
  padding:12px;
  background:#0005;
}

.side{
  width:250px;
  background:#0e1724e8;
  border-right:1px solid var(--line);
  overflow-y:auto;
  padding:10px;
}

.sideTitle{
  font-weight:bold;
  margin:5px 0 10px;
}

.onlineCount{
  color:#74e2a5;
  font-size:12px;
  margin-bottom:8px;
}

.member{
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px;
  border-radius:9px;
  background:#162131;
  margin-bottom:6px;
  cursor:pointer;
}

.member img{
  width:34px;
  height:34px;
  border-radius:50%;
  object-fit:cover;
}

.memberName{
  font-size:12px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#35d47f;
  margin-right:auto;
}

.composer{
  display:flex;
  gap:7px;
  padding:8px;
  background:#111a26ee;
  border-top:1px solid var(--line);
  align-items:center;
}

.composer input{
  margin:0;
  flex:1;
}

.send{
  width:48px;
  height:46px;
  border:0;
  border-radius:10px;
  background:var(--blue);
  color:#fff;
  font-size:18px;
}

.post{
  background:#101a27ed;
  border:1px solid #ffffff12;
  border-radius:14px;
  padding:10px;
  margin-bottom:10px;
}

.postHead{
  display:flex;
  gap:8px;
  align-items:center;
}

.postHead img{
  width:40px;
  height:40px;
  border-radius:50%;
  object-fit:cover;
}

.postMeta{min-width:0}

.postName{
  font-weight:bold;
  color:#75b7ff;
}

.postRoom{
  font-size:10px;
  color:#7f90a5;
}

.postText{
  white-space:pre-wrap;
  word-break:break-word;
  line-height:1.55;
  margin:9px 0;
}

.postActions{
  display:flex;
  gap:6px;
  border-top:1px solid #ffffff10;
  padding-top:7px;
}

.postActions button{
  border:0;
  border-radius:8px;
  background:#1d2a3b;
  color:#dce7f4;
  padding:7px 10px;
}

.danger{background:var(--red)!important}

.empty{
  text-align:center;
  color:#7f8da0;
  padding:35px 10px;
}

.modal{
  position:fixed;
  inset:0;
  z-index:10000;
  background:#000c;
  display:none;
  align-items:center;
  justify-content:center;
  padding:12px;
  backdrop-filter:blur(7px);
}

.modal.show{display:flex}

.box{
  width:100%;
  max-width:620px;
  max-height:94vh;
  overflow:auto;
  background:#0f1825;
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
}

.boxHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.boxTitle{
  font-size:20px;
  font-weight:bold;
}

.close{
  border:0;
  background:var(--red);
  color:#fff;
  border-radius:9px;
  width:38px;
  height:38px;
  font-size:22px;
}

.profileBox{text-align:center}

.profilePreview{
  width:100px;
  height:100px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #315273;
  margin:5px auto 10px;
  display:block;
}

.profileBox label{
  display:block;
  text-align:right;
  font-size:12px;
  color:#aebbc9;
  margin-top:8px;
}

#profileStatus{
  min-height:22px;
  margin-top:8px;
  font-size:12px;
}

.adminRow{
  display:flex;
  align-items:center;
  gap:6px;
  background:#172333;
  padding:8px;
  border-radius:10px;
  margin-bottom:7px;
}

.adminRow .grow{
  flex:1;
  min-width:0;
}

.adminRow button{
  border:0;
  border-radius:8px;
  padding:7px;
  font-size:11px;
  color:#fff;
}

.neutral{background:#334258}

@media(max-width:760px){

  .side{display:none}

  .header .title{font-size:17px}

  .headerActions .iconBtn{padding:7px}

}
</style>
</head>

<body>

<div id="loginPage">
  <div class="loginBox">

    <div class="logo">كرار جاسم</div>

    <div class="description">
      دردشة عراقية متعددة الغرف والمجتمع<br>
      تواصل ونشر ورسائل خاصة
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="visitor">زائر</button>
      <button class="tab" data-tab="login">دخول</button>
      <button class="tab" data-tab="signup">عضوية</button>
    </div>

    <div id="visitorForm" class="form active">
      <input id="visitorName" placeholder="اسم الزائر" maxlength="30">
      <button id="visitorButton" class="btn primary">دخول كزائر</button>
    </div>

    <div id="loginForm" class="form">
      <input id="emailInput" type="email" placeholder="البريد الإلكتروني">
      <input id="passwordInput" type="password" placeholder="كلمة المرور">
      <button id="loginButton" class="btn primary">تسجيل الدخول</button>
    </div>

    <div id="signupForm" class="form">
      <input id="nameInput" placeholder="اسم العضو" maxlength="30">
      <input id="signupEmail" type="email" placeholder="البريد الإلكتروني">
      <input id="signupPassword" type="password" placeholder="كلمة المرور - 6 أحرف على الأقل">
      <button id="signupButton" class="btn primary">إنشاء العضوية</button>
    </div>

    <div id="authMessage"></div>

    <div class="status">● Firebase متصل</div>

  </div>
</div>


<div id="chatApp" class="hidden">

  <header class="header">

    <div class="headerUser">

      <img
        id="headerAvatar"
        class="headerAvatar"
        alt="الصورة الشخصية"
        src="https://ui-avatars.com/api/?name=K&background=1687ff&color=fff"
      >

      <div>
        <div class="title">كرار جاسم</div>
        <div id="currentUsername" class="username">عضو</div>
      </div>

    </div>

    <div class="headerActions">

      <button id="profileBtn" class="iconBtn">👤 حسابي</button>

      <button id="adminBtn" class="iconBtn adminBtn hidden">
        🛡️ إشراف
      </button>

      <button id="logoutButton" class="iconBtn logout">
        خروج
      </button>

    </div>

  </header>


  <nav id="roomsBar" class="roomsBar"></nav>


  <main class="content">

    <section id="feed" class="feed">
      <div class="empty">جاري تحميل المحادثة...</div>
    </section>

    <aside class="side">

      <div class="sideTitle">👥 الأعضاء</div>

      <div id="onlineCount" class="onlineCount">
        0 عضو
      </div>

      <div id="membersList"></div>

    </aside>

  </main>


  <div class="composer">

    <input
      id="messageInput"
      maxlength="2000"
      placeholder="اكتب رسالة..."
    >

    <button id="sendButton" class="send">
      ➤
    </button>

  </div>

</div>


<!-- PROFILE -->

<div id="profileModal" class="modal">

  <div class="box profileBox">

    <div class="boxHead">

      <div class="boxTitle">👤 حسابي</div>

      <button
        class="close"
        data-close="profileModal"
      >×</button>

    </div>

    <img
      id="profilePreview"
      class="profilePreview"
      alt="معاينة الصورة"
      src="https://ui-avatars.com/api/?name=K&background=1687ff&color=fff"
    >

    <label>الاسم</label>

    <input
      id="profileName"
      maxlength="30"
      placeholder="اسمك"
    >

    <label>الصورة الشخصية</label>

    <input
      id="profilePhoto"
      type="file"
      accept="image/jpeg,image/png,image/webp,image/gif"
    >

    <button
      id="saveProfile"
      class="btn primary"
    >
      حفظ التغييرات
    </button>

    <div id="profileStatus"></div>

  </div>

</div>


<!-- ADMIN -->

<div id="adminModal" class="modal">

  <div class="box">

    <div class="boxHead">

      <div class="boxTitle">🛡️ لوحة الإشراف</div>

      <button
        class="close"
        data-close="adminModal"
      >×</button>

    </div>

    <button
      id="deleteAllBtn"
      class="btn danger"
    >
      🗑️ حذف جميع الرسائل
    </button>

    <div id="adminStatus"></div>

    <div id="adminList"></div>

  </div>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signInAnonymously,
  updateProfile,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  where,
  orderBy,
  onSnapshot,
  serverTimestamp,
  doc,
  setDoc,
  getDoc,
  deleteDoc,
  limit,
  getDocs,
  writeBatch
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-storage.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
  apiKey:
    "AIzaSyAuFZxL_pmEm7weqkMQVGRME8VHeVs4fDU",

  authDomain:
    "dardashti-chat.firebaseapp.com",

  projectId:
    "dardashti-chat",

  storageBucket:
    "dardashti-chat.firebasestorage.app",

  messagingSenderId:
    "779042757468",

  appId:
    "1:779042757468:web:7646d3cdadf46f315a3f99"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const storage = getStorage(app);


const ADMIN_UID =
  "N6KoWvu1IxbgWtVE46fmCsydZbF3";


const rooms = [
  "بغداد",
  "البصرة",
  "نينوى",
  "الأنبار",
  "ديالى",
  "كركوك",
  "صلاح الدين",
  "واسط",
  "بابل",
  "كربلاء",
  "النجف",
  "القادسية",
  "المثنى",
  "ذي قار",
  "ميسان",
  "أربيل",
  "السليمانية",
  "دهوك"
];


let currentRoom = rooms[0];

let currentUser = null;

let currentProfile = {
  name:"عضو",
  photo:""
};

let unsubscribePosts = null;

let unsubscribeMembers = null;


const $ = id =>
  document.getElementById(id);


/* =========================
   HELPERS
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/[&<>"']/g, char => {

      const map = {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      };

      return map[char];

    });

}


function avatarFor(name,photo){

  if(photo && String(photo).trim()){
    return photo;
  }

  return "https://ui-avatars.com/api/?name=" +
    encodeURIComponent(name || "عضو") +
    "&background=1687ff&color=fff";
}


function isAdmin(){

  return !!(
    currentUser &&
    currentUser.uid === ADMIN_UID
  );

}


function friendlyError(error){

  const code =
    error?.code || "";

  const map = {

    "auth/invalid-credential":
      "بيانات الدخول غير صحيحة.",

    "auth/wrong-password":
      "كلمة المرور غير صحيحة.",

    "auth/user-not-found":
      "الحساب غير موجود.",

    "auth/email-already-in-use":
      "البريد الإلكتروني مستخدم مسبقًا.",

    "auth/invalid-email":
      "البريد الإلكتروني غير صحيح.",

    "auth/weak-password":
      "كلمة المرور ضعيفة.",

    "permission-denied":
      "ليس لديك صلاحية لتنفيذ هذه العملية.",

    "storage/unauthorized":
      "ليس لديك صلاحية رفع الصورة. تحقق من Storage Rules.",

    "storage/canceled":
      "تم إلغاء رفع الصورة.",

    "storage/quota-exceeded":
      "تم تجاوز مساحة التخزين.",

    "storage/unknown":
      "حدث خطأ في Firebase Storage."

  };

  return map[code] ||
    error?.message ||
    "حدث خطأ غير معروف.";

}


function showAuthMessage(text){

  $("authMessage").textContent =
    text || "";

}


/* =========================
   TABS
========================= */

document
  .querySelectorAll(".tab")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(".tab")
          .forEach(x =>
            x.classList.remove("active")
          );

        document
          .querySelectorAll(".form")
          .forEach(x =>
            x.classList.remove("active")
          );

        button.classList.add("active");

        const form =
          $(button.dataset.tab + "Form");

        if(form){
          form.classList.add("active");
        }

        showAuthMessage("");

      }
    );

  });


/* =========================
   VISITOR
========================= */

$("visitorButton")
  .addEventListener(
    "click",
    async () => {

      const name =
        $("visitorName")
          .value
          .trim();

      if(name.length < 2){

        showAuthMessage(
          "اكتب اسمًا من حرفين على الأقل."
        );

        return;
      }

      try{

        localStorage.setItem(
          "visitorName",
          name
        );

        await signInAnonymously(auth);

      }catch(error){

        console.error(error);

        showAuthMessage(
          "❌ " +
          friendlyError(error)
        );

      }

    }
  );


/* =========================
   LOGIN
========================= */

$("loginButton")
  .addEventListener(
    "click",
    async () => {

      const email =
        $("emailInput")
          .value
          .trim();

      const password =
        $("passwordInput").value;

      if(!email || !password){

        showAuthMessage(
          "أدخل البريد وكلمة المرور."
        );

        return;
      }

      try{

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      }catch(error){

        console.error(error);

        showAuthMessage(
          "❌ " +
          friendlyError(error)
        );

      }

    }
  );


/* =========================
   SIGNUP
========================= */

$("signupButton")
  .addEventListener(
    "click",
    async () => {

      const name =
        $("nameInput")
          .value
          .trim();

      const email =
        $("signupEmail")
          .value
          .trim();

      const password =
        $("signupPassword").value;

      if(name.length < 2){

        showAuthMessage(
          "الاسم يجب أن يكون حرفين على الأقل."
        );

        return;
      }

      if(!email){

        showAuthMessage(
          "أدخل البريد الإلكتروني."
        );

        return;
      }

      if(password.length < 6){

        showAuthMessage(
          "كلمة المرور يجب أن تكون 6 أحرف على الأقل."
        );

        return;
      }

      try{

        const result =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );

        await updateProfile(
          result.user,
          {
            displayName:name
          }
        );

        await setDoc(
          doc(db,"users",result.user.uid),
          {
            uid:result.user.uid,
            name:name,
            email:email,
            photo:"",
            role:"user",
            banned:false,
            createdAt:serverTimestamp()
          },
          {merge:true}
        );

        await setDoc(
          doc(db,"moderation",result.user.uid),
          {
            banned:false,
            micMuted:false,
            updatedAt:serverTimestamp()
          },
          {merge:true}
        );

      }catch(error){

        console.error(error);

        showAuthMessage(
          "❌ " +
          friendlyError(error)
        );

      }

    }
  );


/* =========================
   PROFILE
========================= */

async function ensureProfile(user,fallbackName){

  const userRef =
    doc(db,"users",user.uid);

  const snap =
    await getDoc(userRef);

  if(!snap.exists()){

    await setDoc(
      userRef,
      {
        uid:user.uid,
        name:fallbackName || "عضو",
        email:user.email || "",
        photo:"",
        role:"user",
        banned:false,
        createdAt:serverTimestamp()
      },
      {merge:true}
    );

  }

  const finalSnap =
    await getDoc(userRef);

  currentProfile =
    finalSnap.exists()
      ? finalSnap.data()
      : {
          name:fallbackName || "عضو",
          photo:""
        };

}


/* =========================
   AUTH
========================= */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      currentUser = null;

      $("loginPage")
        .classList.remove("hidden");

      $("chatApp")
        .classList.add("hidden");

      return;
    }

    currentUser = user;

    const visitorName =
      localStorage.getItem("visitorName") ||
      "زائر";

    try{

      await ensureProfile(
        user,
        user.isAnonymous
          ? visitorName
          : user.displayName || "عضو"
      );

      const moderation =
        await getDoc(
          doc(db,"moderation",user.uid)
        );

      if(
        moderation.exists() &&
        moderation.data().banned === true
      ){

        await signOut(auth);

        showAuthMessage(
          "🚫 هذا الحساب محظور."
        );

        return;
      }

      showApp();

    }catch(error){

      console.error(error);

      showAuthMessage(
        "❌ تعذر تحميل الحساب: " +
        friendlyError(error)
      );

    }

  }
);


/* =========================
   SHOW APP
========================= */

function showApp(){

  $("loginPage")
    .classList.add("hidden");

  $("chatApp")
    .classList.remove("hidden");

  $("currentUsername").textContent =
    currentProfile.name +
    (
      currentUser?.isAnonymous
        ? " (زائر)"
        : ""
    );

  $("headerAvatar").src =
    avatarFor(
      currentProfile.name,
      currentProfile.photo
    );

  $("adminBtn")
    .classList.toggle(
      "hidden",
      !isAdmin()
    );

  renderRooms();

  loadPosts();

  loadMembers();

}


/* =========================
   LOGOUT
========================= */

$("logoutButton")
  .addEventListener(
    "click",
    async () => {

      if(unsubscribePosts){
        unsubscribePosts();
        unsubscribePosts = null;
      }

      if(unsubscribeMembers){
        unsubscribeMembers();
        unsubscribeMembers = null;
      }

      localStorage.removeItem(
        "visitorName"
      );

      await signOut(auth);

    }
  );


/* =========================
   ROOMS
========================= */

function renderRooms(){

  const bar =
    $("roomsBar");

  bar.innerHTML = "";

  rooms.forEach(room => {

    const button =
      document.createElement("button");

    button.className =
      "roomBtn" +
      (
        room === currentRoom
          ? " active"
          : ""
      );

    button.textContent =
      "📍 " + room;

    button.onclick = () => {

      currentRoom = room;

      renderRooms();

      loadPosts();

    };

    bar.appendChild(button);

  });

}


/* =========================
   POSTS
========================= */

function loadPosts(){

  if(unsubscribePosts){

    unsubscribePosts();

    unsubscribePosts = null;

  }

  $("feed").innerHTML =
    '<div class="empty">جاري تحميل الرسائل...</div>';

  const q =
    query(
      collection(db,"messages"),
      where("room","==",currentRoom),
      limit(200)
    );

  unsubscribePosts =
    onSnapshot(
      q,
      snapshot => {

        const posts = [];

        snapshot.forEach(item => {

          posts.push({
            id:item.id,
            data:item.data()
          });

        });

        posts.sort((a,b) => {

          const aTime =
            a.data.createdAt?.toMillis?.() || 0;

          const bTime =
            b.data.createdAt?.toMillis?.() || 0;

          return aTime - bTime;

        });

        const feed =
          $("feed");

        feed.innerHTML = "";

        if(!posts.length){

          feed.innerHTML =
            '<div class="empty">لا توجد رسائل بعد.</div>';

          return;
        }

        posts.forEach(item => {

          renderMessage(
            item.id,
            item.data
          );

        });

        feed.scrollTop =
          feed.scrollHeight;

      },
      error => {

        console.error(error);

        $("feed").innerHTML =
          '<div class="empty">❌ ' +
          escapeHtml(
            friendlyError(error)
          ) +
          '</div>';

      }
    );

}


function renderMessage(id,data){

  const article =
    document.createElement("article");

  article.className = "post";

  const date =
    data.createdAt?.toDate
      ? data.createdAt.toDate()
          .toLocaleString("ar-IQ")
      : "الآن";

  article.innerHTML = `

    <div class="postHead">

      <img
        src="${avatarFor(data.name,data.photo)}"
        alt=""
      >

      <div class="postMeta">

        <div class="postName">
          ${escapeHtml(data.name || "عضو")}
        </div>

        <div class="postRoom">
          📍 ${escapeHtml(data.room || "")}
          · ${escapeHtml(date)}
        </div>

      </div>

    </div>

    <div class="postText">
      ${escapeHtml(data.text || "")}
    </div>

    <div class="postActions">

      ${
        isAdmin()
          ? '<button class="danger" data-delete>🗑️ حذف</button>'
          : ''
      }

    </div>
  `;

  const deleteButton =
    article.querySelector("[data-delete]");

  if(deleteButton){

    deleteButton.onclick =
      async () => {

        if(!confirm("حذف الرسالة؟")){
          return;
        }

        try{

          await deleteDoc(
            doc(db,"messages",id)
          );

        }catch(error){

          alert(
            "❌ " +
            friendlyError(error)
          );

        }

      };

  }

  $("feed").appendChild(article);

}


/* =========================
   SEND MESSAGE
========================= */

$("sendButton")
  .addEventListener(
    "click",
    sendMessage
  );

$("messageInput")
  .addEventListener(
    "keydown",
    event => {

      if(event.key === "Enter"){

        event.preventDefault();

        sendMessage();

      }

    }
  );


async function sendMessage(){

  const input =
    $("messageInput");

  const text =
    input.value.trim();

  if(!text || !currentUser){
    return;
  }

  try{

    const moderation =
      await getDoc(
        doc(
          db,
          "moderation",
          currentUser.uid
        )
      );

    if(
      moderation.exists() &&
      moderation.data().banned === true
    ){

      alert("🚫 الحساب محظور.");

      return;
    }

    await addDoc(
      collection(db,"messages"),
      {
        room:currentRoom,
        uid:currentUser.uid,
        name:currentProfile.name || "عضو",
        photo:currentProfile.photo || "",
        text:text,
        createdAt:serverTimestamp()
      }
    );

    input.value = "";

  }catch(error){

    console.error(error);

    alert(
      "❌ تعذر إرسال الرسالة:\n" +
      friendlyError(error)
    );

  }

}


/* =========================
   MEMBERS
========================= */

function loadMembers(){

  if(unsubscribeMembers){

    unsubscribeMembers();

    unsubscribeMembers = null;

  }

  const q =
    query(
      collection(db,"users"),
      limit(100)
    );

  unsubscribeMembers =
    onSnapshot(
      q,
      snapshot => {

        $("onlineCount").textContent =
          snapshot.size + " عضو";

        $("membersList").innerHTML = "";

        snapshot.forEach(item => {

          const data =
            item.data();

          if(data.banned === true){
            return;
          }

          const element =
            document.createElement("div");

          element.className =
            "member";

          element.innerHTML = `

            <img
              src="${avatarFor(data.name,data.photo)}"
              alt=""
            >

            <span class="memberName">
              ${escapeHtml(data.name || "عضو")}
            </span>

            <span class="dot"></span>

          `;

          $("membersList")
            .appendChild(element);

        });

      },
      error => {

        console.error(error);

        $("onlineCount").textContent =
          "تعذر تحميل الأعضاء";

      }
    );

}


/* =========================
   PROFILE MODAL
========================= */

$("profileBtn")
  .addEventListener(
    "click",
    () => {

      $("profileName").value =
        currentProfile.name || "";

      $("profilePreview").src =
        avatarFor(
          currentProfile.name,
          currentProfile.photo
        );

      $("profilePhoto").value = "";

      $("profileStatus").textContent = "";

      $("profileModal")
        .classList.add("show");

    }
  );


/* =========================
   IMAGE PREVIEW
========================= */

$("profilePhoto")
  .addEventListener(
    "change",
    event => {

      const file =
        event.target.files[0];

      if(!file){
        return;
      }

      if(!file.type.startsWith("image/")){

        $("profileStatus").textContent =
          "❌ اختر صورة فقط.";

        event.target.value = "";

        return;
      }

      if(file.size > 5 * 1024 * 1024){

        $("profileStatus").textContent =
          "❌ الحد الأقصى للصورة 5MB.";

        event.target.value = "";

        return;
      }

      $("profilePreview").src =
        URL.createObjectURL(file);

    }
  );


/* =========================
   SAVE PROFILE + IMAGE
========================= */

$("saveProfile")
  .addEventListener(
    "click",
    async () => {

      if(!currentUser){
        return;
      }

      const status =
        $("profileStatus");

      try{

        status.textContent =
          "جاري الحفظ...";

        const name =
          $("profileName")
            .value
            .trim();

        if(name.length < 2){

          status.textContent =
            "❌ الاسم يجب أن يكون حرفين على الأقل.";

          return;
        }

        let photo =
          currentProfile.photo || "";

        const file =
          $("profilePhoto").files[0];

        /* =========================
           IMAGE VALIDATION
        ========================= */

        if(file){

          if(!file.type.startsWith("image/")){

            status.textContent =
              "❌ الملف ليس صورة.";

            return;
          }

          if(file.size > 5 * 1024 * 1024){

            status.textContent =
              "❌ حجم الصورة أكبر من 5MB.";

            return;
          }

          status.textContent =
            "جاري رفع الصورة...";

          /* =========================
             SAFE FILE NAME
          ========================= */

          const extension =
            file.name
              .split(".")
              .pop()
              .toLowerCase()
              .replace(/[^a-z0-9]/g,"");

          const safeExtension =
            extension || "jpg";

          const filePath =
            "profiles/" +
            currentUser.uid +
            "/avatar_" +
            Date.now() +
            "." +
            safeExtension;

          /* =========================
             STORAGE
          ========================= */

          const storageRef =
            ref(
              storage,
              filePath
            );

          await uploadBytes(
            storageRef,
            file,
            {
              contentType:file.type
            }
          );

          photo =
            await getDownloadURL(
              storageRef
            );

          if(!photo){
            throw new Error(
              "لم يتم الحصول على رابط الصورة."
            );
          }

        }


        /* =========================
           FIRESTORE
        ========================= */

        status.textContent =
          "جاري حفظ بيانات الحساب...";

        await setDoc(
          doc(
            db,
            "users",
            currentUser.uid
          ),
          {
            uid:currentUser.uid,
            name:name,
            photo:photo
          },
          {
            merge:true
          }
        );


        /* =========================
           AUTH PROFILE
        ========================= */

        try{

          await updateProfile(
            currentUser,
            {
              displayName:name,
              photoURL:photo || null
            }
          );

        }catch(error){

          console.warn(
            "Auth update:",
            error
          );

        }


        /* =========================
           LOCAL UPDATE
        ========================= */

        currentProfile = {
          ...currentProfile,
          name:name,
          photo:photo
        };

        $("profilePreview").src =
          avatarFor(name,photo);

        $("headerAvatar").src =
          avatarFor(name,photo);

        $("currentUsername").textContent =
          name +
          (
            currentUser.isAnonymous
              ? " (زائر)"
              : ""
          );

        $("profilePhoto").value = "";

        status.textContent =
          "✅ تم حفظ الاسم والصورة بنجاح.";

      }catch(error){

        console.error(
          "IMAGE UPLOAD ERROR:",
          error
        );

        status.textContent =
          "❌ " +
          friendlyError(error);

      }

    }
  );


/* =========================
   ADMIN
========================= */

$("adminBtn")
  .addEventListener(
    "click",
    async () => {

      if(!isAdmin()){
        return;
      }

      $("adminModal")
        .classList.add("show");

      await loadAdmin();

    }
  );


async function loadAdmin(){

  const list =
    $("adminList");

  list.innerHTML =
    '<div class="empty">جاري التحميل...</div>';

  try{

    const snapshot =
      await getDocs(
        query(
          collection(db,"users"),
          limit(100)
        )
      );

    list.innerHTML = "";

    snapshot.forEach(item => {

      const data =
        item.data();

      const row =
        document.createElement("div");

      row.className =
        "adminRow";

      row.innerHTML = `

        <div class="grow">

          <b>
            ${escapeHtml(data.name || "عضو")}
          </b>

          <div style="font-size:10px;color:#8494a8;word-break:break-all">
            ${escapeHtml(data.uid || "")}
          </div>

        </div>

      `;

      list.appendChild(row);

    });

  }catch(error){

    console.error(error);

    list.innerHTML =
      '<div class="empty">❌ تعذر تحميل الأعضاء.</div>';

  }

}


/* =========================
   DELETE ALL
========================= */

$("deleteAllBtn")
  .addEventListener(
    "click",
    async () => {

      if(!isAdmin()){
        return;
      }

      if(!confirm(
        "هل تريد حذف جميع الرسائل؟"
      )){
        return;
      }

      const status =
        $("adminStatus");

      status.textContent =
        "جاري الحذف...";

      try{

        let total = 0;

        while(true){

          const snapshot =
            await getDocs(
              query(
                collection(db,"messages"),
                limit(400)
              )
            );

          if(snapshot.empty){
            break;
          }

          const batch =
            writeBatch(db);

          snapshot.forEach(item => {

            batch.delete(item.ref);

          });

          await batch.commit();

          total += snapshot.size;

          if(snapshot.size < 400){
            break;
          }

        }

        status.textContent =
          "✅ تم حذف " +
          total +
          " رسالة.";

      }catch(error){

        console.error(error);

        status.textContent =
          "❌ " +
          friendlyError(error);

      }

    }
  );


/* =========================
   CLOSE MODALS
========================= */

document
  .querySelectorAll("[data-close]")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        const modal =
          $(button.dataset.close);

        if(modal){
          modal.classList.remove("show");
        }

      }
    );

  });


document
  .querySelectorAll(".modal")
  .forEach(modal => {

    modal.addEventListener(
      "click",
      event => {

        if(event.target === modal){

          modal.classList.remove("show");

        }

      }
    );

  });

</script>
