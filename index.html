<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>كرار جاسم</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:Arial,Tahoma,sans-serif;
  background:#070b12;
  color:#fff;
}

body{
  background:
    linear-gradient(135deg,#06101dcc,#101827dd),
    url("https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=1800&q=80")
    center/cover fixed no-repeat;
}

button,input{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

:root{
  --panel:#101925ed;
  --panel2:#182333ee;
  --line:#314156;
  --blue:#1687ff;
  --green:#27c47b;
  --red:#c83b4a;
  --muted:#9aa9bb;
}

/* LOGIN */

#loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.loginBox{
  width:100%;
  max-width:440px;
  background:var(--panel);
  padding:24px;
  border-radius:22px;
  border:1px solid #ffffff20;
  box-shadow:0 20px 70px #000b;
  backdrop-filter:blur(12px);
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:900;
  margin-bottom:6px;
}

.description{
  text-align:center;
  color:#c5d0dc;
  line-height:1.7;
  margin-bottom:18px;
}

.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-bottom:12px;
}

.tab,.btn{
  border:0;
  border-radius:10px;
  padding:12px;
  font-weight:bold;
}

.tab{
  background:#1a2635;
  color:#ccd7e4;
  border:1px solid var(--line);
}

.tab.active,
.primary{
  background:var(--blue);
  color:#fff;
}

.form{
  display:none;
}

.form.active{
  display:block;
}

.loginBox input,
.composer input,
.profileBox input,
.dmComposer input{
  width:100%;
  padding:13px;
  margin:5px 0;
  border:1px solid var(--line);
  border-radius:10px;
  background:#0b121c;
  color:#fff;
  outline:none;
}

.btn{
  width:100%;
  margin-top:7px;
  color:#fff;
}

.secondary{
  background:#293648;
}

.status{
  text-align:center;
  color:#79e2aa;
  font-size:12px;
  margin-top:10px;
}

#authMessage{
  text-align:center;
  min-height:24px;
  color:#ffb4b4;
  margin-top:10px;
}

/* APP */

#chatApp{
  height:100vh;
  display:flex;
  flex-direction:column;
}

.header{
  min-height:64px;
  background:#0e1723ed;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px;
  gap:8px;
  backdrop-filter:blur(10px);
}

.headerUser{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}

.headerAvatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#26364a;
}

.title{
  font-size:20px;
  font-weight:900;
}

.username{
  font-size:12px;
  color:#72e3a4;
  margin-top:2px;
}

.headerActions{
  display:flex;
  gap:6px;
  align-items:center;
  flex-wrap:wrap;
}

.iconBtn{
  border:0;
  background:#223044;
  color:#fff;
  padding:9px 10px;
  border-radius:9px;
}

.logout{
  background:#a82f3c;
}

.adminBtn{
  background:#8a5cf6;
}

/* VOICE */

.voicePanel{
  background:#0d1622e8;
  border-bottom:1px solid var(--line);
  padding:9px;
}

.voiceTitle{
  text-align:center;
  font-weight:bold;
  color:#dbe6f2;
  margin-bottom:7px;
}

.voiceSlots{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}

.voiceSlot{
  min-height:82px;
  background:#172233;
  border:1px solid var(--line);
  border-radius:12px;
  padding:7px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
}

.voiceSlot.active{
  border-color:var(--green);
  box-shadow:0 0 0 1px #27c47b33;
}

.micIcon{
  font-size:25px;
}

.voiceName{
  font-size:11px;
  color:#c0cad6;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.voiceStatus{
  font-size:10px;
  color:#8797aa;
}

.voiceSlot button{
  border:0;
  border-radius:8px;
  padding:6px 8px;
  background:var(--blue);
  color:#fff;
  font-size:11px;
  font-weight:bold;
}

.voiceSlot.active button{
  background:var(--red);
}

/* ROOMS */

.roomsBar{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:8px;
  background:#0c1420e8;
  border-bottom:1px solid var(--line);
  scrollbar-width:none;
}

.roomsBar::-webkit-scrollbar{
  display:none;
}

.roomBtn{
  white-space:nowrap;
  border:1px solid var(--line);
  background:#182333;
  color:#dce7f4;
  border-radius:9px;
  padding:8px 11px;
}

.roomBtn.active{
  background:#1687ff;
  border-color:#1687ff;
}

/* CONTENT */

.content{
  flex:1;
  display:flex;
  min-height:0;
  overflow:hidden;
}

.feed{
  flex:1;
  overflow-y:auto;
  padding:12px;
  background:#0005;
}

.side{
  width:250px;
  background:#0e1724e8;
  border-right:1px solid var(--line);
  overflow-y:auto;
  padding:10px;
}

.sideTitle{
  font-weight:bold;
  margin:5px 0 10px;
}

.onlineCount{
  color:#74e2a5;
  font-size:12px;
  margin-bottom:8px;
}

.member{
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px;
  border-radius:9px;
  background:#162131;
  margin-bottom:6px;
  cursor:pointer;
}

.member:hover{
  background:#213047;
}

.member img{
  width:34px;
  height:34px;
  border-radius:50%;
  object-fit:cover;
}

.memberName{
  font-size:12px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#35d47f;
  margin-right:auto;
}

/* COMPOSER */

.composer{
  display:flex;
  gap:7px;
  padding:8px;
  background:#111a26ee;
  border-top:1px solid var(--line);
  align-items:center;
}

.composer input{
  margin:0;
  flex:1;
}

.send{
  width:48px;
  height:46px;
  border:0;
  border-radius:10px;
  background:var(--blue);
  color:#fff;
  font-size:18px;
}

.replyBar{
  background:#1c2a3c;
  border-top:1px solid #3a4d64;
  padding:7px 10px;
  font-size:12px;
  display:none;
}

.replyBar.show{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.cancelReply{
  border:0;
  background:transparent;
  color:#ff9ca6;
}

/* POSTS */

.post{
  background:#101a27ed;
  border:1px solid #ffffff12;
  border-radius:14px;
  padding:10px;
  margin-bottom:10px;
  box-shadow:0 7px 25px #0003;
}

.postHead{
  display:flex;
  gap:8px;
  align-items:center;
}

.postHead img{
  width:40px;
  height:40px;
  border-radius:50%;
  object-fit:cover;
}

.postMeta{
  min-width:0;
}

.postName{
  font-weight:bold;
  color:#75b7ff;
}

.postRoom{
  font-size:10px;
  color:#7f90a5;
}

.postText{
  white-space:pre-wrap;
  word-break:break-word;
  line-height:1.55;
  margin:9px 0;
}

.postActions{
  display:flex;
  gap:6px;
  border-top:1px solid #ffffff10;
  padding-top:7px;
  margin-top:7px;
}

.postActions button{
  border:0;
  border-radius:8px;
  background:#1d2a3b;
  color:#dce7f4;
  padding:7px 10px;
}

.danger{
  background:var(--red)!important;
  color:#fff!important;
}

.empty{
  text-align:center;
  color:#7f8da0;
  padding:35px 10px;
}

/* MODALS */

.modal{
  position:fixed;
  inset:0;
  z-index:10000;
  background:#000c;
  display:none;
  align-items:center;
  justify-content:center;
  padding:12px;
  backdrop-filter:blur(7px);
}

.modal.show{
  display:flex;
}

.box{
  width:100%;
  max-width:620px;
  max-height:94vh;
  overflow:auto;
  background:#0f1825;
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
  box-shadow:0 25px 80px #000;
}

.boxHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.boxTitle{
  font-size:20px;
  font-weight:bold;
}

.close{
  border:0;
  background:var(--red);
  color:#fff;
  border-radius:9px;
  width:38px;
  height:38px;
  font-size:22px;
}

.profileBox{
  text-align:center;
}

.profilePreview{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #315273;
  margin:5px auto 10px;
  display:block;
}

.profileBox label{
  display:block;
  text-align:right;
  font-size:12px;
  color:#aebbc9;
  margin-top:8px;
}

.adminList{
  max-height:360px;
  overflow:auto;
}

.adminRow{
  display:flex;
  align-items:center;
  gap:6px;
  background:#172333;
  padding:8px;
  border-radius:10px;
  margin-bottom:7px;
}

.adminRow .grow{
  flex:1;
  min-width:0;
}

.adminRow button{
  border:0;
  border-radius:8px;
  padding:7px;
  font-size:11px;
  color:#fff;
}

.neutral{
  background:#334258;
}

.ok{
  background:#218c60;
}

.roomIntro{
  background:#162333;
  padding:10px;
  border-radius:10px;
  color:#c8d3df;
  margin-bottom:9px;
  line-height:1.6;
}

/* DM */

.dmLayout{
  display:grid;
  grid-template-columns:180px 1fr;
  gap:8px;
  min-height:430px;
}

.dmList{
  background:#121d2a;
  border-radius:10px;
  padding:7px;
  overflow:auto;
}

.dmUser{
  padding:8px;
  border-radius:8px;
  background:#1b2939;
  margin-bottom:5px;
  cursor:pointer;
}

.dmUser.active{
  background:#1687ff;
}

.dmChat{
  display:flex;
  flex-direction:column;
  background:#0b131e;
  border-radius:10px;
  min-width:0;
}

.dmMessages{
  flex:1;
  overflow:auto;
  padding:8px;
}

.dmMsg{
  background:#182537;
  border-radius:9px;
  padding:7px;
  margin-bottom:6px;
  max-width:82%;
  font-size:13px;
}

.dmMsg.mine{
  margin-right:auto;
  background:#174a77;
}

.dmComposer{
  display:flex;
  gap:5px;
  padding:7px;
}

.dmComposer input{
  flex:1;
  margin:0;
}

.dmComposer button{
  border:0;
  border-radius:8px;
  background:var(--blue);
  color:#fff;
  padding:0 14px;
}

@media(max-width:760px){

  .side{
    display:none;
  }

  .voiceSlots{
    grid-template-columns:repeat(5,90px);
    overflow-x:auto;
  }

  .header .title{
    font-size:17px;
  }

  .headerActions .iconBtn{
    padding:7px;
  }

  .dmLayout{
    grid-template-columns:1fr;
  }

  .dmList{
    max-height:120px;
    display:flex;
    overflow-x:auto;
    gap:5px;
  }

  .dmUser{
    min-width:110px;
  }

}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage">

  <div class="loginBox">

    <div class="logo">كرار جاسم</div>

    <div class="description">
      دردشة عراقية متعددة الغرف والمجتمع<br>
      تواصل، نشر، ورسائل خاصة
    </div>

    <div class="tabs">

      <button class="tab active" data-tab="visitor">
        زائر
      </button>

      <button class="tab" data-tab="login">
        دخول
      </button>

      <button class="tab" data-tab="signup">
        عضوية
      </button>

    </div>

    <div id="visitorForm" class="form active">

      <input
        id="visitorName"
        placeholder="اسم الزائر"
        maxlength="30"
      >

      <button
        id="visitorButton"
        class="btn primary"
      >
        دخول كزائر
      </button>

    </div>

    <div id="loginForm" class="form">

      <input
        id="emailInput"
        type="email"
        placeholder="البريد الإلكتروني"
      >

      <input
        id="passwordInput"
        type="password"
        placeholder="كلمة المرور"
      >

      <button
        id="loginButton"
        class="btn primary"
      >
        تسجيل الدخول
      </button>

    </div>

    <div id="signupForm" class="form">

      <input
        id="nameInput"
        placeholder="اسم العضو"
        maxlength="30"
      >

      <input
        id="signupEmail"
        type="email"
        placeholder="البريد الإلكتروني"
      >

      <input
        id="signupPassword"
        type="password"
        placeholder="كلمة المرور - 6 أحرف على الأقل"
      >

      <button
        id="signupButton"
        class="btn primary"
      >
        إنشاء العضوية
      </button>

    </div>

    <div id="authMessage"></div>

    <div class="status">
      ● Firebase متصل
    </div>

  </div>

</div>


<!-- CHAT -->

<div id="chatApp" class="hidden">

  <header class="header">

    <div class="headerUser">

      <img
        id="headerAvatar"
        class="headerAvatar"
        src="https://ui-avatars.com/api/?name=K&background=1687ff&color=fff"
      >

      <div>

        <div class="title">
          كرار جاسم
        </div>

        <div
          id="currentUsername"
          class="username"
        >
          عضو
        </div>

      </div>

    </div>

    <div class="headerActions">

      <button
        id="profileBtn"
        class="iconBtn"
      >
        👤 حسابي
      </button>

      <button
        id="dmBtn"
        class="iconBtn"
      >
        💬 خاص
      </button>

      <button
        id="adminBtn"
        class="iconBtn adminBtn hidden"
      >
        🛡️ إشراف
      </button>

      <button
        id="logoutButton"
        class="iconBtn logout"
      >
        خروج
      </button>

    </div>

  </header>


  <!-- VOICE -->

  <section class="voicePanel">

    <div class="voiceTitle">
      🎙️ البث الصوتي — 5 مايكات
    </div>

    <div
      id="voiceSlots"
      class="voiceSlots"
    ></div>

  </section>


  <!-- ROOMS -->

  <nav
    id="roomsBar"
    class="roomsBar"
  ></nav>


  <!-- CONTENT -->

  <main class="content">

    <section
      id="feed"
      class="feed"
    >

      <div class="empty">
        جاري تحميل المحادثة...
      </div>

    </section>


    <aside class="side">

      <div class="sideTitle">
        👥 الموجودون الآن
      </div>

      <div
        id="onlineCount"
        class="onlineCount"
      >
        0 عضو
      </div>

      <div id="membersList"></div>

    </aside>

  </main>


  <!-- REPLY -->

  <div
    id="replyBar"
    class="replyBar"
  >

    <span id="replyText"></span>

    <button
      class="cancelReply"
      id="cancelReply"
    >
      إلغاء الرد ×
    </button>

  </div>


  <!-- COMPOSER -->

  <div class="composer">

    <input
      id="messageInput"
      placeholder="اكتب رسالة في الغرفة..."
      maxlength="2000"
      autocomplete="off"
    >

    <button
      id="sendButton"
      class="send"
    >
      ➤
    </button>

  </div>

</div>


<!-- PROFILE -->

<div
  id="profileModal"
  class="modal"
>

  <div class="box profileBox">

    <div class="boxHead">

      <div class="boxTitle">
        👤 حسابي
      </div>

      <button
        class="close"
        data-close="profileModal"
      >
        ×
      </button>

    </div>

    <img
      id="profilePreview"
      class="profilePreview"
    >

    <label>
      الاسم
    </label>

    <input
      id="profileName"
      maxlength="30"
    >

    <label>
      الصورة
    </label>

    <input
      id="profilePhoto"
      type="file"
      accept="image/*"
    >

    <button
      id="saveProfile"
      class="btn primary"
    >
      حفظ التغييرات
    </button>

    <div id="profileStatus"></div>

  </div>

</div>


<!-- DM -->

<div
  id="dmModal"
  class="modal"
>

  <div class="box">

    <div class="boxHead">

      <div class="boxTitle">
        💬 المحادثة الخاصة
      </div>

      <button
        class="close"
        data-close="dmModal"
      >
        ×
      </button>

    </div>

    <div class="dmLayout">

      <div
        id="dmList"
        class="dmList"
      >

        <div class="empty">
          اختر عضوًا
        </div>

      </div>

      <div class="dmChat">

        <div
          id="dmMessages"
          class="dmMessages"
        >

          <div class="empty">
            اختر عضوًا لبدء المحادثة
          </div>

        </div>

        <div class="dmComposer">

          <input
            id="dmInput"
            placeholder="رسالة خاصة..."
            autocomplete="off"
          >

          <button id="dmSend">
            إرسال
          </button>

        </div>

      </div>

    </div>

  </div>

</div>


<!-- ADMIN -->

<div
  id="adminModal"
  class="modal"
>

  <div class="box">

    <div class="boxHead">

      <div class="boxTitle">
        🛡️ لوحة الإشراف
      </div>

      <button
        class="close"
        data-close="adminModal"
      >
        ×
      </button>

    </div>

    <button
      id="deleteAllBtn"
      class="btn danger"
    >
      🗑️ حذف جميع الرسائل
    </button>

    <div
      id="adminStatus"
      style="text-align:center;color:#9fb0c2;margin:8px"
    ></div>

    <div
      class="adminList"
      id="adminList"
    ></div>

  </div>

</div>

/* =====================================================

===================================================== */

function avatarFor(name,photo){

  if(photo){
    return photo;
  }

  return `https://ui-avatars.com/api/?name=${
    encodeURIComponent(name || "عضو")
  }&background=1687ff&color=fff`;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/[&<>"']/g, char => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "\"":"&quot;",
      "'":"&#039;"

    }[char]));

}

async function ensureProfile(user,nameFallback){

  const userRef =
    doc(db,"users",user.uid);

  const snap =
    await getDoc(userRef);

  if(!snap.exists()){

    await setDoc(
      userRef,
      {
        uid:user.uid,
        name:
          nameFallback ||
          user.displayName ||
          "عضو",

        email:user.email || "",

        photo:"",

        role:"user",

        banned:false,

        createdAt:serverTimestamp()
      },
      {
        merge:true
      }
    );

  }

  const snap2 =
    await getDoc(userRef);

  currentProfile =
    snap2.exists()
      ? snap2.data()
      : {
          name:nameFallback || "عضو",
          photo:""
        };

}

/* =====================================================

===================================================== */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      currentUser = null;

      $("loginPage")
        .classList
        .remove("hidden");

      $("chatApp")
        .classList
        .add("hidden");

      return;
    }

    currentUser = user;

    const visitorName =
      localStorage.getItem(
        "visitorName"
      ) || "زائر";

    try{

      await ensureProfile(
        user,
        user.isAnonymous
          ? visitorName
          : user.displayName || "عضو"
      );


      const moderation =
        await getDoc(
          doc(
            db,
            "moderation",
            user.uid
          )
        );


      if(
        moderation.exists() &&
        moderation.data().banned === true
      ){

        await signOut(auth);

        msg("🚫 الحساب محظور");

        return;
      }


      showApp();

    }catch(error){

      console.error(error);

      msg(
        "❌ تعذر تحميل الحساب: " +
        error.message
      );

    }

  }
);

/* =====================================================
   LOAD POSTS
   مهم:
   لا نستخدم orderBy مع where
===================================================== */

function loadPosts(){

  if(unsubscribePosts){

    unsubscribePosts();

    unsubscribePosts = null;

  }


  if(!currentUser){

    return;
  }


  $("feed").innerHTML =
    '<div class="empty">جاري تحميل المحادثة...</div>';


  const messagesRef =
    collection(
      db,
      "messages"
    );


  const q =
    query(
      messagesRef,
      where(
        "room",
        "==",
        currentRoom
      ),
      limit(200)
    );


  unsubscribePosts =
    onSnapshot(
      q,
      snapshot => {

        const messages = [];


        snapshot.forEach(
          messageDoc => {

            messages.push({

              id:messageDoc.id,

              data:messageDoc.data()

            });

          }
        );


        /* ترتيب محلي */
        messages.sort(
          (a,b) => {

            const ta =
              a.data.createdAt?.toMillis
                ? a.data.createdAt.toMillis()
                : 0;

            const tb =
              b.data.createdAt?.toMillis
                ? b.data.createdAt.toMillis()
                : 0;

            return ta - tb;

          }
        );


        const feed =
          $("feed");

        feed.innerHTML = "";


        if(messages.length === 0){

          feed.innerHTML =
            '<div class="empty">لا توجد رسائل في هذه الغرفة بعد.</div>';

          return;
        }


        messages.forEach(
          item => {

            renderChatMessage(
              item.id,
              item.data
            );

          }
        );


        feed.scrollTop =
          feed.scrollHeight;

      },

      error => {

        console.error(
          "loadPosts:",
          error
        );


        $("feed").innerHTML =
          `
          <div class="empty">
            ❌ تعذر تحميل الرسائل<br>
            <small>${escapeHtml(error.message)}</small>
          </div>
          `;

      }

    );

}


/* =====================================================
   RENDER MESSAGE
===================================================== */

function renderChatMessage(id,p){

  const element =
    document.createElement("article");

  element.className =
    "post";


  let date =
    "الآن";


  if(
    p.createdAt &&
    typeof p.createdAt.toDate === "function"
  ){

    date =
      p.createdAt
        .toDate()
        .toLocaleString(
          "ar-IQ"
        );

  }


  const deleteButton =
    isAdmin()
      ? `
        <button
          data-delete
          class="danger"
        >
          🗑️ حذف
        </button>
        `
      : "";


  const replyInfo =
    p.replyTo
      ? `
        <div
          class="roomIntro"
          style="margin:5px 0"
        >
          ↩️ رد على:
          <b>
            ${escapeHtml(p.replyTo)}
          </b>
        </div>
        `
      : "";


  element.innerHTML = `

    <div class="postHead">

      <img
        src="${avatarFor(
          p.name,
          p.photo
        )}"
      >

      <div class="postMeta">

        <div class="postName">
          ${escapeHtml(
            p.name || "عضو"
          )}
        </div>

        <div class="postRoom">

          📍 ${escapeHtml(
            p.room || currentRoom
          )}

          ·

          ${escapeHtml(date)}

        </div>

      </div>

    </div>


    <div class="postText">
      ${escapeHtml(
        p.text || ""
      )}
    </div>


    ${replyInfo}


    <div class="postActions">

      ${deleteButton}

    </div>

  `;


  const deleteButtonElement =
    element.querySelector(
      "[data-delete]"
    );


  if(deleteButtonElement){

    deleteButtonElement.onclick =
      async () => {

        if(
          !confirm(
            "هل تريد حذف الرسالة؟"
          )
        ){

          return;

        }


        try{

          await deleteDoc(
            doc(
              db,
              "messages",
              id
            )
          );

        }catch(error){

          console.error(error);

          alert(
            "❌ تعذر حذف الرسالة: " +
            error.message
          );

        }

      };

  }


  $("feed")
    .appendChild(element);

}

async function sendChat(){

    input.value.trim();

      "يجب تسجيل الدخول أولًا"

  }

    return;
  }


  if(text.length > 2000){

    );

    return;
  }


  try{

    const moderation =
      await getDoc(
        doc(
          db,

          currentUser.uid
        )
      );


    if(
      moderation.exists() &&
      moderation.data().banned === true

    }


    const messageData = {

      uid:

        replyTo

      createdAt:
        serverTimestamp()

    console.log(
      "إرسال الرسالة:",
      messageData
    );


    const messageRef =
      await addDoc(
        collection(
          db,
          "messages"
        ),
        messageData
      );


    console.log(
      "تم إرسال الرسالة:",
      messageRef.id
    );


    input.value = "";

    replyTo = null;

    $("replyBar")
      .classList
      .remove("show");


  }catch(error){

    console.error(
      "SEND MESSAGE ERROR:",
      error
    );


    alert(
      "❌ تعذر إرسال الرسالة:\n" +
      error.message
    );

  }

}

$("saveProfile").onclick =
  async () => {

    try{

      const name =
        $("profileName")
          .value
          .trim();


      if(name.length < 2){

        throw new Error(
          "الاسم قصير"
        );

      }


      let photo =
        currentProfile.photo || "";


      const file =
        $("profilePhoto")
          .files[0];


      if(file){

        if(
          !file.type.startsWith(
            "image/"
          )
        ){

          throw new Error(
            "اختر صورة فقط"
          );

        }


        if(
          file.size >
          5 * 1024 * 1024
        ){

          throw new Error(
            "الصورة أكبر من 5MB"
          );

        }


        const safeName =
          (
            file.name ||
            "avatar.jpg"
          )
          .replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );


        const storageRef =
          ref(
            storage,
            `profiles/${currentUser.uid}/${Date.now()}_${safeName}`
          );


        await uploadBytes(
          storageRef,
          file,
          {
            contentType:
              file.type
          }
        );


        photo =
          await getDownloadURL(
            storageRef
          );

      }


      await setDoc(
        doc(
          db,
          "users",
          currentUser.uid
        ),
        {
          uid:currentUser.uid,
          name:name,
          photo:photo
        },
        {
          merge:true
        }
      );


      await updateProfile(
        currentUser,
        {
          displayName:name
        }
      );


      currentProfile = {
        ...currentProfile,
        name:name,
        photo:photo
      };


      $("currentUsername")
        .textContent =
        name +
        (
          currentUser.isAnonymous
            ? " (زائر)"
            : ""
        );


      $("headerAvatar").src =
        avatarFor(
          name,
          photo
        );


      $("profileStatus")
        .textContent =
        "✅ تم حفظ التغييرات";


    }catch(error){

      console.error(error);

      $("profileStatus")
        .textContent =
        "❌ " +
        error.message;

    }

  };

function dmId(a,b){

  return [
    a,
    b
  ]
  .sort()
  .join("_");

}


async function openDMWith(user){

  if(
    !currentUser ||
    user.uid === currentUser.uid
  ){

    return;
  }


  selectedDM = user;


  $("dmModal")
    .classList

  await renderDMUsers();


  loadDM();

}

function loadDM(){

  if(unsubscribeDM){

    unsubscribeDM();

    unsubscribeDM = null;

  }


  if(
    !selectedDM ||
    !currentUser
  ){

    return;
  }


  const id =
    dmId(
      currentUser.uid,
      selectedDM.uid
    );


  const q =
    query(
      collection(
        db,
        "privateChats",
        id,
        "messages"
      ),
      limit(100)
    );


  unsubscribeDM =
    onSnapshot(
      q,
      snapshot => {

        const messages = [];


        snapshot.forEach(
          messageDoc => {

            messages.push(
              messageDoc.data()
            );

          }
        );


        messages.sort(
          (a,b) => {

            const ta =
              a.createdAt?.toMillis
                ? a.createdAt.toMillis()
                : 0;

            const tb =
              b.createdAt?.toMillis
                ? b.createdAt.toMillis()
                : 0;

            return ta - tb;

          }
        );


        const box =
          $("dmMessages");


        box.innerHTML = "";


        messages.forEach(
          data => {

            const element =
              document.createElement("div");


            element.className =
              "dmMsg" +
              (
                data.uid ===
                currentUser.uid
                  ? " mine"
                  : ""
              );


            element.textContent =
              data.text || "";


            box.appendChild(
              element
            );

          }
        );


        box.scrollTop =
          box.scrollHeight;

      },

      error => {

        console.error(
          "DM:",
          error
        );

        $("dmMessages").innerHTML =
          `
          <div class="empty">
            ❌ ${escapeHtml(
              error.message
            )}
          </div>
          `;

      }

    );

}

}

$("deleteAllBtn").onclick =
  async () => {

    if(!isAdmin()){

      return;
    }


    if(
      !confirm(
        "سيتم حذف جميع الرسائل. هل أنت متأكد؟"
      )
    ){

      return;
    }


    try{

      $("adminStatus")
        .textContent =
        "جاري الحذف...";


      let total = 0;


      while(true){

        const snapshot =
          await getDocs(
            query(
              collection(
                db,
                "messages"
              ),
              limit(400)
            )
          );


        if(snapshot.empty){

          break;

        }


        const batch =
          writeBatch(db);


        snapshot.forEach(
          item => {

            batch.delete(
              item.ref
            );

          }
        );


        await batch.commit();


        total +=
          snapshot.size;


        if(
          snapshot.size < 400
        ){

          break;

        }

      }


      $("adminStatus")
        .textContent =
        `✅ تم حذف ${total} رسالة`;


    }catch(error){

      console.error(error);

      $("adminStatus")
        .textContent =
        "❌ " +
        error.message;

    }

  };


/* =====================================================
   VOICE / WEBRTC
===================================================== */

const voiceIds = [
  "voice1",
  "voice2",
  "voice3",
  "voice4",
  "voice5"
];


let voiceUnsubscribe = null;

const peerConnections =
  new Map();

const candidateUnsubscribers =
  new Map();

const remoteAudioEls =
  new Map();

let currentStream = null;

let mySlot = null;


/* =====================================================
   VOICE RENDER
===================================================== */

function renderVoice(){

  $("voiceSlots")
    .innerHTML = "";


  voiceIds.forEach(
    id => {

      const element =
        document.createElement("div");


      element.className =
        "voiceSlot";


      element.id = id;


      element.innerHTML = `

        <div class="micIcon">
          🎙️
        </div>

        <div
          class="voiceName"
          id="${id}Name"
        >
          شاغر
        </div>

        <div
          class="voiceStatus"
          id="${id}Status"
        >
          اضغط للتحدث
        </div>

        <button
          id="${id}Btn"
        >
          تشغيل
        </button>

      `;


      element.querySelector("button")
        .onclick =
        () => toggleMic(id);


      $("voiceSlots")
        .appendChild(element);

    }
  );


  watchVoice();

}


function voicePeerCollection(slotId){

  return collection(
    db,
    "voiceCalls",
    slotId,
    "peers"
  );

}


/* =====================================================
   PEER CLEANUP
===================================================== */

function cleanupPeer(key){

  const pc =
    peerConnections.get(key);


  if(pc){

    try{

      pc.onicecandidate = null;

      pc.ontrack = null;

      pc.close();

    }catch(error){}

    peerConnections.delete(key);

  }


  const unsubscribers =
    candidateUnsubscribers
      .get(key) || [];


  unsubscribers.forEach(
    unsubscribe => {

      try{

        unsubscribe();

      }catch(error){}

    }
  );


  candidateUnsubscribers
    .delete(key);

}


/* =====================================================
   ADD ICE
===================================================== */

async function addRemoteCandidate(
  pc,
  candidate
){

  try{

    if(candidate){

      await pc.addIceCandidate(
        candidate
      );

    }

  }catch(error){

    console.warn(
      "ICE:",
      error
    );

  }

}


/* =====================================================
   PEER CONNECTION
===================================================== */

function makePeerConnection(
  slotId,
  peerUid,
  role
){

  const key =
    slotId +
    "_" +
    peerUid +
    "_" +
    role;


  const pc =
    new RTCPeerConnection({

      iceServers:[
        {
          urls:
            "stun:stun.l.google.com:19302"
        },
        {
          urls:
            "stun:stun1.l.google.com:19302"
        }
      ]

    });


  peerConnections.set(
    key,
    pc
  );


  return {
    pc,
    key
  };

}


/* =====================================================
   PUBLISH
===================================================== */

async function publishToListeners(
  slotId
){

  if(!currentStream){

    return;
  }


  const peers =
    await getDocs(
      voicePeerCollection(
        slotId
      )
    );


  for(
    const peerDoc
    of peers.docs
  ){

    const peerUid =
      peerDoc.id;


    if(
      peerUid ===
      currentUser.uid
    ){

      continue;
    }


    const {
      pc,
      key
    } =
      makePeerConnection(
        slotId,
        peerUid,
        "caller"
      );


    currentStream
      .getTracks()
      .forEach(
        track =>
          pc.addTrack(
            track,
            currentStream
          )
      );


    const callerCandidates =
      collection(
        db,
        "voiceCalls",
        slotId,
        "peers",
        peerUid,
        "callerCandidates"
      );


    const calleeCandidates =
      collection(
        db,
        "voiceCalls",
        slotId,
        "peers",
        peerUid,
        "calleeCandidates"
      );


    pc.onicecandidate =
      async event => {

        if(
          event.candidate
        ){

          await addDoc(
            callerCandidates,
            {
              candidate:
                event.candidate.toJSON(),

              from:
                currentUser.uid,

              createdAt:
                serverTimestamp()
            }
          );

        }

      };


    const unsubscribe =
      onSnapshot(
        calleeCandidates,
        snapshot => {

          snapshot.docChanges()
            .forEach(
              change => {

                if(
                  change.type ===
                  "added"
                ){

                  addRemoteCandidate(
                    pc,
                    change.doc.data()
                      .candidate
                  );

                }

              }
            );

        }
      );


    candidateUnsubscribers.set(
      key,
      [unsubscribe]
    );


    const offer =
      await pc.createOffer();


    await pc.setLocalDescription(
      offer
    );


    await setDoc(
      doc(
        db,
        "voiceCalls",
        slotId,
        "peers",
        peerUid
      ),
      {
        offer:{
          type:offer.type,
          sdp:offer.sdp
        },

        caller:
          currentUser.uid,

        updatedAt:
          serverTimestamp()

      },
      {
        merge:true
      }
    );

  }

}


/* =====================================================
   LISTEN SPEAKER
===================================================== */

async function listenToSpeaker(
  slotId,
  speakerUid,
  offerData
){

  const peerKey =
    slotId +
    "_" +
    speakerUid +
    "_" +
    currentUser.uid;


  if(
    peerConnections.has(
      peerKey
    )
  ){

    return;

  }


  const {
    pc,
    key
  } =
    makePeerConnection(
      slotId,
      currentUser.uid,
      "callee"
    );


  pc.ontrack =
    event => {

      const stream =
        event.streams?.[0];


      if(!stream){

        return;

      }


      let audio =
        remoteAudioEls.get(
          peerKey
        );


      if(!audio){

        audio =
          document.createElement(
            "audio"
          );


        audio.autoplay = true;

        audio.playsInline = true;

        audio.controls = false;

        audio.volume = 1;

        audio.style.display =
          "none";


        document.body
          .appendChild(audio);


        remoteAudioEls.set(
          peerKey,
          audio
        );

      }


      audio.srcObject =
        stream;


      audio.play()
        .catch(
          error =>
            console.warn(
              "audio:",
              error
            )
        );

    };


  const callerCandidates =
    collection(
      db,
      "voiceCalls",
      slotId,
      "peers",
      currentUser.uid,
      "callerCandidates"
    );


  const calleeCandidates =
    collection(
      db,
      "voiceCalls",
      slotId,
      "peers",
      currentUser.uid,
      "calleeCandidates"
    );


  pc.onicecandidate =
    async event => {

      if(
        event.candidate
      ){

        await addDoc(
          calleeCandidates,
          {
            candidate:
              event.candidate.toJSON(),

            from:
              currentUser.uid,

            createdAt:
              serverTimestamp()
          }
        );

      }

    };


  const unsubscribe =
    onSnapshot(
      callerCandidates,
      snapshot => {

        snapshot.docChanges()
          .forEach(
            change => {

              if(
                change.type ===
                "added"
              ){

                addRemoteCandidate(
                  pc,
                  change.doc.data()
                    .candidate
                );

              }

            }
          );

      }
    );


  candidateUnsubscribers.set(
    key,
    [unsubscribe]
  );


  await pc.setRemoteDescription(
    new RTCSessionDescription(
      offerData
    )
  );


  const answer =
    await pc.createAnswer();


  await pc.setLocalDescription(
    answer
  );


  await setDoc(
    doc(
      db,
      "voiceCalls",
      slotId,
      "peers",
      currentUser.uid
    ),
    {
      answer:{
        type:answer.type,
        sdp:answer.sdp
      },

      callee:
        currentUser.uid,

      updatedAt:
        serverTimestamp()

    },
    {
      merge:true
    }
  );

}


/* =====================================================
   STOP LISTENING
===================================================== */

function stopAllListeningForSlot(
  slotId
){

  for(
    const [key]
    of peerConnections.entries()
  ){

    if(
      key.startsWith(
        slotId + "_"
      )
    ){

      cleanupPeer(key);


      const audio =
        remoteAudioEls.get(
          key
        );


      if(audio){

        try{

          audio.pause();

          audio.srcObject = null;

          audio.remove();

        }catch(error){}


        remoteAudioEls.delete(
          key
        );

      }

    }

  }

}


/* =====================================================
   WATCH VOICE
===================================================== */

function watchVoice(){

  if(voiceUnsubscribe){

    voiceUnsubscribe();

  }


  voiceUnsubscribe =
    onSnapshot(
      collection(
        db,
        "voiceSlots"
      ),
      snapshot => {

        const map = {};


        snapshot.forEach(
          item => {

            map[item.id] =
              item.data();

          }
        );


        voiceIds.forEach(
          id => {

            const data =
              map[id];


            const element =
              $(id);


            if(!element){

              return;

            }


            const button =
              $(id + "Btn");

            const name =
              $(id + "Name");

            const status =
              $(id + "Status");


            if(!data){

              element
                .classList
                .remove("active");


              name.textContent =
                "شاغر";


              status.textContent =
                "اضغط للتحدث";


              button.textContent =
                "تشغيل";


              button.disabled =
                false;


              button.onclick =
                () => toggleMic(id);


              stopAllListeningForSlot(
                id
              );


              return;

            }


            element
              .classList
              .add("active");


            name.textContent =
              data.name ||
              "عضو";


            const mine =
              data.uid ===
              currentUser?.uid;


            if(mine){

              status.textContent =
                "🎙️ أنت تتحدث";


              button.textContent =
                "إيقاف";


              button.onclick =
                () => toggleMic(id);


              publishToListeners(id)
                .catch(
                  error =>
                    console.error(
                      "publish:",
                      error
                    )
                );

            }else{

              status.textContent =
                "🔊 مباشر";


              button.textContent =
                "استماع";


              button.onclick =
                () =>
                  startListening(
                    id,
                    data.uid
                  );

            }

          }
        );

      },

      error => {

        console.error(
          "voice:",
          error
        );

        voiceIds.forEach(
          id => {

            const status =
              $(id + "Status");


            if(status){

              status.textContent =
                "❌ " +
                error.message;

            }

          }
        );

      }

    );

}


/* =====================================================
   START LISTENING
===================================================== */

async function startListening(
  slotId,
  speakerUid
){

  if(!currentUser){

    return;

  }


  if(
    speakerUid ===
    currentUser.uid
  ){

    return;

  }


  try{

    const peerRef =
      doc(
        db,
        "voiceCalls",
        slotId,
        "peers",
        currentUser.uid
      );


    const peerSnapshot =
      await getDoc(
        peerRef
      );


    if(
      !peerSnapshot.exists() ||
      !peerSnapshot.data().offer
    ){

      alert(
        "البث لم يجهز بعد، حاول مرة أخرى."
      );

      return;

    }


    await listenToSpeaker(
      slotId,
      speakerUid,
      peerSnapshot.data().offer
    );


    const status =
      $(slotId + "Status");


    if(status){

      status.textContent =
        "🔊 جاري الاستماع";

    }


  }catch(error){

    console.error(
      "listen:",
      error
    );


    alert(
      "❌ تعذر تشغيل الاستماع:\n" +
      error.message
    );

  }

}


/* =====================================================
   TOGGLE MIC
===================================================== */

async function toggleMic(
  slotId
){

  if(
    !currentUser ||
    currentUser.isAnonymous
  ){

    alert(
      "سجل دخول بعضوية لاستخدام المايك"
    );

    return;

  }


  if(
    mySlot === slotId
  ){

    await leaveCurrentMic();

    return;

  }


  if(mySlot){

    alert(
      "أوقف المايك الحالي أولًا"
    );

    return;

  }


  try{

    const moderation =
      await getDoc(
        doc(
          db,
          "moderation",
          currentUser.uid
        )
      );


    if(
      moderation.exists()
    ){

      const data =
        moderation.data();


      if(data.banned === true){

        alert(
          "🚫 الحساب محظور"
        );

        return;

      }


      if(data.micMuted === true){

        alert(
          "🎤 تم منعك من استخدام المايك"
        );

        return;

      }

    }


    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "المتصفح لا يدعم الميكروفون أو الصفحة ليست HTTPS"
      );

    }


    const slotSnapshot =
      await getDoc(
        doc(
          db,
          "voiceSlots",
          slotId
        )
      );


    if(slotSnapshot.exists()){

      alert(
        "المايك مشغول"
      );

      return;

    }


    currentStream =
      await navigator.mediaDevices
        .getUserMedia({

          audio:{
            echoCancellation:true,
            noiseSuppression:true,
            autoGainControl:true
          },

          video:false

        });


    mySlot =
      slotId;


    await setDoc(
      doc(
        db,
        "voiceSlots",
        slotId
      ),
      {
        uid:
          currentUser.uid,

        name:
          currentProfile.name,

        createdAt:
          serverTimestamp()
      }
    );


    await setDoc(
      doc(
        db,
        "voiceCalls",
        slotId,
        "peers",
        currentUser.uid
      ),
      {
        speaker:
          currentUser.uid,

        createdAt:
          serverTimestamp()
      },
      {
        merge:true
      }
    );


  }catch(error){

    console.error(
      "toggleMic:",
      error
    );


    if(currentStream){

      currentStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }


    currentStream = null;

    mySlot = null;


    alert(
      "❌ تعذر تشغيل المايك:\n" +
      error.message
    );

  }

}


/* =====================================================
   LEAVE MIC
===================================================== */

async function leaveCurrentMic(){

  if(!mySlot){

    return;

  }


  const slot =
    mySlot;


  try{

    await deleteDoc(
      doc(
        db,
        "voiceSlots",
        slot
      )
    );

  }catch(error){

    console.warn(
      "voice slot delete:",
      error
    );

  }


  try{

    await deleteDoc(
      doc(
        db,
        "voiceCalls",
        slot,
        "peers",
        currentUser.uid
      )
    );

  }catch(error){}


  stopAllListeningForSlot(
    slot
  );


  for(
    const [key]
    of peerConnections.entries()
  ){

    if(
      key.startsWith(
        slot + "_"
      )
    ){

      cleanupPeer(key);

    }

  }


  if(currentStream){

    currentStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }


  currentStream = null;

  mySlot = null;

}
