```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طليان الشعلة</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:#090d13;
  color:white;
}

button,input{
  font-family:inherit;
}

.hidden{
  display:none !important;
}

/* LOGIN */

#loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(145deg,#18283d,#090d13);
}

.loginBox{
  width:100%;
  max-width:420px;
  background:#151d28;
  padding:25px;
  border-radius:20px;
  border:1px solid #2d3a4b;
  box-shadow:0 20px 60px #0009;
}

.logo{
  text-align:center;
  font-size:29px;
  font-weight:bold;
  margin-bottom:8px;
}

.description{
  text-align:center;
  color:#a4afbd;
  margin-bottom:22px;
}

.loginBox input{
  width:100%;
  padding:14px;
  margin:6px 0;
  border:1px solid #344255;
  border-radius:10px;
  background:#0d131b;
  color:white;
  outline:none;
}

.loginBox input:focus{
  border-color:#2587ff;
}

.btn{
  width:100%;
  padding:14px;
  margin-top:8px;
  border:0;
  border-radius:10px;
  font-weight:bold;
  color:white;
}

.signup{
  background:#1687ff;
}

.login{
  background:#283444;
}

#authMessage{
  text-align:center;
  min-height:24px;
  margin-top:12px;
  color:#ffb6b6;
}

/* CHAT */

#chatApp{
  height:100vh;
  display:flex;
  flex-direction:column;
}

.header{
  height:64px;
  background:#151d28;
  border-bottom:1px solid #293646;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
}

.title{
  font-size:20px;
  font-weight:bold;
}

.username{
  font-size:12px;
  color:#6ee7a0;
  margin-top:3px;
}

.logout{
  border:0;
  background:#a92d38;
  color:white;
  padding:9px 12px;
  border-radius:9px;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:14px;
}

.message{
  display:flex;
  gap:9px;
  margin-bottom:13px;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#293646;
}

.messageContent{
  background:#18222e;
  border-radius:13px;
  padding:8px 11px;
  max-width:80%;
}

.messageName{
  color:#61a8ff;
  font-size:12px;
  font-weight:bold;
  margin-bottom:3px;
}

.messageText{
  line-height:1.5;
  word-break:break-word;
}

.composer{
  display:flex;

  padding:9px;
  background:#151d28;
  border-top:1px solid #293646;
}

.composer input{
  flex:1;
  min-width:0;
  padding:13px;
  border:1px solid #344255;
  border-radius:10px;
  background:#0d131b;
  color:white;
  outline:none;
}

.send{
  width:50px;
  border:0;
  border-radius:10px;
  background:#1687ff;
  color:white;
  font-size:18px;
}

.empty{
  text-align:center;
  color:#7e8a99;
  padding:35px 10px;
}
</style>
</head>

<body>

<!-- LOGIN PAGE -->

<div id="loginPage">

  <div class="loginBox">

    <div class="logo">🔥 طليان الشعلة</div>

    <div class="description">
      مرحبًا بك في الدردشة
    </div>

    <input
      id="nameInput"
      type="text"
      placeholder="اسم العضو"
    >

    <input
      id="emailInput"
      type="email"
      placeholder="البريد الإلكتروني"
    >

    <input
      id="passwordInput"
      type="password"
      placeholder="كلمة المرور"
    >

    <button id="signupButton" class="btn signup">
      إنشاء حساب
    </button>

    <button id="loginButton" class="btn login">
      تسجيل الدخول
    </button>

    <div id="authMessage"></div>

  </div>

</div>


<!-- CHAT APP -->

<div id="chatApp" class="hidden">

  <div class="header">

    <div>
      <div class="title">🔥 طليان الشعلة</div>
      <div id="currentUsername" class="username">
        عضو
      </div>
    </div>

    <button id="logoutButton" class="logout">
      خروج
    </button>

  </div>


  <div id="messages" class="messages">

    <div class="empty">
      جاري تحميل الدردشة...
    </div>

  </div>


  <div class="composer">

    <input
      id="messageInput"
      type="text"
      placeholder="اكتب رسالتك..."
    >

    <button id="sendButton" class="send">
      ➤
    </button>

  </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  updateProfile,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig = {

  apiKey:
  "AIzaSyAuFZxL_pmEm7weqkMQVGRME8VHeVs4fDU",

  authDomain:
  "dardashti-chat.firebaseapp.com",

  projectId:
  "dardashti-chat",

  storageBucket:
  "dardashti-chat.firebasestorage.app",

  messagingSenderId:
  "779042757468",

  appId:
  "1:779042757468:web:7646d3cdadf46f315a3f99"
};


const firebaseApp =
  initializeApp(firebaseConfig);

const auth =
  getAuth(firebaseApp);

const db =
  getFirestore(firebaseApp);


/* ELEMENTS */

const loginPage =
  document.getElementById("loginPage");

const chatApp =
  document.getElementById("chatApp");

const authMessage =
  document.getElementById("authMessage");


/* CREATE ACCOUNT */

document
.getElementById("signupButton")
.addEventListener("click", async () => {

  const name =
    document.getElementById("nameInput")
    .value.trim();

  const email =
    document.getElementById("emailInput")
    .value.trim();

  const password =
    document.getElementById("passwordInput")
    .value;


  if(name.length < 2){

    authMessage.textContent =
      "⚠️ اكتب اسم العضو";

    return;
  }


  if(!email){

    authMessage.textContent =
      "⚠️ اكتب البريد الإلكتروني";

    return;
  }


  if(password.length < 6){

    authMessage.textContent =
      "⚠️ كلمة المرور يجب أن تكون 6 أحرف على الأقل";

    return;
  }


  authMessage.textContent =
    "جاري إنشاء الحساب...";


  try{

    const result =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );


    await updateProfile(
      result.user,
      {
        displayName:name
      }
    );


    authMessage.textContent =
      "✅ تم إنشاء الحساب بنجاح";

  }

  catch(error){

    console.error(error);

    authMessage.textContent =
      "❌ " + error.code;

  }

});


/* LOGIN */

document
.getElementById("loginButton")
.addEventListener("click", async () => {

  const email =
    document.getElementById("emailInput")
    .value.trim();

  const password =
    document.getElementById("passwordInput")
    .value;


  if(!email || !password){

    authMessage.textContent =
      "⚠️ اكتب البريد وكلمة المرور";

    return;
  }


  authMessage.textContent =
    "جاري تسجيل الدخول...";


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }

  catch(error){

    console.error(error);

    authMessage.textContent =
      "❌ " + error.code;

  }

});


/* AUTH STATE */

onAuthStateChanged(
  auth,
  user => {

    if(user){

      loginPage.classList.add("hidden");

      chatApp.classList.remove("hidden");

      document
      .getElementById("currentUsername")
      .textContent =
      user.displayName || "عضو";

      loadMessages();

    }

    else{

      loginPage.classList.remove("hidden");

      chatApp.classList.add("hidden");

    }

  }
);


/* LOGOUT */

document
.getElementById("logoutButton")
.addEventListener("click", async () => {

  await signOut(auth);

});


/* SEND MESSAGE */

async function sendMessage(){

  const input =
    document.getElementById("messageInput");

  const text =
    input.value.trim();

  const user =
    auth.currentUser;


  if(!user || !text){

    return;
  }


  try{

    await addDoc(
      collection(db,"messages"),
      {
        uid:user.uid,

        name:
        user.displayName || "عضو",

        text:text,

        createdAt:
        serverTimestamp()
      }
    );


    input.value = "";

  }

  catch(error){

    console.error(error);

    alert(
      "تعذر إرسال الرسالة: "
      + error.code
    );

  }

}


/* SEND BUTTON */

document
.getElementById("sendButton")
.addEventListener(
  "click",
  sendMessage
);


/* ENTER */

document
.getElementById("messageInput")
.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){

      sendMessage();

    }

  }
);


/* LOAD MESSAGES */

function loadMessages(){

  const messagesBox =
    document.getElementById("messages");


  const messagesQuery =
    query(
      collection(db,"messages"),
      orderBy("createdAt","asc")
    );


  onSnapshot(
    messagesQuery,

    snapshot => {

      messagesBox.innerHTML = "";


      if(snapshot.empty){

        messagesBox.innerHTML =
          '<div class="empty">لا توجد رسائل بعد</div>';

        return;
      }


      snapshot.forEach(
        documentSnapshot => {

          const data =
            documentSnapshot.data();


          const row =
            document.createElement("div");

          row.className =
            "message";


          const avatar =
            document.createElement("img");

          avatar.className =
            "avatar";

          avatar.src =
            "https://ui-avatars.com/api/?name="
            + encodeURIComponent(
              data.name || "عضو"
            )
            + "&background=1687ff&color=fff";


          const content =
            document.createElement("div");

          content.className =
            "messageContent";


          const name =
            document.createElement("div");

          name.className =
            "messageName";

          name.textContent =
            data.name || "عضو";


          const text =
            document.createElement("div");

          text.className =
            "messageText";

          text.textContent =
            data.text || "";


          content.appendChild(name);

          content.appendChild(text);

          row.appendChild(avatar);

          row.appendChild(content);

          messagesBox.appendChild(row);

        }
      );


      messagesBox.scrollTop =
        messagesBox.scrollHeight;

    },

    error => {

      console.error(error);

      messagesBox.innerHTML =
        '<div class="empty">❌ تعذر تحميل الرسائل: '
        + error.code
        + '</div>';

    }

  );

}

</script>

</body>
</html>
```
