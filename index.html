<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>طليان الشعلة</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial;
  background:#111;
  color:#fff;
}

.screen{
  min-height:100vh;
}

.auth{
  max-width:420px;
  margin:auto;
  padding:40px 20px;
}

.card{
  background:#222;
  border-radius:18px;
  padding:25px;
}

h1,h2{text-align:center}

input,button{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:0;
  border-radius:9px;
}

input{
  background:#333;
  color:#fff;
}

button{
  background:#1877f2;
  color:white;
  font-weight:bold;
}

#message{
  margin-top:10px;
  text-align:center;
}

#chat{
  display:none;
  min-height:100vh;
  flex-direction:column;
}

header{
  background:#222;
  padding:15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

header h2{
  margin:0;
}

.logout{
  width:auto;
  padding:9px 14px;
  background:#b3261e;
}

.messages{
  flex:1;
  padding:15px;
  overflow-y:auto;
}

.msg{
  background:#222;
  padding:10px;
  margin:8px 0;
  border-radius:12px;
}

.msg strong{
  color:#4da3ff;
}

.composer{
  display:flex;
  gap:7px;
  padding:10px;
  background:#222;
}

.composer input{
  margin:0;
}

.send{
  width:70px;
  margin:0;
}
</style>
</head>

<body>

<!-- تسجيل الدخول -->

<div id="authScreen" class="screen">
  <div class="auth">
    <div class="card">

      <h1>🔥 طليان الشعلة</h1>

      <input
        id="name"
        type="text"
        placeholder="اسم العضو"
      >

      <input
        id="email"
        type="email"
        placeholder="البريد الإلكتروني"
      >

      <input
        id="password"
        type="password"
        placeholder="كلمة المرور"
      >

      <button id="signup">إنشاء حساب</button>

      <button id="login">تسجيل الدخول</button>

      <div id="message"></div>

    </div>
  </div>
</div>


<!-- الدردشة -->

<div id="chat">

  <header>
    <h2>🔥 طليان الشعلة</h2>
    <button id="logout" class="logout">خروج</button>
  </header>

  <div id="messages" class="messages"></div>

  <div class="composer">

    <input
      id="text"
      type="text"
      placeholder="اكتب رسالتك..."
    >

    <button id="send" class="send">إرسال</button>

  </div>

</div>

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  updateProfile,
  onAuthStateChanged,
