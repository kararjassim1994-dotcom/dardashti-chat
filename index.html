<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🔥 طليان الشعلة - الدردشة والألعاب</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Tahoma,sans-serif;background:#080b10;color:#fff}
body{background:linear-gradient(#000b,#000b),url("./background.jpeg") center/cover fixed}
button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
#loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.box{width:100%;max-width:440px;background:#101722ee;padding:22px;border-radius:20px;border:1px solid #ffffff20;box-shadow:0 20px 60px #000b;backdrop-filter:blur(8px)}
.logo{text-align:center;font-size:28px;font-weight:bold}.desc{text-align:center;color:#bfc9d5;line-height:1.7;margin:8px 0 18px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tab,.btn,.gameBtn,.send{border:0;border-radius:10px;padding:12px;color:#fff;font-weight:bold}.tab{background:#1b2633}.tab.active,.primary,.gameBtn{background:#1687ff}.form{display:none}.form.active{display:block}.box input,.composer input{width:100%;padding:13px;margin:6px 0;border:1px solid #344255;border-radius:10px;background:#0d131b;color:#fff;outline:0}.btn{width:100%;margin-top:7px}.msg{text-align:center;min-height:24px;margin-top:10px;color:#ffb6b6}
#chatApp{height:100vh;display:flex;flex-direction:column}.header{min-height:62px;background:#101722ee;border-bottom:1px solid #293646;display:flex;align-items:center;justify-content:space-between;padding:7px 10px;gap:6px}.title{font-size:19px;font-weight:bold}.username{font-size:12px;color:#6ee7a0}.headBtns{display:flex;gap:5px}.headBtns button{border:0;border-radius:9px;padding:8px;color:#fff;background:#1687ff}.headBtns .out{background:#a92d38}
.voice{padding:9px;background:#101720dd;border-bottom:1px solid #293646}.voiceTitle{text-align:center;font-weight:bold;margin-bottom:7px}.slots{display:grid;grid-template-columns:1fr 1fr;gap:7px}.slot{background:#18222e;border:1px solid #344255;border-radius:12px;padding:8px;text-align:center}.slot.active{border-color:#24c77a}.slot button{border:0;border-radius:8px;padding:7px 10px;background:#1687ff;color:#fff;margin-top:5px}.slot small{display:block;color:#9aa7b5;margin-top:3px}
.messages{flex:1;overflow:auto;padding:12px;background:#0005}.message{display:flex;gap:8px;margin-bottom:11px}.avatar{width:40px;height:40px;border-radius:50%;background:#293646}.bubble{background:#18222eeb;border-radius:12px;padding:8px 11px;max-width:82%}.name{font-size:12px;color:#61a8ff;font-weight:bold}.composer{display:flex;gap:6px;padding:8px;background:#151d28ee;border-top:1px solid #293646}.composer input{flex:1;margin:0}.send{width:48px;background:#1687ff}
.modal{position:fixed;inset:0;z-index:1000;background:#000d;display:none;align-items:center;justify-content:center;padding:10px}.modal.show{display:flex}.gamebox{width:100%;max-width:650px;max-height:94vh;overflow:auto;background:#101722;border:1px solid #344255;border-radius:18px;padding:12px}.gamehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.gamehead b{font-size:19px}.close{border:0;background:#a92d38;color:#fff;border-radius:9px;width:38px;height:38px;font-size:22px}.gamesGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.gameBtn{min-height:58px;background:#182b40}.gameBtn span{display:block;font-size:11px;color:#c9d4df;margin-top:3px}.play{display:none}.play.active{display:block}.back{border:0;background:#283444;color:#fff;padding:9px;border-radius:9px;margin-bottom:8px}.gameInfo{text-align:center;color:#cbd5e1;min-height:28px;margin:7px}.board{display:grid;gap:6px;max-width:390px;margin:10px auto}.xo{grid-template-columns:repeat(3,1fr)}.xo button{aspect-ratio:1;background:#18222e;border:1px solid #344255;border-radius:12px;color:#fff;font-size:42px}.grid4{grid-template-columns:repeat(4,1fr)}.grid5{grid-template-columns:repeat(5,1fr)}.grid6{grid-template-columns:repeat(6,1fr)}.cell{aspect-ratio:1;border:1px solid #344255;border-radius:9px;background:#18222e;color:#fff;font-size:25px}.bigbtn{width:100%;padding:12px;border:0;border-radius:10px;background:#1687ff;color:#fff;font-weight:bold}.choice{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.choice button{border:0;border-radius:10px;background:#283444;color:#fff;padding:12px 18px}.rps button{font-size:28px}.number{font-size:36px;text-align:center;padding:15px}.quiz{font-size:20px;text-align:center;padding:10px}.answer{display:grid;gap:7px}.answer button{border:0;border-radius:10px;background:#283444;color:#fff;padding:12px}.memory .cell{font-size:22px}.listrow{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}.score{text-align:center;color:#8ee0b1;font-weight:bold;margin:8px}
@media(max-width:430px){.gamesGrid{grid-template-columns:repeat(2,1fr)}.gamebox{padding:10px}.xo button{font-size:34px}}
</style>
</head>
<body>

<div id="loginPage">
<div class="box">
<div class="logo">🔥 طليان الشعلة</div>
<div class="desc">دردشة كتابية + مايكات + أكثر من 20 لعبة بسيطة</div>
<div class="tabs">
<button class="tab active" data-tab="visitor">زائر</button>
<button class="tab" data-tab="login">دخول</button>
<button class="tab" data-tab="signup">تسجيل</button>
</div>
<div id="visitorForm" class="form active"><input id="visitorName" placeholder="الاسم المستعار"><button id="visitorButton" class="btn primary">دخول كزائر</button></div>
<div id="loginForm" class="form"><input id="emailInput" type="email" placeholder="البريد الإلكتروني"><input id="passwordInput" type="password" placeholder="كلمة المرور"><button id="loginButton" class="btn primary">دخول</button></div>
<div id="signupForm" class="form"><input id="nameInput" placeholder="اسم العضو"><input id="signupEmail" type="email" placeholder="البريد الإلكتروني"><input id="signupPassword" type="password" placeholder="كلمة المرور"><button id="signupButton" class="btn primary">إنشاء حساب</button></div>
<div id="authMessage" class="msg"></div>
</div></div>

<div id="chatApp" class="hidden">
<div class="header"><div><div class="title">🔥 طليان الشعلة</div><div id="currentUsername" class="username"></div></div><div class="headBtns"><button id="gamesOpen">🎮 الألعاب</button><button id="logoutButton" class="out">خروج</button></div></div>
<div class="voice"><div class="voiceTitle">🎤 المايكات العامة</div><div class="slots">
<div id="slot1" class="slot"><b>🎤 المايك 1</b><small id="vname1">شاغر</small><button id="vbtn1">تشغيل المايك</button></div>
<div id="slot2" class="slot"><b>🎤 المايك 2</b><small id="vname2">شاغر</small><button id="vbtn2">تشغيل المايك</button></div>
</div></div>
<div id="messages" class="messages"><div class="gameInfo">جاري تحميل الدردشة...</div></div>
<div class="composer"><input id="messageInput" placeholder="اكتب رسالتك..."><button id="sendButton" class="send">➤</button></div>
</div>

<div id="gamesModal" class="modal"><div class="gamebox">
<div class="gamehead"><b>🎮 الألعاب</b><button id="gamesClose" class="close">×</button></div>
<div id="gameMenu" class="gamesGrid"></div>
<div id="gameArea" class="play"></div>
</div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signInAnonymously,updateProfile,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import {getFirestore,collection,addDoc,query,orderBy,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyAuFZxL_pmEm7weqkMQVGRME8VHeVs4fDU",authDomain:"dardashti-chat.firebaseapp.com",projectId:"dardashti-chat",storageBucket:"dardashti-chat.firebasestorage.app",messagingSenderId:"779042757468",appId:"1:779042757468:web:7646d3cdadf46f315a3f99"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
let stopMessages=null,streams=[null,null];

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".form").forEach(x=>x.classList.remove("active"));b.classList.add("active");$(b.dataset.tab+"Form").classList.add("active");$("authMessage").textContent=""});

$("visitorButton").onclick=async()=>{let n=$("visitorName").value.trim();if(n.length<2)return $("authMessage").textContent="⚠️ اكتب اسمًا صحيحًا";localStorage.setItem("visitorName",n);try{if(!auth.currentUser)await signInAnonymously(auth)}catch(e){$("authMessage").textContent="❌ "+e.code}};
$("loginButton").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("emailInput").value.trim(),$("passwordInput").value)}catch(e){$("authMessage").textContent="❌ "+e.code}};
$("signupButton").onclick=async()=>{let n=$("nameInput").value.trim(),e=$("signupEmail").value.trim(),p=$("signupPassword").value;if(n.length<2||p.length<6)return $("authMessage").textContent="⚠️ الاسم وكلمة المرور غير صحيحة";try{let r=await createUserWithEmailAndPassword(auth,e,p);await updateProfile(r.user,{displayName:n})}catch(x){$("authMessage").textContent="❌ "+x.code}};
$("logoutButton").onclick=()=>signOut(auth);

function showChat(n){$("loginPage").classList.add("hidden");$("chatApp").classList.remove("hidden");$("currentUsername").textContent=n;loadMessages()}
function loadMessages(){if(stopMessages)stopMessages();stopMessages=onSnapshot(query(collection(db,"messages"),orderBy("createdAt","asc")),s=>{let box=$("messages");box.innerHTML="";if(s.empty){box.innerHTML='<div class="gameInfo">لا توجد رسائل بعد</div>';return}s.forEach(x=>{let d=x.data(),row=document.createElement("div");row.className="message";row.innerHTML='<img class="avatar" src="https://ui-avatars.com/api/?name='+encodeURIComponent(d.name||"عضو")+'&background=1687ff&color=fff"><div class="bubble"><div class="name"></div><div></div></div>';row.querySelector(".name").textContent=d.name||"عضو";row.querySelector(".bubble div:last-child").textContent=d.text||"";box.appendChild(row)});box.scrollTop=box.scrollHeight},e=>{$("messages").innerHTML='<div class="gameInfo">❌ تعذر تحميل الرسائل</div>'})}
async function send(){let t=$("messageInput").value.trim(),u=auth.currentUser;if(!t||!u)return;try{await addDoc(collection(db,"messages"),{uid:u.uid,name:u.displayName||localStorage.getItem("visitorName")||"زائر",text:t,createdAt:serverTimestamp()});$("messageInput").value=""}catch(e){alert("تعذر إرسال الرسالة: "+e.code)}}
$("sendButton").onclick=send;$("messageInput").onkeydown=e=>{if(e.key==="Enter")send()};
onAuthStateChanged(auth,u=>{if(u)showChat(u.isAnonymous?(localStorage.getItem("visitorName")||"زائر"):(u.displayName||"عضو"));else{$("loginPage").classList.remove("hidden");$("chatApp").classList.add("hidden")}});

/* المايك المحلي: يختبر إذن الميكروفون ويوقفه عند الإيقاف. البث بين المستخدمين يحتاج WebRTC signaling منفصل. */
async function mic(i){let b=$("vbtn"+(i+1)),slot=$("slot"+(i+1)),name=$("vname"+(i+1));if(streams[i]){streams[i].getTracks().forEach(t=>t.stop());streams[i]=null;slot.classList.remove("active");name.textContent="شاغر";b.textContent="تشغيل المايك";return}try{streams[i]=await navigator.mediaDevices.getUserMedia({audio:true,video:false});slot.classList.add("active");name.textContent=auth.currentUser?.displayName||"أنت";b.textContent="إيقاف المايك"}catch(e){alert("❌ تعذر تشغيل المايك: "+(e.name||e.message))}}
$("vbtn1").onclick=()=>mic(0);$("vbtn2").onclick=()=>mic(1);

/* الألعاب */
const games=[
["❌⭕","XO"],["🔢","خمن الرقم"],["✊","حجر ورق مقص"],["🎯","هدف عشوائي"],["🧠","ذاكرة"],["🔤","كلمة مخفية"],["➕","جمع سريع"],["➖","طرح سريع"],["✖️","ضرب سريع"],["🟰","أكبر أم أصغر"],["🎲","نرد"],["🪙","عملة"],["🎰","آلة حظ"],["🟦","اضغط السريع"],["🎨","لون الكلمة"],["🔢","زوجي أم فردي"],["🧩","ترتيب الأرقام"],["⭕","أربع مربعات"],["🚦","توقف وانطلق"],["🏆","مسابقة"],["🎯","اقرب رقم"],["🐢","سباق"],["🔐","خمن الرمز"],["⚡","رد الفعل"]
];
const menu=$("gameMenu"),area=$("gameArea");
games.forEach((g,i)=>{let b=document.createElement("button");b.className="gameBtn";b.innerHTML=g[0]+" "+g[1]+'<span>لعبة '+(i+1)+'</span>';b.onclick=()=>openGame(i);menu.appendChild(b)});
$("gamesOpen").onclick=()=>{$("gamesModal").classList.add("show");menu.style.display="grid";area.classList.remove("active");area.innerHTML=""};
$("gamesClose").onclick=closeGames;$("gamesModal").onclick=e=>{if(e.target===$("gamesModal"))closeGames()};function closeGames(){$("gamesModal").classList.remove("show")}

function shell(title,body){menu.style.display="none";area.classList.add("active");area.innerHTML='<button class="back">↩ الألعاب</button><div class="gamehead"><b>'+title+'</b></div>'+body;area.querySelector(".back").onclick=()=>{$("gamesOpen").click()}}
function openGame(i){switch(i){
case 0:xo();break;case 1:guess();break;case 2:rps();break;case 3:target();break;case 4:memory();break;case 5:word();break;case 6:math("+");break;case 7:math("-");break;case 8:math("*");break;case 9:compare();break;case 10:dice();break;case 11:coin();break;case 12:slots();break;case 13:fast();break;case 14:color();break;case 15:even();break;case 16:order();break;case 17:four();break;case 18:traffic();break;case 19:quiz();break;case 20:closest();break;case 21:race();break;case 22:code();break;case 23:reaction();break;
}}

function xo(){shell("❌⭕ XO ضد الروبوت",'<div id="xi" class="gameInfo">أنت ❌</div><div id="xb" class="board xo"></div><button id="xr" class="bigbtn">لعبة جديدة</button>');let a=Array(9).fill(""),over=0,b=$("xb");function draw(){b.innerHTML="";a.forEach((v,i)=>{let x=document.createElement("button");x.textContent=v;x.onclick=()=>move(i);b.appendChild(x)})}function win(p){return [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(z=>z.every(j=>a[j]===p))}function move(i){if(over||a[i])return;a[i]="❌";draw();if(win("❌"))return $("xi").textContent="🎉 فزت!",over=1;if(a.every(Boolean))return $("xi").textContent="🤝 تعادل",over=1;$("xi").textContent="🤖 يفكر...";setTimeout(()=>{let free=a.map((v,j)=>v?null:j).filter(v=>v!==null),m=free[Math.floor(Math.random()*free.length)];a[m]="⭕";draw();if(win("⭕")){over=1;$("xi").textContent="🤖 الروبوت فاز"}else if(a.every(Boolean)){over=1;$("xi").textContent="🤝 تعادل"}else $("xi").textContent="دورك ❌"},350)}$("xr").onclick=()=>xo();draw()}

function guess(){let n=Math.floor(Math.random()*50)+1,tries=0;shell("🔢 خمن الرقم",'<div class="gameInfo">الرقم بين 1 و50</div><input id="gi" type="number" placeholder="اكتب تخمينك"><button id="gg" class="bigbtn">تحقق</button><div id="gm" class="gameInfo"></div>');$("gg").onclick=()=>{let x=+$("gi").value;tries++;if(x===n)$("gm").textContent="🎉 صحيح بعد "+tries+" محاولة!";else $("gm").textContent=x<n?"⬆️ أكبر":"⬇️ أصغر"}}
function rps(){shell("✊ حجر ورق مقص",'<div class="choice rps"><button>✊</button><button>📄</button><button>✂️</button></div><div id="rm" class="gameInfo"></div>');let a=["✊","📄","✂️"],beats={"✊":"✂️","📄":"✊","✂️":"📄"};area.querySelectorAll(".rps button").forEach(b=>b.onclick=()=>{let c=b.textContent,r=a[Math.floor(Math.random()*3)];$("rm").textContent="أنت "+c+" — الروبوت "+r+" — "+(c===r?"تعادل":beats[c]===r?"فوزك 🎉":"فوز الروبوت 🤖")})}
function target(){let n=0;shell("🎯 هدف عشوائي",'<div id="tm" class="number">0</div><button id="tb" class="bigbtn">اضغط الآن</button>');$("tb").onclick=()=>{$("tm").textContent=n=Math.floor(Math.random()*100)+1}}
function memory(){let vals=["🍎","🍎","🍋","🍋","⭐","⭐","🐱","🐱"],open=[],done=0;shell("🧠 الذاكرة",'<div id="mm" class="board grid4 memory"></div><div id="ms" class="score">0 أزواج</div>');vals.sort(()=>Math.random()-.5);vals.forEach((v,i)=>{let b=document.createElement("button");b.className="cell";b.textContent="❓";b.onclick=()=>{if(open.length>=2||b.textContent!=="❓")return;b.textContent=v;open.push([b,v]);if(open.length===2){if(open[0][1]===open[1][1]){done++;open=[];$("ms").textContent=done+" أزواج";if(done===4)$("ms").textContent="🏆 فزت!"}else setTimeout(()=>{open.forEach(x=>x[0].textContent="❓");open=[]},500)}};$("mm").appendChild(b)})}
function word(){let words=["قمر","شمس","كتاب","مدرسة","سيارة","بحر"],w=words[Math.floor(Math.random()*words.length)],shown=w[0]+" _ ".repeat(w.length-1);shell("🔤 كلمة مخفية",'<div class="number">'+shown+'</div><input id="wi" placeholder="اكتب الكلمة"><button id="wb" class="bigbtn">تحقق</button><div id="wm" class="gameInfo"></div>');$("wb").onclick=()=>$("wm").textContent=$("wi").value.trim()===w?"🎉 صحيح!":"❌ حاول مرة أخرى"}
function math(op){let a=Math.floor(Math.random()*20)+1,b=Math.floor(Math.random()*20)+1,res=op==="+"?a+b:op==="-"?a-b:a*b;shell("لعبة "+op,"<div class='number'>"+a+" "+op+" "+b+" = ؟</div><input id='mi' type='number'><button id='mb' class='bigbtn'>تحقق</button><div id='mmg' class='gameInfo'></div>");$("mb").onclick=()=>$("mmg").textContent=+$("mi").value===res?"🎉 صحيح":"❌ الإجابة: "+res}
function compare(){let a=Math.floor(Math.random()*100),b=Math.floor(Math.random()*100);shell("🟰 أكبر أم أصغر",'<div class="number">'+a+" ؟ "+b+'</div><div class="choice"><button>أكبر</button><button>أصغر</button><button>متساوي</button></div><div id="cm" class="gameInfo"></div>');area.querySelectorAll(".choice button").forEach((x,i)=>x.onclick=()=>{let ok=(i===0&&a>b)||(i===1&&a<b)||(i===2&&a===b);$("cm").textContent=ok?"🎉 صحيح":"❌ خطأ"})}
function dice(){shell("🎲 النرد",'<div id="dm" class="number">🎲</div><button id="db" class="bigbtn">ارمِ النرد</button>');$("db").onclick=()=>$("dm").textContent=Math.floor(Math.random()*6)+1}
function coin(){shell("🪙 العملة",'<div id="cm" class="number">🪙</div><button id="cb" class="bigbtn">اقلب</button>');$("cb").onclick=()=>$("cm").textContent=Math.random()<.5?"🟡 صورة":"🔵 كتابة"}
function slots(){shell("🎰 آلة الحظ",'<div id="sm" class="number">🍒 | ⭐ | 🔔</div><button id="sb" class="bigbtn">تشغيل</button>');let a=["🍒","⭐","🔔","🍋","7️⃣"];$("sb").onclick=()=>{let x=[0,0,0].map(()=>a[Math.floor(Math.random()*a.length)]);$("sm").textContent=x.join(" | ")+(x[0]===x[1]&&x[1]===x[2]?" 🎉":"")}}
function fast(){shell("🟦 اضغط السريع",'<button id="fb" class="bigbtn">ابدأ</button><div id="fm" class="gameInfo"></div>');let t=0;$("fb").onclick=()=>{if($("fb").textContent==="ابدأ"){t=Date.now();$("fb").textContent="اضغط الآن!"}else{$("fm").textContent="⏱️ "+(Date.now()-t)+" ms";$("fb").textContent="ابدأ"}}}
function color(){let c=["أحمر","أزرق","أخضر","أصفر"],x=c[Math.floor(Math.random()*4)];shell("🎨 لون الكلمة",'<div class="number">'+x+'</div><div class="choice">'+c.map(v=>"<button>"+v+"</button>").join("")+'</div><div id="col" class="gameInfo">اختر الكلمة المعروضة</div>');area.querySelectorAll(".choice button").forEach(b=>b.onclick=()=>$("col").textContent=b.textContent===x?"🎉 صحيح":"❌ خطأ")}
function even(){let n=Math.floor(Math.random()*100)+1;shell("🔢 زوجي أم فردي",'<div class="number">'+n+'</div><div class="choice"><button>زوجي</button><button>فردي</button></div><div id="em" class="gameInfo"></div>');area.querySelectorAll(".choice button").forEach((b,i)=>b.onclick=()=>$("em").textContent=(n%2===0?i===0:i===1)?"🎉 صحيح":"❌ خطأ")}
function order(){let a=[1,2,3,4,5];a.sort(()=>Math.random()-.5);shell("🧩 ترتيب الأرقام",'<div id="om" class="number">'+a.join("  ")+'</div><input id="oi" placeholder="مثال: 1 2 3 4 5"><button id="ob" class="bigbtn">تحقق</button><div id="oq" class="gameInfo"></div>');$("ob").onclick=()=>$("oq").textContent=$("oi").value.trim()==="1 2 3 4 5"?"🎉 صحيح":"❌ حاول"}
function four(){let cells=Array(16).fill("");shell("⭕ أربع مربعات",'<div id="fb4" class="board grid4"></div><div id="f4" class="gameInfo">أكمل 4 رموز متتالية</div>');let b=$("fb4");cells.forEach((v,i)=>{let x=document.createElement("button");x.className="cell";x.onclick=()=>{if(!cells[i]){cells[i]="⭕";x.textContent="⭕";let r=[0,1,2,3,4].some(()=>false);if(cells.every(Boolean))$("f4").textContent="انتهت الجولة"} };b.appendChild(x)})}
function traffic(){let go=false;shell("🚦 توقف وانطلق",'<div id="tr" class="number">🔴</div><button id="trb" class="bigbtn">اضغط عندما تصبح خضراء</button><div id="trm" class="gameInfo"></div>');setTimeout(()=>{go=true;$("tr").textContent="🟢"},1000+Math.random()*2000);$("trb").onclick=()=>$("trm").textContent=go?"🎉 توقيت صحيح":"⛔ مبكر!"}
function quiz(){let qs=[["عاصمة العراق؟",["بغداد","البصرة","أربيل"],0],["كم يومًا في الأسبوع؟",["5","7","10"],1],["2+2؟",["3","4","5"],1]],q=qs[Math.floor(Math.random()*qs.length)];shell("🏆 مسابقة",'<div class="quiz">'+q[0]+'</div><div class="answer">'+q[1].map(x=>"<button>"+x+"</button>").join("")+'</div><div id="qm" class="gameInfo"></div>');area.querySelectorAll(".answer button").forEach((b,i)=>b.onclick=()=>$("qm").textContent=i===q[2]?"🎉 صحيح":"❌ خطأ")}
function closest(){let n=Math.floor(Math.random()*100)+1;shell("🎯 أقرب رقم",'<div class="number">الهدف: '+n+'</div><input id="cl" type="number" placeholder="اختر رقمًا من 1 إلى 100"><button id="clb" class="bigbtn">تحقق</button><div id="clm" class="gameInfo"></div>');$("clb").onclick=()=>{let x=+$("cl").value;$("clm").textContent="الفارق: "+Math.abs(n-x)}}
function race(){let p=0,r=0;shell("🐢 سباق",'<div class="number">🏁</div><button id="rb" class="bigbtn">خطوة</button><div id="rm2" class="gameInfo">أنت 0 — الروبوت 0</div>');$("rb").onclick=()=>{p++;if(Math.random()<.8)r++;$("rm2").textContent="أنت "+p+" — الروبوت "+r+(p>=10?" 🎉 فزت!":r>=10?" 🤖 فاز!":"")}}
function code(){let n=Math.floor(Math.random()*900)+100;shell("🔐 خمن الرمز",'<div class="gameInfo">رمز من 3 أرقام</div><input id="ci" type="number"><button id="cb2" class="bigbtn">تحقق</button><div id="cm2" class="gameInfo"></div>');$("cb2").onclick=()=>{let x=+$("ci").value;$("cm2").textContent=x===n?"🎉 صحيح!":"❌ ليس صحيحًا (تلميح: "+(x<n?"أكبر":"أصغر")+")"}}
function reaction(){shell("⚡ رد الفعل",'<button id="rr" class="bigbtn">ابدأ</button><div id="rrm" class="number"></div>');let start=0;function arm(){setTimeout(()=>{$("rr").textContent="اضغط!";start=Date.now()},1000+Math.random()*2500)}$("rr").onclick=()=>{if($("rr").textContent==="ابدأ"){arm()}else{$("rrm").textContent=(Date.now()-start)+" ms";$("rr").textContent="ابدأ"}}}
</script>
</body>
</html>
