<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>طليان الشعلة</title>

<style>
body{
  font-family:Arial;
  background:#111;
  color:white;
  margin:0;
}

.box{
  max-width:400px;
  margin:50px auto;
  padding:25px;
  background:#222;
  border-radius:15px;
}

h2{
  text-align:center;
}

input,button{
  width:100%;
  padding:13px;
  margin:7px 0;
  box-sizing:border-box;
  border-radius:8px;
  border:0;
}

input{
  background:#333;
  color:white;
}

button{
  background:#1877f2;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

#msg{
  text-align:center;
  margin-top:12px;
}
</style>
</head>

<body>

<div class="box">

<h2>🔥 طليان الشعلة</h2>

<input
  id="name"
  type="text"
  placeholder="اسم العضو"
>

<input
  id="email"
  type="email"
  placeholder="البريد الإلكتروني"
>

<input
  id="password"
  type="password"
  placeholder="كلمة المرور"
>

<button id="signup">إنشاء حساب</button>

<button id="login">تسجيل الدخول</button>

<div id="msg"></div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  updateProfile
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


const firebaseConfig = {

  apiKey:"AIzaSyAuFZxL_pmEm7weqkMQVGRME8VHeVs4fDU",

  authDomain:"dardashti-chat.firebaseapp.com",

  projectId:"dardashti-chat",

  storageBucket:"dardashti-chat.firebasestorage.app",

  messagingSenderId:"779042757468",

  appId:"1:779042757468:web:7646d3cdadf46f315a3f99"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const msg = document.getElementById("msg");


document.getElementById("signup").onclick = async () => {

  const name =
    document.getElementById("name").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;


  if (!name || !email || !password) {

    msg.textContent = "⚠️ املأ جميع الحقول";

    return;
  }


  try {

    const userCredential =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );


    await updateProfile(
      userCredential.user,
      {
        displayName: name
      }
    );


    msg.textContent =
      "✅ تم إنشاء الحساب باسم " + name;

  }

  catch(e) {

    msg.textContent =
      "❌ " + e.message;

  }

};


document.getElementById("login").onclick = async () => {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;


  try {

    const userCredential =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


    const name =
      userCredential.user.displayName || "عضو";


    msg.textContent =
      "✅ مرحبًا " + name;

  }

  catch(e) {

    msg.textContent =
      "❌ " + e.message;

  }

};

</script>

</body>
</html>
