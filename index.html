<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>كرار جاسم</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Tahoma,sans-serif;background:#070b12;color:#fff}
body{
  background:
    linear-gradient(135deg,#06101dcc,#101827dd),
    url("https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=1800&q=80") center/cover fixed no-repeat;
}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
.hidden{display:none!important}
:root{--panel:#101925ed;--panel2:#182333ee;--line:#314156;--blue:#1687ff;--green:#27c47b;--red:#c83b4a;--muted:#9aa9bb}
#loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.loginBox{width:100%;max-width:440px;background:var(--panel);padding:24px;border-radius:22px;border:1px solid #ffffff20;box-shadow:0 20px 70px #000b;backdrop-filter:blur(12px)}
.logo{text-align:center;font-size:32px;font-weight:900;margin-bottom:6px}
.description{text-align:center;color:#c5d0dc;line-height:1.7;margin-bottom:18px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.tab,.btn{border:0;border-radius:10px;padding:12px;font-weight:bold}
.tab{background:#1a2635;color:#ccd7e4;border:1px solid var(--line)}
.tab.active,.primary{background:var(--blue);color:#fff}
.form{display:none}.form.active{display:block}
.loginBox input,.composer input,.composer textarea,.profileBox input{width:100%;padding:13px;margin:5px 0;border:1px solid var(--line);border-radius:10px;background:#0b121c;color:#fff;outline:none}
.btn{width:100%;margin-top:7px;color:#fff}.secondary{background:#293648}.status{text-align:center;color:#79e2aa;font-size:12px;margin-top:10px}
#authMessage{text-align:center;min-height:24px;color:#ffb4b4;margin-top:10px}

#chatApp{height:100vh;display:flex;flex-direction:column}
.header{min-height:64px;background:#0e1723ed;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 10px;gap:8px;backdrop-filter:blur(10px)}
.headerUser{display:flex;align-items:center;gap:9px;min-width:0}.headerAvatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#26364a}
.title{font-size:20px;font-weight:900}.username{font-size:12px;color:#72e3a4;margin-top:2px}
.headerActions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.iconBtn{border:0;background:#223044;color:#fff;padding:9px 10px;border-radius:9px}.logout{background:#a82f3c}.adminBtn{background:#8a5cf6}
.voicePanel{background:#0d1622e8;border-bottom:1px solid var(--line);padding:9px}
.voiceTitle{text-align:center;font-weight:bold;color:#dbe6f2;margin-bottom:7px}
.voiceSlots{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.voiceSlot{min-height:82px;background:#172233;border:1px solid var(--line);border-radius:12px;padding:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.voiceSlot.active{border-color:var(--green);box-shadow:0 0 0 1px #27c47b33}
.micIcon{font-size:25px}.voiceName{font-size:11px;color:#c0cad6;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.voiceStatus{font-size:10px;color:#8797aa}.voiceSlot button{border:0;border-radius:8px;padding:6px 8px;background:var(--blue);color:#fff;font-size:11px;font-weight:bold}
.voiceSlot.active button{background:var(--red)}
.roomsBar{display:flex;gap:7px;overflow-x:auto;padding:8px;background:#0c1420e8;border-bottom:1px solid var(--line);scrollbar-width:none}
.roomsBar::-webkit-scrollbar{display:none}.roomBtn{white-space:nowrap;border:1px solid var(--line);background:#182333;color:#dce7f4;border-radius:9px;padding:8px 11px}.roomBtn.active{background:#1687ff;border-color:#1687ff}
.content{flex:1;display:flex;min-height:0;overflow:hidden}
.feed{flex:1;overflow-y:auto;padding:12px;background:#0005}
.side{width:250px;background:#0e1724e8;border-right:1px solid var(--line);overflow-y:auto;padding:10px}
.sideTitle{font-weight:bold;margin:5px 0 10px}.onlineCount{color:#74e2a5;font-size:12px;margin-bottom:8px}
.member{display:flex;align-items:center;gap:8px;padding:7px;border-radius:9px;background:#162131;margin-bottom:6px;cursor:pointer}.member:hover{background:#213047}.member img{width:34px;height:34px;border-radius:50%;object-fit:cover}.memberName{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:#35d47f;margin-right:auto}
.composer{display:flex;gap:7px;padding:8px;background:#111a26ee;border-top:1px solid var(--line);align-items:center}.composer input{margin:0;flex:1}.send{width:48px;height:46px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-size:18px}.attach{width:45px;height:46px;border:0;border-radius:10px;background:#293648;color:#fff}.replyBar{background:#1c2a3c;border-top:1px solid #3a4d64;padding:7px 10px;font-size:12px;display:none}.replyBar.show{display:flex;justify-content:space-between;align-items:center}.cancelReply{border:0;background:transparent;color:#ff9ca6}
.post{background:#101a27ed;border:1px solid #ffffff12;border-radius:14px;padding:10px;margin-bottom:10px;box-shadow:0 7px 25px #0003}.postHead{display:flex;gap:8px;align-items:center}.postHead img{width:40px;height:40px;border-radius:50%;object-fit:cover}.postMeta{min-width:0}.postName{font-weight:bold;color:#75b7ff}.postRoom{font-size:10px;color:#7f90a5}.postText{white-space:pre-wrap;word-break:break-word;line-height:1.55;margin:9px 0}.postMedia{width:100%;max-height:420px;object-fit:contain;background:#080c12;border-radius:10px}.postActions{display:flex;gap:6px;border-top:1px solid #ffffff10;padding-top:7px;margin-top:7px}.postActions button{border:0;border-radius:8px;background:#1d2a3b;color:#dce7f4;padding:7px 10px}.postActions button.liked{background:#224c79;color:#fff}.comments{margin-top:7px;border-top:1px solid #ffffff0e;padding-top:7px}.comment{font-size:12px;padding:5px 7px;background:#172333;border-radius:8px;margin-top:5px}.comment b{color:#77b8ff}.commentInput{display:flex;gap:5px;margin-top:6px}.commentInput input{flex:1;padding:9px;border:1px solid var(--line);border-radius:8px;background:#0b121b;color:#fff}.commentInput button{border:0;border-radius:8px;background:var(--blue);color:#fff;padding:8px 12px}
.empty{text-align:center;color:#7f8da0;padding:35px 10px}

.modal{position:fixed;inset:0;z-index:10000;background:#000c;display:none;align-items:center;justify-content:center;padding:12px;backdrop-filter:blur(7px)}.modal.show{display:flex}.box{width:100%;max-width:620px;max-height:94vh;overflow:auto;background:#0f1825;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 25px 80px #000}.boxHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.boxTitle{font-size:20px;font-weight:bold}.close{border:0;background:var(--red);color:#fff;border-radius:9px;width:38px;height:38px;font-size:22px}
.profileBox{text-align:center}.profilePreview{width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid #315273;margin:5px auto 10px;display:block}.profileBox label{display:block;text-align:right;font-size:12px;color:#aebbc9;margin-top:8px}
.adminList{max-height:360px;overflow:auto}.adminRow{display:flex;align-items:center;gap:6px;background:#172333;padding:8px;border-radius:10px;margin-bottom:7px}.adminRow .grow{flex:1;min-width:0}.adminRow button{border:0;border-radius:8px;padding:7px;font-size:11px;color:#fff}.danger{background:var(--red)}.ok{background:#218c60}.neutral{background:#334258}
.roomIntro{background:#162333;padding:10px;border-radius:10px;color:#c8d3df;margin-bottom:9px;line-height:1.6}

.dmLayout{display:grid;grid-template-columns:180px 1fr;gap:8px;min-height:430px}.dmList{background:#121d2a;border-radius:10px;padding:7px;overflow:auto}.dmUser{padding:8px;border-radius:8px;background:#1b2939;margin-bottom:5px;cursor:pointer}.dmUser.active{background:#1687ff}.dmChat{display:flex;flex-direction:column;background:#0b131e;border-radius:10px;min-width:0}.dmMessages{flex:1;overflow:auto;padding:8px}.dmMsg{background:#182537;border-radius:9px;padding:7px;margin-bottom:6px;max-width:82%;font-size:13px}.dmMsg.mine{margin-right:auto;background:#174a77}.dmComposer{display:flex;gap:5px;padding:7px}.dmComposer input{flex:1;padding:10px;border:1px solid var(--line);border-radius:8px;background:#101a27;color:#fff}.dmComposer button{border:0;border-radius:8px;background:var(--blue);color:#fff;padding:0 14px}
@media(max-width:760px){.side{display:none}.voiceSlots{grid-template-columns:repeat(5,90px);overflow-x:auto}.header .title{font-size:17px}.headerActions .iconBtn{padding:7px}.dmLayout{grid-template-columns:1fr}.dmList{max-height:120px;display:flex;overflow-x:auto;gap:5px}.dmUser{min-width:110px}.roomsBar{padding:6px}}
</style>
</head>
<body>

<div id="loginPage">
  <div class="loginBox">
    <div class="logo">كرار جاسم</div>
    <div class="description">دردشة عراقية متعددة الغرف والمجتمع<br>تواصل، نشر، صور، فيديو، ورسائل خاصة</div>
    <div class="tabs">
      <button class="tab active" data-tab="visitor">زائر</button>
      <button class="tab" data-tab="login">دخول</button>
      <button class="tab" data-tab="signup">عضوية</button>
    </div>
    <div id="visitorForm" class="form active">
      <input id="visitorName" placeholder="اسم الزائر" maxlength="30">
      <button id="visitorButton" class="btn primary">دخول كزائر</button>
    </div>
    <div id="loginForm" class="form">
      <input id="emailInput" type="email" placeholder="البريد الإلكتروني">
      <input id="passwordInput" type="password" placeholder="كلمة المرور">
      <button id="loginButton" class="btn primary">تسجيل الدخول</button>
    </div>
    <div id="signupForm" class="form">
      <input id="nameInput" placeholder="اسم العضو" maxlength="30">
      <input id="signupEmail" type="email" placeholder="البريد الإلكتروني">
      <input id="signupPassword" type="password" placeholder="كلمة المرور - 6 أحرف على الأقل">
      <button id="signupButton" class="btn primary">إنشاء العضوية</button>
    </div>
    <div id="authMessage"></div>
    <div class="status">● Firebase متصل</div>
  </div>
</div>

<div id="chatApp" class="hidden">
  <header class="header">
    <div class="headerUser">
      <img id="headerAvatar" class="headerAvatar" src="https://ui-avatars.com/api/?name=K&background=1687ff&color=fff">
      <div><div class="title">كرار جاسم</div><div id="currentUsername" class="username">عضو</div></div>
    </div>
    <div class="headerActions">
      <button id="profileBtn" class="iconBtn">👤 حسابي</button>
      <button id="dmBtn" class="iconBtn">💬 خاص</button>
      <button id="adminBtn" class="iconBtn adminBtn hidden">🛡️ إشراف</button>
      <button id="logoutButton" class="iconBtn logout">خروج</button>
    </div>
  </header>

  <section class="voicePanel">
    <div class="voiceTitle">🎙️ البث الصوتي — 5 مايكات</div>
    <div id="voiceSlots" class="voiceSlots"></div>
  </section>

  <nav id="roomsBar" class="roomsBar"></nav>

  <main class="content">
    <section id="feed" class="feed"><div class="empty">جاري تحميل المحادثة...</div></section>
    <aside class="side">
      <div class="sideTitle">👥 الموجودون الآن</div>
      <div id="onlineCount" class="onlineCount">0 متصل</div>
      <div id="membersList"></div>
    </aside>
  </main>

  <div id="replyBar" class="replyBar"><span id="replyText"></span><button class="cancelReply" id="cancelReply">إلغاء الرد ×</button></div>
  <div class="composer">
    <input id="messageInput" placeholder="اكتب رسالة في الغرفة..." maxlength="2000">
    <button id="sendButton" class="send">➤</button>
  </div>
</div>

<!-- profile -->
<div id="profileModal" class="modal"><div class="box profileBox">
  <div class="boxHead"><div class="boxTitle">👤 حسابي</div><button class="close" data-close="profileModal">×</button></div>
  <img id="profilePreview" class="profilePreview">
  <label>الاسم</label><input id="profileName" maxlength="30">
  <label>الصورة</label><input id="profilePhoto" type="file" accept="image/*">
  <button id="saveProfile" class="btn primary">حفظ التغييرات</button>
  <div id="profileStatus"></div>
</div></div>

<!-- DM -->
<div id="dmModal" class="modal"><div class="box">
  <div class="boxHead"><div class="boxTitle">💬 المحادثة الخاصة</div><button class="close" data-close="dmModal">×</button></div>
  <div class="dmLayout">
    <div id="dmList" class="dmList"><div class="empty">اختر عضوًا</div></div>
    <div class="dmChat">
      <div id="dmMessages" class="dmMessages"><div class="empty">اختر عضوًا لبدء المحادثة</div></div>
      <div class="dmComposer"><input id="dmInput" placeholder="رسالة خاصة..."><button id="dmSend">إرسال</button></div>
    </div>
  </div>
</div></div>

<!-- admin -->
<div id="adminModal" class="modal"><div class="box">
  <div class="boxHead"><div class="boxTitle">🛡️ لوحة الإشراف</div><button class="close" data-close="adminModal">×</button></div>
  <button id="deleteAllBtn" class="btn danger">🗑️ حذف جميع الرسائل والمنشورات</button>
  <div id="adminStatus" style="text-align:center;color:#9fb0c2;margin:8px"></div>
  <div class="adminList" id="adminList"></div>
</div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import {
  getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,
  signInAnonymously,updateProfile,onAuthStateChanged,signOut
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import {
  getFirestore,collection,addDoc,query,orderBy,onSnapshot,serverTimestamp,
  doc,setDoc,getDoc,deleteDoc,updateDoc,where,limit,getDocs,writeBatch
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
import {
  getStorage,ref,uploadBytes,getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-storage.js";

const firebaseConfig={
 apiKey:"AIzaSyAuFZxL_pmEm7weqkMQVGRME8VHeVs4fDU",
 authDomain:"dardashti-chat.firebaseapp.com",
 projectId:"dardashti-chat",
 storageBucket:"dardashti-chat.firebasestorage.app",
 messagingSenderId:"779042757468",
 appId:"1:779042757468:web:7646d3cdadf46f315a3f99"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),storage=getStorage(app);
const ADMIN_UID="N6KoWvu1IxbgWtVE46fmCsydZbF3";
const rooms=["بغداد","البصرة","نينوى","الأنبار","ديالى","كركوك","صلاح الدين","واسط","بابل","كربلاء","النجف","القادسية","المثنى","ذي قار","ميسان","أربيل","السليمانية","دهوك"];

let currentRoom=rooms[0],unsubscribePosts=null,unsubscribeMembers=null,unsubscribeDM=null;
let currentUser=null,currentProfile={name:"عضو",photo:""},replyTo=null,selectedDM=null;
const peerConnections=new Map(),remoteAudio=new Map();
let currentStream=null,mySlot=null;

const $=id=>document.getElementById(id);
const avatarFor=(name,photo)=>photo||`https://ui-avatars.com/api/?name=${encodeURIComponent(name||"عضو")}&background=1687ff&color=fff`;

function msg(t){$("authMessage").textContent=t}
function isAdmin(){return currentUser?.uid===ADMIN_UID}

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 document.querySelectorAll(".form").forEach(x=>x.classList.remove("active"));
 b.classList.add("active"); $(b.dataset.tab+"Form").classList.add("active"); msg("");
});

async function ensureProfile(u,nameFallback){
 const r=doc(db,"users",u.uid),s=await getDoc(r);
 if(!s.exists()){
   await setDoc(r,{uid:u.uid,name:nameFallback||u.displayName||"عضو",email:u.email||"",photo:"",role:"user",banned:false,createdAt:serverTimestamp()},{merge:true});
 }
 const s2=await getDoc(r); currentProfile=s2.exists()?s2.data():{name:nameFallback||"عضو",photo:""};
}

$("visitorButton").onclick=async()=>{
 const n=$("visitorName").value.trim(); if(n.length<2)return msg("اكتب اسمًا من حرفين على الأقل");
 try{await signInAnonymously(auth);localStorage.setItem("visitorName",n)}catch(e){msg("❌ "+e.message)}
};
$("loginButton").onclick=async()=>{
 try{await signInWithEmailAndPassword(auth,$("emailInput").value.trim(),$("passwordInput").value)}catch(e){msg("❌ "+e.message)}
};
$("signupButton").onclick=async()=>{
 const n=$("nameInput").value.trim(),em=$("signupEmail").value.trim(),pw=$("signupPassword").value;
 if(n.length<2||!em||pw.length<6)return msg("تأكد من الاسم والبريد وكلمة المرور");
 try{
  const r=await createUserWithEmailAndPassword(auth,em,pw);
  await updateProfile(r.user,{displayName:n});
  await setDoc(doc(db,"users",r.user.uid),{uid:r.user.uid,name:n,email:em,photo:"",role:"user",banned:false,createdAt:serverTimestamp()},{merge:true});
  await setDoc(doc(db,"moderation",r.user.uid),{banned:false,micMuted:false,updatedAt:serverTimestamp()},{merge:true});
 }catch(e){msg("❌ "+e.message)}
};

function renderRooms(){
 $("roomsBar").innerHTML="";
 rooms.forEach(r=>{const b=document.createElement("button");b.className="roomBtn"+(r===currentRoom?" active":"");b.textContent="📍 "+r;b.onclick=()=>{currentRoom=r;renderRooms();loadPosts()};$("roomsBar").appendChild(b)});
}

function showApp(){
 $("loginPage").classList.add("hidden");$("chatApp").classList.remove("hidden");
 $("currentUsername").textContent=currentProfile.name+(currentUser?.isAnonymous?" (زائر)":"");
 $("headerAvatar").src=avatarFor(currentProfile.name,currentProfile.photo);
 $("adminBtn").classList.toggle("hidden",!isAdmin());
 renderRooms();renderVoice();loadPosts();loadMembers();
}

onAuthStateChanged(auth,async u=>{
 if(!u){$("loginPage").classList.remove("hidden");$("chatApp").classList.add("hidden");return}
 currentUser=u;
 const visitor=localStorage.getItem("visitorName")||"زائر";
 try{
  await ensureProfile(u,u.isAnonymous?visitor:u.displayName||"عضو");
  const m=await getDoc(doc(db,"moderation",u.uid));
  if(m.exists()&&m.data().banned){await signOut(auth);msg("🚫 الحساب محظور");return}
  showApp();
 }catch(e){msg("❌ تعذر تحميل الحساب: "+e.message)}
});
$("logoutButton").onclick=async()=>{await leaveCurrentMic();localStorage.removeItem("visitorName");await signOut(auth)};

function loadPosts(){
 if(unsubscribePosts)unsubscribePosts();
 const q=query(collection(db,"messages"),where("room","==",currentRoom),orderBy("createdAt","asc"),limit(200));
 unsubscribePosts=onSnapshot(q,snap=>{
  const feed=$("feed"); feed.innerHTML="";
  if(snap.empty){feed.innerHTML='<div class="empty">لا توجد رسائل في هذه الغرفة بعد.</div>';return}
  snap.forEach(d=>renderChatMessage(d.id,d.data()));
  feed.scrollTop=feed.scrollHeight;
 },e=>{$("feed").innerHTML='<div class="empty">❌ تعذر تحميل المحادثة: '+escapeHtml(e.message)+'</div>';console.error(e)});
}
function renderChatMessage(id,p){
 const el=document.createElement("article");el.className="post";
 const date=p.createdAt?.toDate?p.createdAt.toDate().toLocaleString("ar-IQ"):"الآن";
 el.innerHTML=`<div class="postHead"><img src="${avatarFor(p.name,p.photo)}"><div class="postMeta"><div class="postName">${escapeHtml(p.name||"عضو")}</div><div class="postRoom">📍 ${escapeHtml(p.room||currentRoom)} · ${date}</div></div></div><div class="postText">${escapeHtml(p.text||"")}</div>${p.replyTo?`<div class="roomIntro" style="margin:5px 0">↩️ رد على: <b>${escapeHtml(p.replyTo)}</b></div>`:""}<div class="postActions">${isAdmin()?'<button data-delete class="danger">🗑️ حذف</button>':""}</div>`;
 el.querySelector("[data-delete]")?.addEventListener("click",async()=>{if(confirm("حذف الرسالة؟")){try{await deleteDoc(doc(db,"messages",id))}catch(e){alert("تعذر حذف الرسالة: "+e.message)}}});
 $("feed").appendChild(el);
}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
$("sendButton").onclick=sendChat;
$("messageInput").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();sendChat()}};
$("cancelReply").onclick=()=>{replyTo=null;$("replyBar").classList.remove("show")};
async function sendChat(){
 const text=$("messageInput").value.trim();if(!text||!currentUser)return;
 try{
  const mod=await getDoc(doc(db,"moderation",currentUser.uid));
  if(mod.exists()&&mod.data().banned){alert("🚫 الحساب محظور");return}
  await addDoc(collection(db,"messages"),{room:currentRoom,name:currentProfile.name,photo:currentProfile.photo,text,uid:currentUser.uid,replyTo:replyTo?replyTo.name:"",createdAt:serverTimestamp()});
  $("messageInput").value="";replyTo=null;$("replyBar").classList.remove("show");
 }catch(e){alert("تعذر الإرسال: "+e.message)}
}

async function loadMembers(){
 if(unsubscribeMembers)unsubscribeMembers();
 const q=query(collection(db,"users"),limit(100));
 unsubscribeMembers=onSnapshot(q,s=>{
  $("onlineCount").textContent=s.size+" عضو";
  $("membersList").innerHTML="";
  s.forEach(x=>{const d=x.data(),m=document.createElement("div");m.className="member";m.innerHTML=`<img src="${avatarFor(d.name,d.photo)}"><span class="memberName">${escapeHtml(d.name||"عضو")}</span><span class="dot"></span>`;m.onclick=()=>openDMWith(d);$("membersList").appendChild(m)})
 });
}

/* profile */

/* 5 microphones - WebRTC */
const voiceIds=["voice1","voice2","voice3","voice4","voice5"];
let voiceUnsubscribe=null;
const peerConnections=new Map();
const candidateUnsubscribers=new Map();
const remoteAudioEls=new Map();

function renderVoice(){
  $("voiceSlots").innerHTML="";
  voiceIds.forEach((id)=>{
    const d=document.createElement("div");
    d.className="voiceSlot";
    d.id=id;
    d.innerHTML=`<div class="micIcon">🎙️</div>
      <div class="voiceName" id="${id}Name">شاغر</div>
      <div class="voiceStatus" id="${id}Status">اضغط للتحدث</div>
      <button id="${id}Btn">تشغيل</button>`;
    d.querySelector("button").onclick=()=>toggleMic(id);
    $("voiceSlots").appendChild(d);
  });
  watchVoice();
}

function voicePeerCollection(slotId){
  return collection(db,"voiceCalls",slotId,"peers");
}

function cleanupPeer(peerKey){
  const pc=peerConnections.get(peerKey);
  if(pc){
    try{pc.onicecandidate=null;pc.ontrack=null;pc.close()}catch(e){}
    peerConnections.delete(peerKey);
  }
  const unsubs=candidateUnsubscribers.get(peerKey)||[];
  unsubs.forEach(fn=>{try{fn()}catch(e){}});
  candidateUnsubscribers.delete(peerKey);
}

async function addRemoteCandidate(pc,candidate){
  try{
    if(candidate) await pc.addIceCandidate(candidate);
  }catch(e){console.warn("ICE candidate",e)}
}

function makePeerConnection(slotId,peerUid,role){
  const key=slotId+"_"+peerUid+"_"+role;
  const pc=new RTCPeerConnection({
    iceServers:[
      {urls:"stun:stun.l.google.com:19302"},
      {urls:"stun:stun1.l.google.com:19302"}
    ]
  });
  peerConnections.set(key,pc);
  return {pc,key};
}

async function publishToListeners(slotId){
  if(!currentStream)return;

  const peersSnap=await getDocs(voicePeerCollection(slotId));
  for(const peerDoc of peersSnap.docs){
    const peerUid=peerDoc.id;
    if(peerUid===currentUser.uid)continue;

    const {pc,key}=makePeerConnection(slotId,peerUid,"caller");
    currentStream.getTracks().forEach(track=>pc.addTrack(track,currentStream));

    const callerCandidates=collection(db,"voiceCalls",slotId,"peers",peerUid,"callerCandidates");
    const calleeCandidates=collection(db,"voiceCalls",slotId,"peers",peerUid,"calleeCandidates");

    pc.onicecandidate=async e=>{
      if(e.candidate){
        await addDoc(callerCandidates,{
          candidate:e.candidate.toJSON(),
          from:currentUser.uid,
          createdAt:serverTimestamp()
        });
      }
    };

    const unsubCallee=onSnapshot(calleeCandidates,snap=>{
      snap.docChanges().forEach(ch=>{
        if(ch.type==="added") addRemoteCandidate(pc,ch.doc.data().candidate);
      });
    });
    candidateUnsubscribers.set(key,[unsubCallee]);

    const offer=await pc.createOffer();
    await pc.setLocalDescription(offer);

    await setDoc(
      doc(db,"voiceCalls",slotId,"peers",peerUid),
      {offer:{type:offer.type,sdp:offer.sdp},caller:currentUser.uid,updatedAt:serverTimestamp()},
      {merge:true}
    );
  }
}

async function listenToSpeaker(slotId,speakerUid,offerData){
  const peerKey=slotId+"_"+speakerUid+"_"+currentUser.uid;
  if(peerConnections.has(peerKey))return;

  const {pc,key}=makePeerConnection(slotId,currentUser.uid,"callee");

  pc.ontrack=e=>{
    const stream=e.streams?.[0];
    if(!stream)return;
    let audio=remoteAudioEls.get(peerKey);
    if(!audio){
      audio=document.createElement("audio");
      audio.autoplay=true;
      audio.playsInline=true;
      audio.controls=false;
      audio.volume=1;
      audio.style.display="none";
      document.body.appendChild(audio);
      remoteAudioEls.set(peerKey,audio);
    }
    audio.srcObject=stream;
    audio.play().catch(()=>{});
  };

  const callerCandidates=collection(db,"voiceCalls",slotId,"peers",currentUser.uid,"callerCandidates");
  const calleeCandidates=collection(db,"voiceCalls",slotId,"peers",currentUser.uid,"calleeCandidates");

  pc.onicecandidate=async e=>{
    if(e.candidate){
      await addDoc(calleeCandidates,{
        candidate:e.candidate.toJSON(),
        from:currentUser.uid,
        createdAt:serverTimestamp()
      });
    }
  };

  const unsubCaller=onSnapshot(callerCandidates,snap=>{
    snap.docChanges().forEach(ch=>{
      if(ch.type==="added") addRemoteCandidate(pc,ch.doc.data().candidate);
    });
  });
  candidateUnsubscribers.set(key,[unsubCaller]);

  await pc.setRemoteDescription(new RTCSessionDescription(offerData));
  const answer=await pc.createAnswer();
  await pc.setLocalDescription(answer);

  await setDoc(
    doc(db,"voiceCalls",slotId,"peers",currentUser.uid),
    {answer:{type:answer.type,sdp:answer.sdp},callee:currentUser.uid,updatedAt:serverTimestamp()},
    {merge:true}
  );
}

function stopAllListeningForSlot(slotId){
  for(const [key,pc] of peerConnections.entries()){
    if(key.startsWith(slotId+"_")){
      cleanupPeer(key);
      const audio=remoteAudioEls.get(key);
      if(audio){
        try{audio.pause();audio.srcObject=null;audio.remove()}catch(e){}
        remoteAudioEls.delete(key);
      }
    }
  }
}

function watchVoice(){
  if(voiceUnsubscribe)voiceUnsubscribe();

  voiceUnsubscribe=onSnapshot(collection(db,"voiceSlots"),snap=>{
    const map={};
    snap.forEach(x=>map[x.id]=x.data());

    voiceIds.forEach(id=>{
      const d=map[id],el=$(id);
      if(!el)return;
      const b=$(id+"Btn"),n=$(id+"Name"),st=$(id+"Status");

      if(!d){
        el.classList.remove("active");
        n.textContent="شاغر";
        st.textContent="اضغط للتحدث";
        b.textContent="تشغيل";
        b.disabled=false;
        stopAllListeningForSlot(id);
        return;
      }

      el.classList.add("active");
      n.textContent=d.name||"عضو";
      const mine=d.uid===currentUser?.uid;

      if(mine){
        st.textContent="🎙️ أنت تتحدث";
        b.textContent="إيقاف";
        b.disabled=false;
        publishToListeners(id).catch(e=>console.error("publish",e));
      }else{
        st.textContent="🔊 مباشر";
        b.textContent="استماع";
        b.disabled=false;

        // Clicking "استماع" is handled by the button below.
        b.onclick=()=>startListening(id,d.uid);
      }
    });
  },e=>{
    console.error("voiceSlots",e);
    voiceIds.forEach(id=>{
      const st=$(id+"Status");
      if(st)st.textContent="❌ "+e.message;
    });
  });
}

async function startListening(slotId,speakerUid){
  if(!currentUser)return;
  if(speakerUid===currentUser.uid)return;

  try{
    const peerRef=doc(db,"voiceCalls",slotId,"peers",currentUser.uid);
    const peerSnap=await getDoc(peerRef);

    if(!peerSnap.exists() || !peerSnap.data().offer){
      alert("البث لم يجهز بعد، حاول مرة أخرى.");
      return;
    }

    await listenToSpeaker(slotId,speakerUid,peerSnap.data().offer);

    const st=$(slotId+"Status");
    if(st)st.textContent="🔊 جاري الاستماع";
  }catch(e){
    console.error("listen",e);
    alert("❌ تعذر تشغيل الاستماع: "+e.message);
  }
}

async function toggleMic(slotId){
  if(!currentUser||currentUser.isAnonymous){
    alert("سجل دخول بعضوية لاستخدام المايك");
    return;
  }

  if(mySlot===slotId){
    await leaveCurrentMic();
    return;
  }

  if(mySlot){
    alert("أوقف المايك الحالي أولًا");
    return;
  }

  try{
    const mod=await getDoc(doc(db,"moderation",currentUser.uid));
    if(mod.exists() && (mod.data().banned===true || mod.data().micMuted===true)){
      alert(mod.data().banned===true?"🚫 الحساب محظور":"🎤 تم منعك من استخدام المايك");
      return;
    }

    if(!navigator.mediaDevices?.getUserMedia){
      throw new Error("المتصفح لا يدعم الميكروفون أو الصفحة ليست HTTPS");
    }

    const slotSnap=await getDoc(doc(db,"voiceSlots",slotId));
    if(slotSnap.exists()){
      alert("المايك مشغول");
      return;
    }

    currentStream=await navigator.mediaDevices.getUserMedia({
      audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},
      video:false
    });

    mySlot=slotId;

    await setDoc(doc(db,"voiceSlots",slotId),{
      uid:currentUser.uid,
      name:currentProfile.name,
      createdAt:serverTimestamp()
    });

    // Create a peer placeholder for listeners to read/write signaling.
    await setDoc(
      doc(db,"voiceCalls",slotId,"peers",currentUser.uid),
      {speaker:currentUser.uid,createdAt:serverTimestamp()},
      {merge:true}
    );

  }catch(e){
    currentStream?.getTracks().forEach(t=>t.stop());
    currentStream=null;
    mySlot=null;
    console.error("toggleMic",e);
    alert("❌ تعذر تشغيل المايك: "+e.message);
  }
}

async function leaveCurrentMic(){
  if(!mySlot)return;
  const slot=mySlot;

  try{
    await deleteDoc(doc(db,"voiceSlots",slot));
  }catch(e){
    console.warn("delete voice slot",e);
  }

  try{
    await deleteDoc(doc(db,"voiceCalls",slot,"peers",currentUser.uid));
  }catch(e){}

  stopAllListeningForSlot(slot);
  for(const [key] of peerConnections.entries()){
    if(key.startsWith(slot+"_"))cleanupPeer(key);
  }

  currentStream?.getTracks().forEach(t=>t.stop());
  currentStream=null;
  mySlot=null;
}

document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>{if(e.target===m)m.classList.remove("show")}));
