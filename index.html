<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>🔥 طليان الشعلة</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:Arial,Tahoma,sans-serif;
  background:#080b10;
  color:#fff;
}

body{
  background:
    linear-gradient(#000b,#000b),
    url("./background.jpeg") center/cover fixed no-repeat;
}

button,input{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   LOGIN
========================= */

#loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.loginBox{
  width:100%;
  max-width:430px;
  background:#101722ee;
  padding:25px;
  border-radius:20px;
  border:1px solid #ffffff25;
  box-shadow:0 20px 60px #000b;
  backdrop-filter:blur(8px);
}

.logo{
  text-align:center;
  font-size:30px;
  font-weight:bold;
  margin-bottom:8px;
}

.description{
  text-align:center;
  color:#c0cad6;
  margin-bottom:20px;
  line-height:1.7;
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:6px;
  margin-bottom:12px;
}

.tab{
  border:1px solid #344255;
  background:#18222e;
  color:#cbd5e1;
  padding:11px 5px;
  border-radius:9px;
  font-weight:bold;
}

.tab.active{
  background:#1687ff;
  color:#fff;
}

.form{
  display:none;
}

.form.active{
  display:block;
}

.loginBox input,
.composer input{
  width:100%;
  padding:14px;
  margin:6px 0;
  border:1px solid #344255;
  border-radius:10px;
  background:#0d131b;
  color:#fff;
  outline:none;
}

.loginBox input:focus,
.composer input:focus{
  border-color:#1687ff;
}

.btn{
  width:100%;
  padding:14px;
  margin-top:8px;
  border:0;
  border-radius:10px;
  font-weight:bold;
  color:#fff;
}

.primary{
  background:#1687ff;
}

.secondary{
  background:#283444;
}

#authMessage{
  text-align:center;
  min-height:24px;
  margin-top:12px;
  color:#ffb6b6;
  word-break:break-word;
}

.status{
  text-align:center;
  color:#8ee0b1;
  font-size:12px;
  margin-top:8px;
}

/* =========================
   CHAT
========================= */

#chatApp{
  height:100vh;
  display:flex;
  flex-direction:column;
}

.header{
  min-height:64px;
  background:#101722ee;
  border-bottom:1px solid #293646;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  backdrop-filter:blur(8px);
}

.title{
  font-size:20px;
  font-weight:bold;
}

.username{
  font-size:12px;
  color:#6ee7a0;
  margin-top:3px;
}

.logout{
  border:0;
  background:#a92d38;
  color:#fff;
  padding:9px 12px;
  border-radius:9px;
}

/* =========================
   NAVIGATION
========================= */

.mainNav{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  padding:8px;
  background:#101720;
  border-bottom:1px solid #293646;
}

.navBtn{
  border:1px solid #344255;
  background:#18222e;
  color:#dce7f5;
  padding:10px;
  border-radius:9px;
  font-weight:bold;
}

.navBtn.active{
  background:#1687ff;
  border-color:#1687ff;
}

/* =========================
   CHAT AREA
========================= */

.chatSection{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:14px;
  background:#0004;
  -webkit-overflow-scrolling:touch;
}

.message{
  display:flex;
  gap:9px;
  margin-bottom:13px;
  align-items:flex-start;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#293646;
  flex:none;
}

.messageContent{
  background:#18222eea;
  border-radius:13px;
  padding:8px 11px;
  max-width:80%;
}

.messageName{
  color:#61a8ff;
  font-size:12px;
  font-weight:bold;
  margin-bottom:3px;
}

.messageText{
  line-height:1.5;
  word-break:break-word;
}

.composer{
  display:flex;
  gap:7px;
  padding:9px;
  background:#151d28ee;
  border-top:1px solid #293646;
}

.composer input{
  flex:1;
  min-width:0;
  margin:0;
}

.send{
  width:50px;
  border:0;
  border-radius:10px;
  background:#1687ff;
  color:#fff;
  font-size:18px;
}

.send:disabled{
  opacity:.5;
}

.empty{
  text-align:center;
  color:#7e8a99;
  padding:35px 10px;
}

/* =========================
   GAME
========================= */

.gameSection{
  flex:1;
  overflow-y:auto;
  padding:18px;
  background:#0005;
}

.gameBox{
  max-width:450px;
  margin:0 auto;
  background:#101722ee;
  border:1px solid #293646;
  border-radius:18px;
  padding:18px;
  text-align:center;
}

.gameTitle{
  font-size:25px;
  font-weight:bold;
  margin-bottom:5px;
}

.gameSub{
  color:#aebaca;
  font-size:13px;
  margin-bottom:15px;
}

.gameStatus{
  background:#18222e;
  border:1px solid #344255;
  border-radius:10px;
  padding:10px;
  margin-bottom:15px;
}

.board{
  width:min(90vw,330px);
  aspect-ratio:1/1;
  margin:0 auto 15px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.cell{
  border:1px solid #344255;
  background:#18222e;
  border-radius:13px;
  color:#fff;
  font-size:45px;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:0;
}

.cell:disabled{
  cursor:not-allowed;
  opacity:.9;
}

.cell.x{
  color:#1687ff;
}

.cell.o{
  color:#ff6070;
}

.gameButtons{
  display:flex;
  gap:8px;
}

.gameButtons button{
  flex:1;
  border:0;
  border-radius:10px;
  padding:12px;
  color:#fff;
  font-weight:bold;
}

.newGame{
  background:#1687ff;
}

.easy{
  background:#283444;
}

/* =========================
   VOICE
========================= */

.voicePanel{
  background:#101720dd;
  border-bottom:1px solid #293646;
  padding:10px;
}

.voiceTitle{
  text-align:center;
  font-weight:bold;
  margin-bottom:8px;
  color:#dce7f5;
}

.voiceSlots{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.voiceSlot{
  min-height:90px;
  background:#18222ecc;
  border:1px solid #344255;
  border-radius:13px;
  padding:9px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:5px;
}

.voiceSlot.active{
  border-color:#24c77a;
}

.voiceSlot button{
  border:0;
  border-radius:9px;
  padding:8px 12px;
  background:#1687ff;
  color:#fff;
  font-weight:bold;
}

.voiceSlot.active button{
  background:#b52d39;
}

.voiceName{
  font-size:13px;
  color:#aebaca;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.voiceStatus{
  font-size:11px;
  color:#7e8a99;
  text-align:center;
}

/* =========================
   AUDIO
========================= */

#audioContainer{
  position:fixed;
  width:1px;
  height:1px;
  left:-100px;
  top:-100px;
  overflow:hidden;
}

#audioContainer audio{
  width:1px;
  height:1px;
}

#enableAudioButton{
  position:fixed;
  left:10px;
  right:10px;
  bottom:75px;
  z-index:99999;
  display:none;
  border:0;
  border-radius:12px;
  padding:13px;
  background:#1687ff;
  color:#fff;
  font-weight:bold;
  box-shadow:0 8px 30px #0008;
}

@media(max-width:420px){

  .voiceSlot button{
    padding:7px 9px;
    font-size:12px;
  }

  .messageContent{
    max-width:82%;
  }

  .cell{
    font-size:38px;
  }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="loginPage">

  <div class="loginBox">

    <div class="logo">
      🔥 طليان الشعلة
    </div>

    <div class="description">
      أهلاً بك في الدردشة<br>
      اختر طريقة الدخول للمتابعة
    </div>

    <div class="tabs">

      <button class="tab active" data-tab="visitor">
        دخول الزوار
      </button>

      <button class="tab" data-tab="login">
        دخول الأعضاء
      </button>

      <button class="tab" data-tab="signup">
        تسجيل عضوية
      </button>

    </div>

    <!-- VISITOR -->

    <div id="visitorForm" class="form active">

      <input
        id="visitorName"
        type="text"
        maxlength="30"
        placeholder="أكتب الاسم المستعار">

      <button id="visitorButton" class="btn primary">
        دخول
      </button>

    </div>

    <!-- LOGIN -->

    <div id="loginForm" class="form">

      <input
        id="emailInput"
        type="email"
        placeholder="البريد الإلكتروني">

      <input
        id="passwordInput"
        type="password"
        placeholder="كلمة المرور">

      <button id="loginButton" class="btn primary">
        دخول
      </button>

    </div>

    <!-- SIGNUP -->

    <div id="signupForm" class="form">

      <input
        id="nameInput"
        type="text"
        maxlength="30"
        placeholder="اسم العضو">

      <input
        id="signupEmail"
        type="email"
        placeholder="البريد الإلكتروني">

      <input
        id="signupPassword"
        type="password"
        placeholder="كلمة المرور">

      <button id="signupButton" class="btn primary">
        إنشاء حساب
      </button>

    </div>

    <div id="authMessage"></div>

    <div class="status">
      ● متصل
    </div>

  </div>

</div>


<!-- =========================
     CHAT APP
========================= -->

<div id="chatApp" class="hidden">

  <div class="header">

    <div>

      <div class="title">
        🔥 طليان الشعلة
      </div>

      <div id="currentUsername" class="username">
        عضو
      </div>

    </div>

    <button id="logoutButton" class="logout">
      خروج
    </button>

  </div>


  <!-- NAV -->

  <div class="mainNav">

    <button id="chatNav" class="navBtn active">
      💬 الدردشة
    </button>

    <button id="gameNav" class="navBtn">
      🎮 لعبة XO
    </button>

  </div>


  <!-- CHAT SECTION -->

  <div id="chatSection" class="chatSection">

    <div class="voicePanel">

      <div class="voiceTitle">
        🎤 المايكات العامة
      </div>

      <div class="voiceSlots">

        <div id="voiceSlot1" class="voiceSlot">

          <div>🎤 المايك 1</div>

          <div id="voiceName1" class="voiceName">
            شاغر
          </div>

          <div id="voiceStatus1" class="voiceStatus">
            اضغط للتحدث
          </div>

          <button id="voiceButton1">
            تشغيل المايك
          </button>

        </div>


        <div id="voiceSlot2" class="voiceSlot">

          <div>🎤 المايك 2</div>

          <div id="voiceName2" class="voiceName">
            شاغر
          </div>

          <div id="voiceStatus2" class="voiceStatus">
            اضغط للتحدث
          </div>

          <button id="voiceButton2">
            تشغيل المايك
          </button>

        </div>

      </div>

    </div>


    <div id="messages" class="messages">

      <div class="empty">
        جاري تحميل الدردشة...
      </div>

    </div>


    <div class="composer">

      <input
        id="messageInput"
        type="text"
        maxlength="500"
        autocomplete="off"
        placeholder="اكتب رسالتك...">

      <button id="sendButton" class="send">
        ➤
      </button>

    </div>

  </div>


  <!-- GAME -->

  <div id="gameSection" class="gameSection hidden">

    <div class="gameBox">

      <div class="gameTitle">
        🎮 لعبة XO
      </div>

      <div class="gameSub">
        العب ضد الروبوت
      </div>

      <div id="gameStatus" class="gameStatus">
        دورك أنت — ❌
      </div>

      <div id="board" class="board">

        <button class="cell" data-index="0"></button>
        <button class="cell" data-index="1"></button>
        <button class="cell" data-index="2"></button>

        <button class="cell" data-index="3"></button>
        <button class="cell" data-index="4"></button>
        <button class="cell" data-index="5"></button>

        <button class="cell" data-index="6"></button>
        <button class="cell" data-index="7"></button>
        <button class="cell" data-index="8"></button>

      </div>

      <div class="gameButtons">

        <button id="newGameButton" class="newGame">
          لعبة جديدة
        </button>

        <button id="easyButton" class="easy">
          مستوى عادي
        </button>

      </div>

    </div>

  </div>

</div>


<div id="audioContainer"></div>

<button id="enableAudioButton">
  🔊 تفعيل الصوت
</button>


<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signInAnonymously,
  updateProfile,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp,
  doc,
  setDoc,
  deleteDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyAuFZxL_pmEm7weqkMQVGRME8VHeVs4fDU",

  authDomain:
    "dardashti-chat.firebaseapp.com",

  projectId:
    "dardashti-chat",

  storageBucket:
    "dardashti-chat.firebasestorage.app",

  messagingSenderId:
    "779042757468",

  appId:
    "1:779042757468:web:7646d3cdadf46f315a3f99"

};


/* =========================================================
   INITIALIZE
========================================================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================================================
   ELEMENTS
========================================================= */

const loginPage =
  document.getElementById("loginPage");

const chatApp =
  document.getElementById("chatApp");

const authMessage =
  document.getElementById("authMessage");

const messagesBox =
  document.getElementById("messages");

const messageInput =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");


/* =========================================================
   GLOBAL
========================================================= */

let stopMessages = null;

let stopSlots = null;

let mySlot = null;

let localStream = null;

let moderationCache = {};

let sendingMessage = false;


/* =========================================================
   TABS
========================================================= */

document.querySelectorAll(".tab").forEach(btn => {

  btn.onclick = () => {

    document
      .querySelectorAll(".tab")
      .forEach(x =>
        x.classList.remove("active")
      );

    document
      .querySelectorAll(".form")
      .forEach(x =>
        x.classList.remove("active")
      );

    btn.classList.add("active");

    document
      .getElementById(
        btn.dataset.tab + "Form"
      )
      .classList.add("active");

    authMessage.textContent = "";

  };

});


/* =========================================================
   VISITOR LOGIN
========================================================= */

async function enterVisitor(){

  const name =
    document
      .getElementById("visitorName")
      .value
      .trim();

  if(name.length < 2){

    authMessage.textContent =
      "⚠️ اكتب اسمًا صحيحًا";

    return;
  }

  authMessage.textContent =
    "جاري الدخول كزائر...";

  localStorage.setItem(
    "visitorName",
    name
  );

  try{

    if(!auth.currentUser){

      await signInAnonymously(auth);

    }

  }catch(e){

    console.error(e);

    authMessage.textContent =
      "❌ تعذر دخول الزائر: " +
      (e.code || e.message);

  }

}


document
  .getElementById("visitorButton")
  .onclick = enterVisitor;


document
  .getElementById("visitorName")
  .onkeydown = e => {

    if(e.key === "Enter")
      enterVisitor();

  };


/* =========================================================
   SIGN UP
========================================================= */

document
  .getElementById("signupButton")
  .onclick = async () => {

    const name =
      document
        .getElementById("nameInput")
        .value
        .trim();

    const email =
      document
        .getElementById("signupEmail")
        .value
        .trim();

    const password =
      document
        .getElementById("signupPassword")
        .value;


    if(name.length < 2){

      authMessage.textContent =
        "⚠️ اكتب اسم العضو";

      return;

    }


    if(!email){

      authMessage.textContent =
        "⚠️ اكتب البريد الإلكتروني";

      return;

    }


    if(password.length < 6){

      authMessage.textContent =
        "⚠️ كلمة المرور 6 أحرف على الأقل";

      return;

    }


    authMessage.textContent =
      "جاري إنشاء الحساب...";


    try{

      const r =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );


      await updateProfile(
        r.user,
        {
          displayName:name
        }
      );


      await setDoc(
        doc(
          db,
          "users",
          r.user.uid
        ),
        {
          uid:r.user.uid,
          name,
          email,
          role:"user",
          banned:false,
          createdAt:serverTimestamp()
        },
        {
          merge:true
        }
      );


      await setDoc(
        doc(
          db,
          "moderation",
          r.user.uid
        ),
        {
          banned:false,
          micMuted:false,
          updatedAt:serverTimestamp()
        },
        {
          merge:true
        }
      );


      moderationCache =
        {
          banned:false,
          micMuted:false
        };


      authMessage.textContent =
        "✅ تم إنشاء الحساب";


    }catch(e){

      console.error(e);

      authMessage.textContent =
        "❌ " +
        (e.code || e.message);

    }

  };


/* =========================================================
   LOGIN
========================================================= */

document
  .getElementById("loginButton")
  .onclick = async () => {

    const email =
      document
        .getElementById("emailInput")
        .value
        .trim();

    const password =
      document
        .getElementById("passwordInput")
        .value;


    if(!email || !password){

      authMessage.textContent =
        "⚠️ اكتب البريد وكلمة المرور";

      return;

    }


    authMessage.textContent =
      "جاري تسجيل الدخول...";


    try{

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    }catch(e){

      console.error(e);

      authMessage.textContent =
        "❌ " +
        (e.code || e.message);

    }

  };


/* =========================================================
   MODERATION
========================================================= */

async function getModeration(uid){

  if(moderationCache[uid]){
    return moderationCache[uid];
  }

  try{

    const s =
      await getDoc(
        doc(
          db,
          "moderation",
          uid
        )
      );


    const data =
      s.exists()
        ? s.data()
        : {};


    moderationCache[uid] = data;

    return data;

  }catch(e){

    console.error(e);

    return {};

  }

}


/* =========================================================
   SHOW CHAT
========================================================= */

function showChat(name){

  loginPage.classList.add("hidden");

  chatApp.classList.remove("hidden");

  document
    .getElementById("currentUsername")
    .textContent = name;

  loadMessages();

  watchSlots();

}


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
  auth,
  async user => {

    if(user){

      const mod =
        await getModeration(
          user.uid
        );


      if(mod.banned){

        await signOut(auth);

        authMessage.textContent =
          "🚫 حسابك محظور";

        return;

      }


      const visitorName =
        localStorage.getItem(
          "visitorName"
        );


      showChat(
        user.isAnonymous
          ? (visitorName || "زائر")
          : (user.displayName || "عضو")
      );


    }else{

      cleanupVoice();

      loginPage.classList.remove(
        "hidden"
      );

      chatApp.classList.add(
        "hidden"
      );


      if(stopMessages){

        stopMessages();

        stopMessages = null;

      }


      if(stopSlots){

        stopSlots();

        stopSlots = null;

      }

    }

  }
);


/* =========================================================
   LOGOUT
========================================================= */

document
  .getElementById("logoutButton")
  .onclick = async () => {

    try{

      cleanupVoice();

      localStorage.removeItem(
        "visitorName"
      );

      moderationCache = {};

      if(auth.currentUser){

        await signOut(auth);

      }

    }catch(e){

      console.error(e);

    }

  };


/* =========================================================
   SEND MESSAGE
   تحسين السرعة:
   لا يتم استدعاء Firestore moderation
   مع كل رسالة.
========================================================= */

async function sendMessage(){

  if(sendingMessage)
    return;


  const text =
    messageInput.value.trim();


  if(!text)
    return;


  const u =
    auth.currentUser;


  if(!u)
    return;


  const visitor =
    localStorage.getItem(
      "visitorName"
    );


  sendingMessage = true;

  sendButton.disabled = true;


  try{

    const mod =
      moderationCache[u.uid] || {};


    if(mod.banned){

      alert("🚫 حسابك محظور");

      return;

    }


    await addDoc(
      collection(
        db,
        "messages"
      ),
      {
        uid:u.uid,

        name:
          u.isAnonymous
            ? (visitor || "زائر")
            : (u.displayName || "عضو"),

        text:text,

        createdAt:
          serverTimestamp()

      }
    );


    messageInput.value = "";


  }catch(e){

    console.error(e);

    alert(
      "❌ تعذر إرسال الرسالة:\n" +
      (e.code || e.message)
    );


  }finally{

    sendingMessage = false;

    sendButton.disabled = false;

    messageInput.focus();

  }

}


sendButton.onclick =
  sendMessage;


messageInput.onkeydown =
  e => {

    if(e.key === "Enter"){

      e.preventDefault();

      sendMessage();

    }

  };


/* =========================================================
   LOAD MESSAGES
========================================================= */

function loadMessages(){

  if(stopMessages){

    stopMessages();

  }


  stopMessages =
    onSnapshot(

      query(
        collection(
          db,
          "messages"
        ),
        orderBy(
          "createdAt",
          "asc"
        )
      ),

      snap => {

        const fragment =
          document.createDocumentFragment();


        if(snap.empty){

          messagesBox.innerHTML =
            '<div class="empty">لا توجد رسائل بعد</div>';

          return;

        }


        snap.forEach(s => {

          const d =
            s.data();


          const row =
            document.createElement(
              "div"
            );

          row.className =
            "message";


          const avatar =
            document.createElement(
              "img"
            );

          avatar.className =
            "avatar";


          avatar.src =
            "https://ui-avatars.com/api/?name=" +
            encodeURIComponent(
              d.name || "عضو"
            ) +
            "&background=1687ff&color=fff";


          avatar.loading =
            "lazy";


          const content =
            document.createElement(
              "div"
            );

          content.className =
            "messageContent";


          const name =
            document.createElement(
              "div"
            );

          name.className =
            "messageName";

          name.textContent =
            d.name || "عضو";


          const text =
            document.createElement(
              "div"
            );

          text.className =
            "messageText";

          text.textContent =
            d.text || "";


          content.append(
            name,
            text
          );


          row.append(
            avatar,
            content
          );


          fragment.appendChild(
            row
          );

        });


        messagesBox.innerHTML =
          "";

        messagesBox.appendChild(
          fragment
        );


        messagesBox.scrollTop =
          messagesBox.scrollHeight;

      },

      e => {

        console.error(e);

        messagesBox.innerHTML =
          '<div class="empty">❌ تعذر تحميل الرسائل</div>';

      }

    );

}

const slots = [

  {
    id:"slot1",
    el:document.getElementById(
      "voiceSlot1"
    ),
    name:document.getElementById(
      "voiceName1"
    ),
    status:document.getElementById(
      "voiceStatus1"
    ),

      "voiceButton1"
    )
  },

  {
    id:"slot2",
    el:document.getElementById(
      "voiceSlot2"
    ),
    name:document.getElementById(
      "voiceName2"
    ),
    status:document.getElementById(
      "voiceStatus2"
    ),
    button:document.getElementById(
      "voiceButton2"
    )
  }

];


async function toggleMic(index){

  const u =
    auth.currentUser;


  if(!u){

    alert(
      "🎤 يجب تسجيل الدخول"
    );

    return;

  }


  if(u.isAnonymous){

    alert(
      "🎤 المايك متاح للأعضاء فقط"
    );

    return;

  }


  const slot =
    slots[index];


  const slotId =
    "slot" + (index + 1);


  const ref =
    doc(
      db,
      "voiceSlots",
      slotId
    );


  try{

    const snap =
      await getDoc(ref);


    if(
      snap.exists() &&
      snap.data().uid === u.uid
    ){

      await leaveMic(
        slotId
      );

      return;

    }


    if(snap.exists()){

      alert(
        "🎤 هذا المايك مستخدم حاليًا"
      );

      return;

    }


    if(mySlot){

      alert(
        "⚠️ لديك مايك مفتوح بالفعل"
      );

      return;

    }


    const mod =
      await getModeration(
        u.uid
      );


    if(mod.banned){

      alert(
        "🚫 حسابك محظور"
      );

      return;

    }


    if(mod.micMuted){

      alert(
        "🎤 تم منعك من استخدام المايك"
      );

      return;

    }


    localStream =
      await navigator.mediaDevices
        .getUserMedia({

          audio:{
            echoCancellation:true,
            noiseSuppression:true,
            autoGainControl:true
          },

          video:false

        });


    mySlot =
      slotId;


    await setDoc(
      ref,
      {
        uid:u.uid,
        name:
          u.displayName || "عضو",
        createdAt:
          serverTimestamp()
      }
    );


    slot.status.textContent =
      "🎤 أنت تتحدث";


    slot.button.textContent =
      "إيقاف المايك";


  }catch(e){

    console.error(e);


    if(localStream){

      localStream
        .getTracks()
        .forEach(
          t => t.stop()
        );

    }


    localStream = null;

    mySlot = null;


    alert(
      "❌ تعذر تشغيل المايك:\n" +
      (e.code ||
       e.message ||
       e.name)
    );

  }

}


slots.forEach(
  (s,i) => {

    s.button.onclick =
      () => toggleMic(i);

  }
);


async function leaveMic(slotId){

  try{

    await deleteDoc(
      doc(
        db,
        "voiceSlots",
        slotId
      )
    );

  }catch(e){

    console.error(e);

  }


  if(localStream){

    localStream
      .getTracks()
      .forEach(
        t => t.stop()
      );

  }


  localStream = null;

  if(mySlot === slotId)
    mySlot = null;

}


function watchSlots(){

  if(stopSlots){

    stopSlots();

  }


  stopSlots =
    onSnapshot(

      collection(
        db,
        "voiceSlots"
      ),

      snap => {

        const data = {};


        snap.forEach(
          x => {
            data[x.id] =
              x.data();
          }
        );


        slots.forEach(
          slot => {

            const d =
              data[slot.id];


            const mine =
              d &&
              auth.currentUser &&
              d.uid ===
              auth.currentUser.uid;


            if(!d){

              slot.el
                .classList
                .remove(
                  "active"
                );


              slot.name.textContent =
                "شاغر";


              slot.status.textContent =
                "اضغط للتحدث";


              slot.button.textContent =
                "تشغيل المايك";


              slot.button.disabled =
                false;


              return;

            }


            slot.el
              .classList
              .add(
                "active"
              );


            slot.name.textContent =
              d.name || "عضو";


            if(mine){

              slot.status.textContent =
                "🎤 أنت تتحدث";


              slot.button.textContent =
                "إيقاف المايك";


              slot.button.disabled =
                false;

            }else{

              slot.status.textContent =
                "🔊 البث مباشر";


              slot.button.textContent =
                "🔊 مباشر";


              slot.button.disabled =
                true;

            }

          }

        );

      },

      e => {

        console.error(
          "voiceSlots",
          e
        );

      }

    );

}


function cleanupVoice(){

  if(mySlot){

    leaveMic(
      mySlot
    ).catch(
      () => {}
    );

  }


  if(localStream){

    localStream
      .getTracks()
      .forEach(
        t => t.stop()
      );

  }


  localStream = null;

  mySlot = null;

}


/* =========================================================
   GAME XO
========================================================= */

const cells =
  [...document.querySelectorAll(".cell")];

const gameStatus =
  document.getElementById(
    "gameStatus"
  );

let board =
  ["","","","","","","","",""];

let gameOver =
  false;

let difficulty =
  "normal";


const wins = [

  [0,1,2],
  [3,4,5],
  [6,7,8],

  [0,3,6],
  [1,4,7],
  [2,5,8],

  [0,4,8],
  [2,4,6]

];


function checkWinner(b){

  for(
    const [a,c,d]
    of wins
  ){

    if(
      b[a] &&
      b[a] === b[c] &&
      b[a] === b[d]
    ){

      return b[a];

    }

  }


  if(
    b.every(
      x => x !== ""
    )
  ){

    return "draw";

  }


  return null;

}


function renderGame(){

  cells.forEach(
    (cell,i) => {

      cell.textContent =
        board[i];


      cell.classList.remove(
        "x",
        "o"
      );


      if(board[i] === "X")
        cell.classList.add("x");


      if(board[i] === "O")
        cell.classList.add("o");


      cell.disabled =
        !!board[i] ||
        gameOver;

    }
  );

}


function finishGame(){

  const result =
    checkWinner(board);


  if(result === "X"){

    gameOver = true;

    gameStatus.textContent =
      "🎉 فزت أنت!";

    renderGame();

    return true;

  }


  if(result === "O"){

    gameOver = true;

    gameStatus.textContent =
      "🤖 الروبوت فاز";

    renderGame();

    return true;

  }


  if(result === "draw"){

    gameOver = true;

    gameStatus.textContent =
      "🤝 تعادل";

    renderGame();

    return true;

  }


  return false;

}


function playerMove(index){

  if(
    gameOver ||
    board[index]
  )
    return;


  board[index] =
    "X";


  renderGame();


  if(finishGame())
    return;


  gameStatus.textContent =
    "🤖 الروبوت يفكر...";


  setTimeout(
    botMove,
    450
  );

}


function botMove(){

  if(gameOver)
    return;


  let index;


  if(
    difficulty === "easy"
  ){

    index =
      randomMove();

  }else{

    index =
      bestMove();

  }


  if(index !== -1){

    board[index] =
      "O";

  }


  renderGame();


  if(!finishGame()){

    gameStatus.textContent =
      "دورك أنت — ❌";

  }

}


function randomMove(){

  const empty =
    board
      .map(
        (v,i) =>
          v === ""
            ? i
            : -1
      )
      .filter(
        i => i !== -1
      );


  if(!empty.length)
    return -1;


  return empty[
    Math.floor(
      Math.random() *
      empty.length
    )
  ];

}


function bestMove(){

  let bestScore =
    -Infinity;

  let move =
    -1;


  for(
    let i=0;
    i<9;
    i++
  ){

    if(board[i] !== "")
      continue;


    board[i] =
      "O";


    const score =
      minimax(
        board,
        false
      );


    board[i] =
      "";


    if(score > bestScore){

      bestScore =
        score;

      move =
        i;

    }

  }


  return move;

}


function minimax(
  b,
  isMax
){

  const result =
    checkWinner(b);


  if(result === "O")
    return 10;


  if(result === "X")
    return -10;


  if(result === "draw")
    return 0;


  if(isMax){

    let best =
      -Infinity;


    for(
      let i=0;
      i<9;
      i++
    ){

      if(b[i] !== "")
        continue;


      b[i] =
        "O";


      best =
        Math.max(
          best,
          minimax(
            b,
            false
          )
        );


      b[i] =
        "";

    }


    return best;

  }else{

    let best =
      Infinity;


    for(
      let i=0;
      i<9;
      i++
    ){

      if(b[i] !== "")
        continue;


      b[i] =
        "X";


      best =
        Math.min(
          best,
          minimax(
            b,
            true
          )
        );


      b[i] =
        "";

    }


    return best;

  }

}


function newGame(){

  board =
    ["","","","","","","","",""];

  gameOver =
    false;

  gameStatus.textContent =
    "دورك أنت — ❌";

  renderGame();

}


cells.forEach(
  cell => {

    cell.onclick =
      () => {

        playerMove(
          Number(
            cell.dataset.index
          )
        );

      };

  }
);


document
  .getElementById(
    "newGameButton"
  )
  .onclick =
  newGame;


document
  .getElementById(
    "easyButton"
  )
  .onclick =
  () => {

    if(
      difficulty === "normal"
    ){

      difficulty = "easy";

      document
        .getElementById(
          "easyButton"
        )
        .textContent =
        "مستوى سهل";

    }else{

      difficulty = "normal";

      document
        .getElementById(
          "easyButton"
        )
        .textContent =
        "مستوى عادي";

    }

    newGame();

  };


renderGame();
