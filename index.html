<head>
<meta charset="UTF-8">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:#080b10;
  color:#fff;
}
button,input{font-family:inherit}
button{cursor:pointer}
.hidden{display:none!important}

#loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;

}

.loginBox{
  width:100%;

  background:#151d28;

.logo{
  text-align:center;
  font-size:29px;
  font-weight:bold;
  margin-bottom:8px
}

.description{

  color:#a4afbd;

.loginBox input{

.btn{

#authMessage{

#chatApp{

.header{

  align-items:center;

.title{font-size:20px;font-weight:bold}

.username{

.logout{

.voiceTitle{

.voiceSlots{

.voiceSlot{

.voiceName{

  text-overflow:ellipsis;
  white-space:nowrap
}

.voiceStatus{
  font-size:11px;
  color:#7e8a99;
  text-align:center
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:14px
}

.message{
  display:flex;
  gap:9px;
  margin-bottom:13px
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#293646
}

.messageContent{
  background:#18222e;
  border-radius:13px;
  padding:8px 11px;
  max-width:80%
}

.messageName{
  color:#61a8ff;
  font-size:12px;
  font-weight:bold;
  margin-bottom:3px
}

.messageText{
  line-height:1.5;
  word-break:break-word
}

.composer{
  display:flex;
  gap:7px;
  padding:9px;
  background:#151d28;
  border-top:1px solid #293646
}

.composer input{
  flex:1;
  min-width:0;
  padding:13px;
  border:1px solid #344255;
  border-radius:10px;
  background:#0d131b;
  color:#fff;
  outline:none
}

.send{
  width:50px;
  border:0;
  border-radius:10px;
  background:#1687ff;
  color:#fff;
  font-size:18px
}

.empty{
  text-align:center;
  color:#7e8a99;
  padding:35px 10px
}

#audioPanel{
  position:fixed;
  left:10px;
  right:10px;
  bottom:75px;
  z-index:99999;
  background:#151d28;
  border:1px solid #344255;
  border-radius:13px;
  padding:10px;
  text-align:center;
  box-shadow:0 8px 30px #0008
}

#audioPanel audio{
  width:100%;
  margin:7px 0
}

.audioButtons{

  gap:7px
}

.audioButtons button{
  flex:1;
  border:0;
  border-radius:8px;
  padding:10px;
  color:#fff;
  font-weight:bold
}

.playAudio{background:#1687ff}
.closeAudio{background:#a92d38}

@media(max-width:420px){
  .voiceSlot button{
    padding:7px 9px;
    font-size:12px
  }
}
</style>

/* =========================
   MODERATION
========================= */

async function getMyModeration(){

  const u = auth.currentUser;

  if(!u){
    return {
      banned:false,
      micMuted:false
    };
  }

  try{

    const s = await getDoc(
      doc(db,"moderation",u.uid)
    );

    if(!s.exists()){
      return {
        banned:false,
        micMuted:false
      };
    }

    const d = s.data();

    return {
      banned:d.banned === true,
      micMuted:d.micMuted === true
    };

  }catch(e){

    console.error("moderation",e);

    return {
      banned:false,
      micMuted:false
    };
  }
}

/* =========================

========================= */

const loginPage =

const chatApp =

let stopMessages = null;

/* =========================

========================= */

document.getElementById("signupButton").onclick =
async () => {

  const name =
    document.getElementById("nameInput").value.trim();

  const email =
    document.getElementById("emailInput").value.trim();

  const password =
    document.getElementById("passwordInput").value;

  if(name.length < 2){
    authMessage.textContent =
      "⚠️ اكتب اسم العضو";
    return;
  }

  if(!email){
    authMessage.textContent =
      "⚠️ اكتب البريد الإلكتروني";
    return;
  }

  if(password.length < 6){
    authMessage.textContent =
      "⚠️ كلمة المرور يجب أن تكون 6 أحرف على الأقل";
    return;
  }

  authMessage.textContent =
    "جاري إنشاء الحساب...";

  try{

    const r =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

    await updateProfile(
      r.user,
      {
        displayName:name
      }
    );

    await setDoc(
      doc(db,"users",r.user.uid),
      {
        uid:r.user.uid,
        name:name,
        email:email,
        role:"user",
        banned:false,
        micBanned:false,
        createdAt:serverTimestamp()
      },
      {
        merge:true
      }
    );

    await setDoc(
      doc(db,"moderation",r.user.uid),
      {
        banned:false,
        micMuted:false,
        updatedAt:serverTimestamp()
      },
      {
        merge:true
      }
    );

    authMessage.textContent =
      "✅ تم إنشاء الحساب بنجاح";

  }catch(e){

    console.error(e);

    authMessage.textContent =
      "❌ " + (e.code || e.message);

  }

};


/* =========================

document.getElementById("loginButton").onclick =

   AUTH STATE
========================= */

onAuthStateChanged(auth,user => {

    loginPage.classList.add("hidden");
    chatApp.classList.remove("hidden");

    document.getElementById(
      "currentUsername"
    ).textContent =

/* =========================
   FIREBASE ERROR
========================= */

function friendlyFirebaseError(e){

  const c = e?.code || "";

  const map = {

    "permission-denied":
      "تم رفض العملية من Firebase Rules.",

    "failed-precondition":
      "تحقق من إعدادات Firestore.",

    "unavailable":
      "Firebase غير متاح حاليًا.",

    "not-found":
      "المستند غير موجود.",

    "unauthenticated":
      "يجب تسجيل الدخول أولًا.",

    "network-request-failed":
      "تحقق من اتصال الإنترنت."

  };

  return map[c] ||
    c ||
    e?.message ||
    "خطأ غير معروف";
}


/* =========================
   ADMIN
========================= */

async function adminAction(action){

  if(!isAdmin()){

    alert("ليس لديك صلاحية إشراف");

    return;
  }

  const target =
    document.getElementById(
      "adminTarget"
    ).value.trim();

  const msg =
    document.getElementById(
      "adminMessage"
    );

  if(!target){

    msg.textContent =
      "⚠️ اكتب UID العضو";

    return;
  }

  try{

    const ref =
      doc(db,"moderation",target);

    if(action === "ban"){

      await setDoc(
        ref,
        {
          banned:true,
          updatedAt:serverTimestamp()
        },
        {merge:true}
      );

      await setDoc(
        doc(db,"users",target),
        {banned:true},
        {merge:true}
      );

    }

    if(action === "unban"){

      await setDoc(
        ref,
        {
          banned:false,
          updatedAt:serverTimestamp()
        },
        {merge:true}
      );

      await setDoc(
        doc(db,"users",target),
        {banned:false},
        {merge:true}
      );

    }

    if(action === "mute"){

      await setDoc(
        ref,
        {
          micMuted:true,
          updatedAt:serverTimestamp()
        },
        {merge:true}
      );

      await setDoc(
        doc(db,"users",target),
        {micBanned:true},
        {merge:true}
      );

    }

    if(action === "unmute"){

      await setDoc(
        ref,
        {
          micMuted:false,
          updatedAt:serverTimestamp()
        },
        {merge:true}
      );

      await setDoc(
        doc(db,"users",target),
        {micBanned:false},
        {merge:true}
      );

    }

    msg.textContent =
      "✅ تم تنفيذ الأمر";

  }catch(e){

    console.error(e);

    msg.textContent =
      "❌ " +
      friendlyFirebaseError(e);

  }

}

document.getElementById("banButton").onclick =
() => adminAction("ban");

document.getElementById("unbanButton").onclick =
() => adminAction("unban");

document.getElementById("muteButton").onclick =
() => adminAction("mute");

document.getElementById("unmuteButton").onclick =
() => adminAction("unmute");


/* =========================
   CHAT
========================= */

async function sendMessage(){

  const input =
    document.getElementById("messageInput");

  const text =
    input.value.trim();

  const u =
    auth.currentUser;

  if(!u || !text)return;

  try{

    const mod =
      await getMyModeration();

    if(mod.banned){

      alert(
        "🚫 حسابك محظور من الدردشة"
      );

      return;
    }

    await addDoc(
      collection(db,"messages"),
      {
        uid:u.uid,
        name:u.displayName || "عضو",
        text:text,
        createdAt:serverTimestamp()
      }
    );

    input.value = "";

  }catch(e){

    console.error(e);

    alert(
      "تعذر إرسال الرسالة: " +
      friendlyFirebaseError(e)
    );

  }

}

document.getElementById("sendButton").onclick =
sendMessage;

document.getElementById(
  "messageInput"
).onkeydown = e => {

  if(e.key === "Enter"){
    sendMessage();
  }

};


/* =========================
   LOAD MESSAGES
========================= */

function loadMessages(){

  if(stopMessages){
    stopMessages();
  }

  const box =
    document.getElementById("messages");

  stopMessages =
    onSnapshot(
      query(
        collection(db,"messages"),
        orderBy("createdAt","asc")
      ),

      snap => {

        box.innerHTML = "";

        if(snap.empty){

          box.innerHTML =
            '<div class="empty">لا توجد رسائل بعد</div>';

          return;
        }

        snap.forEach(s => {

          const d = s.data();

          const row =
            document.createElement("div");

          row.className = "message";

          const avatar =
            document.createElement("img");

          avatar.className = "avatar";

          avatar.src =
            "https://ui-avatars.com/api/?name=" +
            encodeURIComponent(
              d.name || "عضو"
            ) +
            "&background=1687ff&color=fff";

          const content =
            document.createElement("div");

          content.className =
            "messageContent";

          const name =
            document.createElement("div");

          name.className =
            "messageName";

          name.textContent =
            d.name || "عضو";

          const text =
            document.createElement("div");

          text.className =
            "messageText";

          text.textContent =
            d.text || "";

          content.append(
            name,
            text
          );

          row.append(
            avatar,
            content
          );

          box.appendChild(row);

        });

        box.scrollTop =
          box.scrollHeight;

      },

      e => {

        console.error(e);

        box.innerHTML =
          '<div class="empty">❌ تعذر تحميل الرسائل: ' +
          e.code +
          '</div>';

      }
    );

}

  }


  const audio =
    document.getElementById(
      "remoteAudio"
    );

  audio.srcObject =
    stream;

  audio.autoplay = true;
  audio.playsInline = true;

  audio.play().catch(() => {

    console.log(
      "iPhone requires user interaction"
    );

  });

}


function removeAudioPlayer(){

  const panel =
    document.getElementById(
      "audioPanel"
    );

  if(panel){

    const audio =
      document.getElementById(
        "remoteAudio"
      );

    if(audio){

      audio.pause();

      audio.srcObject = null;

    }

    panel.remove();

  }

}


/* =========================
   TOGGLE MIC
========================= */

async function toggleMic(index){

  const u =
    auth.currentUser;

  if(!u)return;

  const slotId =
    "slot" + (index + 1);

  const ref =
    doc(
      db,
      "voiceSlots",
      slotId
    );


  try{

    const snap =
      await getDoc(ref);


    /* =====================
       ALREADY MY MIC
    ===================== */

    if(
      mySlot === slotId
    ){

      await leaveMic(slotId);

      return;

    }


    /* =====================
       SLOT BUSY
    ===================== */

    if(snap.exists()){

      const d =
        snap.data();


      if(d.uid === u.uid){

        await leaveMic(
          slotId
        );

        return;

      }


      await joinAsListener(
        slotId,
        d
      );

      return;

    }


    /* =====================
       ALREADY USING MIC
    ===================== */

    if(mySlot){

      alert(
        "لديك مايك مفتوح بالفعل."
      );

      return;

    }


    /* =====================
       CHECK MIC
    ===================== */

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      alert(
        "❌ المتصفح لا يدعم الميكروفون أو الموقع يحتاج HTTPS."
      );

      return;

    }


    const mod =
      await getMyModeration();


    if(mod.banned){

      alert(
        "🚫 حسابك محظور"
      );

      return;

    }


    if(mod.micMuted){

      alert(
        "🎤 تم منعك من استخدام المايك"
      );

      return;

    }


    slots[index].status.textContent =
      "🎤 جاري طلب الميكروفون...";


    /* =====================
       GET MICROPHONE
    ===================== */

    localStream =
      await navigator.mediaDevices
      .getUserMedia({

        audio:{
          echoCancellation:true,
          noiseSuppression:true,
          autoGainControl:true,
          channelCount:1
        },

        video:false

      });


    mySlot =
      slotId;


    /* =====================
       CLAIM SLOT
    ===================== */

    await setDoc(
      ref,
      {
        uid:u.uid,
        name:u.displayName || "عضو",
        createdAt:serverTimestamp()
      }
    );


    slots[index].status.textContent =
      "🎤 أنت تتحدث";


    startOwnerSignaling(
      slotId
    );


  }catch(e){

    console.error(
      "toggleMic",
      e
    );

    releaseLocalStream();

    mySlot = null;


    if(
      e.name === "NotAllowedError"
    ){

      alert(
        "⚠️ اسمح للموقع باستخدام الميكروفون من إعدادات الآيفون."
      );

    }else if(
      e.name === "NotFoundError"
    ){

      alert(
        "❌ لم يتم العثور على ميكروفون."
      );

    }else{

      alert(
        "❌ تعذر تشغيل المايك: " +
        friendlyFirebaseError(e)
      );

    }

  }

}


/* =========================
   LEAVE MIC
========================= */

async function leaveMic(
  slotId
){

  try{

    await deleteDoc(
      doc(
        db,
        "voiceSlots",
        slotId
      )
    );

  }catch(e){

    console.error(e);

  }


  try{

    const peersSnap =
      await getDocs(
        collection(
          db,
          "voiceCalls",
          slotId,
          "peers"
        )
      );


    for(
      const s of peersSnap.docs
    ){

      try{

        await deleteDoc(
          s.ref
        );

      }catch(e){

        console.error(e);

      }

    }

  }catch(e){

    console.error(e);

  }


  [...peerConnections.keys()]
    .forEach(key => {

      if(
        key.startsWith(
          slotId + "-"
        )
      ){

        closePeer(key);

      }

    });


  releaseLocalStream();


  if(mySlot === slotId){

    mySlot = null;

  }

}


/* =========================
   RELEASE MICROPHONE
========================= */

function releaseLocalStream(){

  if(localStream){

    localStream
      .getTracks()
      .forEach(track => {

        try{
          track.stop();
        }catch{}

      });

    localStream = null;

  }

}


/* =========================
   OWNER SIGNALING
========================= */

function startOwnerSignaling(
  slotId
){

  const key =
    "owner-" + slotId;


  if(
    peerUnsubs.has(key)
  ){

    return;

  }


  const unsub =
    onSnapshot(
      collection(
        db,
        "voiceCalls",
        slotId,
        "peers"
      ),

      snap => {

        snap.docChanges()
          .forEach(change => {

            const listenerUid =
              change.doc.id;


            if(
              change.type === "added"
            ){

              createOwnerPeer(
                slotId,
                listenerUid
              )
              .catch(console.error);

            }


            if(
              change.type === "removed"
            ){

              closePeer(
                slotId +
                "-" +
                listenerUid
              );

            }

          });

      },

      e => {

        console.error(
          "owner signaling",
          e
        );

      }
    );


  peerUnsubs.set(
    key,
    unsub
  );

}


/* =========================
   OWNER PEER
========================= */

async function createOwnerPeer(
  slotId,
  listenerUid
){

  const key =
    slotId +
    "-" +
    listenerUid;


  if(
    peerConnections.has(key)
  ){

    return;

  }


  if(!localStream){

    return;

  }


  const peerRef =
    slotPeerRef(
      slotId,
      listenerUid
    );


  const pc =
    new RTCPeerConnection(
      rtcConfig
    );


  peerConnections.set(
    key,
    pc
  );

  candidateQueues.set(
    key,
    []
  );


  /* =====================
     AUDIO TRACK
  ===================== */

  localStream
    .getTracks()
    .forEach(track => {

      pc.addTrack(
        track,
        localStream
      );

    });


  /* =====================
     ICE
  ===================== */

  pc.onicecandidate =
    event => {

      if(!event.candidate)
        return;


      addDoc(
        collection(
          peerRef,
          "callerCandidates"
        ),
        {
          candidate:
            event.candidate.toJSON(),
          createdAt:
            serverTimestamp()
        }
      )
      .catch(console.error);

    };


  /* =====================
     ANSWER
  ===================== */

  const unsubAnswer =
    onSnapshot(
      peerRef,
      async snap => {

        const d =
          snap.data();


        if(
          !d?.answer ||
          pc.currentRemoteDescription
        ){

          return;

        }


        try{

          await pc.setRemoteDescription(
            new RTCSessionDescription(
              d.answer
            )
          );


          await flushCandidateQueue(
            key
          );

        }catch(e){

          console.error(
            "set answer",
            e
          );

        }

      }
    );


  peerUnsubs.set(
    "answer-" + key,
    unsubAnswer
  );


  /* =====================
     OFFER
  ===================== */

  const offer =
    await pc.createOffer();


  await pc.setLocalDescription(
    offer
  );


  await setDoc(
    peerRef,
    {
      offer:{
        type:offer.type,
        sdp:offer.sdp
      },

      ownerUid:
        auth.currentUser.uid,

      updatedAt:
        serverTimestamp()

    },
    {
      merge:true
    }
  );


  watchCalleeCandidates(
    pc,
    peerRef,
    key
  );


  pc.onconnectionstatechange =
    () => {

      console.log(
        "OWNER",
        key,
        pc.connectionState
      );


      if(
        ["failed","closed","disconnected"]
        .includes(
          pc.connectionState
        )
      ){

        if(
          pc.connectionState ===
          "failed" ||
          pc.connectionState ===
          "closed"
        ){

          closePeer(key);

        }

      }

    };

}


/* =========================
   WATCH CALLEE
========================= */

function watchCalleeCandidates(
  pc,
  peerRef,
  key
){

  const unsub =
    onSnapshot(
      collection(
        peerRef,
        "calleeCandidates"
      ),

      snap => {

        snap.docChanges()
          .forEach(change => {

            if(
              change.type !== "added"
            ){

              return;

            }


            const c =
              change.doc
                .data()
                ?.candidate;


            if(!c)return;


            if(
              pc.remoteDescription
            ){

              pc.addIceCandidate(
                new RTCIceCandidate(c)
              )
              .catch(console.error);

            }else{

              candidateQueues
                .get(key)
                ?.push(c);

            }

          });

      }
    );


  peerUnsubs.set(
    "callee-" + key,
    unsub
  );

}


/* =========================
   LISTENER
========================= */

async function joinAsListener(
  slotId,
  slotData
){

  const u =
    auth.currentUser;

  if(!u)return;


  const key =
    slotId +
    "-" +
    u.uid;


  if(
    peerConnections.has(key)
  ){

    return;

  }


  const peerRef =
    slotPeerRef(
      slotId,
      u.uid
    );


  const pc =
    new RTCPeerConnection(
      rtcConfig
    );


  peerConnections.set(
    key,
    pc
  );

  candidateQueues.set(
    key,
    []
  );


  /* =====================
     IMPORTANT
  ===================== */

  pc.addTransceiver(
    "audio",
    {
      direction:"recvonly"
    }
  );


  /* =====================
     RECEIVE AUDIO
  ===================== */

  pc.ontrack =
    event => {

      console.log(
        "REMOTE AUDIO TRACK",
        event
      );


      let stream =
        event.streams &&
        event.streams[0];


      if(!stream){

        stream =
          new MediaStream([
            event.track
          ]);

      }


      showAudioPlayer(
        slotId,
        stream
      );


      const slot =
        slots.find(
          x => x.id === slotId
        );


      if(slot){

        slot.status.textContent =
          "🔊 تستمع الآن";

        slot.el.classList.add(
          "listen"
        );

      }

    };


  /* =====================
     ICE
  ===================== */

  pc.onicecandidate =
    event => {

      if(!event.candidate)
        return;


      addDoc(
        collection(
          peerRef,
          "calleeCandidates"
        ),
        {
          candidate:
            event.candidate.toJSON(),

          createdAt:
            serverTimestamp()
        }
      )
      .catch(console.error);

    };


  /* =====================
     RECEIVE OFFER
  ===================== */

  const unsubOffer =
    onSnapshot(
      peerRef,
      async snap => {

        const d =
          snap.data();


        if(
          !d?.offer ||
          pc.currentRemoteDescription
        ){

          return;

        }


        try{

          await pc.setRemoteDescription(
            new RTCSessionDescription(
              d.offer
            )
          );


          await flushCandidateQueue(
            key
          );


          const answer =
            await pc.createAnswer();


          await pc.setLocalDescription(
            answer
          );


          await setDoc(
            peerRef,
            {
              answer:{
                type:answer.type,
                sdp:answer.sdp
              },

              listenerUid:
                u.uid,

              answeredAt:
                serverTimestamp()

            },
            {
              merge:true
            }
          );


          await flushCandidateQueue(
            key
          );


        }catch(e){

          console.error(
            "listener answer",
            e
          );

        }

      }
    );


  peerUnsubs.set(
    "listener-" + key,
    unsubOffer
  );


  /* =====================
     CALLER ICE
  ===================== */

  const unsubCaller =
    onSnapshot(
      collection(
        peerRef,
        "callerCandidates"
      ),

      snap => {

        snap.docChanges()
          .forEach(change => {

            if(
              change.type !== "added"
            ){

              return;

            }


            const c =
              change.doc
                .data()
                ?.candidate;


            if(!c)return;


            if(
              pc.remoteDescription
            ){

              pc.addIceCandidate(
                new RTCIceCandidate(c)
              )
              .catch(console.error);

            }else{

              candidateQueues
                .get(key)
                ?.push(c);

            }

          });

      }
    );


  peerUnsubs.set(
    "caller-" + key,
    unsubCaller
  );


  /* =====================
     CREATE PEER DOCUMENT
  ===================== */

  await setDoc(
    peerRef,
    {
      listenerUid:u.uid,
      name:u.displayName || "عضو",
      joinedAt:serverTimestamp()
    },
    {
      merge:true
    }
  );


  pc.onconnectionstatechange =
    () => {

      console.log(
        "LISTENER",
        key,
        pc.connectionState
      );


      if(
        ["failed","closed"]
        .includes(
          pc.connectionState
        )
      ){

        closePeer(key);
        removeAudioPlayer();

      }

    };

}


/* =========================
   FLUSH ICE
========================= */

async function flushCandidateQueue(
  key
){

  const pc =
    peerConnections.get(key);

  const queue =
    candidateQueues.get(key) || [];


  if(
    !pc ||
    !pc.remoteDescription
  ){

    return;

  }


  while(
    queue.length
  ){

    const c =
      queue.shift();


    try{

      await pc.addIceCandidate(
        new RTCIceCandidate(c)
      );

    }catch(e){

      console.error(
        "ICE",
        e
      );

    }

  }

}


/* =========================
   CLOSE PEER
========================= */

function closePeer(key){

  const pc =
    peerConnections.get(key);


  if(pc){

    try{
      pc.close();
    }catch{}

    peerConnections.delete(key);

  }


  candidateQueues.delete(
    key
  );


  [
    "answer-",
    "callee-",
    "listener-",
    "caller-"
  ]
  .forEach(prefix => {

    const k =
      prefix + key;

    const unsub =
      peerUnsubs.get(k);


    if(unsub){

      try{
        unsub();
      }catch{}

      peerUnsubs.delete(k);

    }

  });

}


/* =========================
   WATCH SLOTS
========================= */

function watchSlots(){

  if(stopSlots){

    stopSlots();

  }


  stopSlots =
    onSnapshot(
      collection(
        db,
        "voiceSlots"
      ),

      snap => {

        const data = {};


        snap.forEach(x => {

          data[x.id] =
            x.data();

        });


        slots.forEach(s => {

          const d =
            data[s.id];


          const mine =
            d &&
            auth.currentUser &&
            d.uid ===
            auth.currentUser.uid;


          s.el.classList.toggle(
            "active",
            !!d
          );


          s.name.textContent =
            d
              ? (d.name || "عضو")
              : "شاغر";


          if(!d){

            s.status.textContent =
              "اضغط للتحدث";

            s.button.textContent =
              "تشغيل المايك";

            s.button.disabled =
              false;

            s.el.classList.remove(
              "listen"
            );

          }else if(mine){

            s.status.textContent =
              "🎤 أنت تتحدث";

            s.button.textContent =
              "إيقاف المايك";

            s.button.disabled =
              false;

          }else{

            s.status.textContent =
              "🔊 اضغط للاستماع";

            s.button.textContent =
              "استماع";

            s.button.disabled =
              false;

          }

        });

      },

      e => {

        console.error(
          "voiceSlots",
          e
        );


        slots.forEach(s => {

          s.status.textContent =
            "❌ تعذر تحميل المايك: " +
            friendlyFirebaseError(e);

          s.button.disabled =
            true;

        });

      }
    );

}


/* =========================
   CLEANUP
========================= */

async function cleanupAllVoice(){

  try{

    if(mySlot){

      await leaveMic(
        mySlot
      );

    }

  }catch(e){

    console.error(e);

  }


  releaseLocalStream();


  peerConnections
    .forEach(pc => {

      try{
        pc.close();
      }catch{}

    });


  peerConnections.clear();


  peerUnsubs
    .forEach(unsub => {

      try{
        unsub();
      }catch{}

    });


  peerUnsubs.clear();

  candidateQueues.clear();

  removeAudioPlayer();

  mySlot = null;

}
