<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دردشتي Chat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      min-height: 100vh;
    }

    .app {
      max-width: 600px;
      height: 100vh;
      margin: auto;
      background: #181818;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #242424;
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid #333;
    }

    .header h1 {
      font-size: 22px;
    }

    .header small {
      display: block;
      margin-top: 6px;
      color: #aaa;
    }

    .auth {
      padding: 25px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: auto;
      width: 100%;
    }

    .auth h2 {
      text-align: center;
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #333;
      color: white;
      outline: none;
      font-size: 15px;
    }

    button {
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #1877f2;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    button.secondary {
      background: #333;
    }

    button:active {
      transform: scale(.98);
    }

    #error {
      color: #ff7777;
      text-align: center;
      min-height: 20px;
    }

    #chat {
      display: none;
      height: 100%;
      flex-direction: column;
    }

    .chat-top {
      padding: 10px;
      background: #242424;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .user-name {
      color: #4da6ff;
      font-weight: bold;
    }

    #messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
    }

    .message {
      background: #292929;
      padding: 10px 14px;
      margin-bottom: 10px;
      border-radius: 12px;
      width: fit-content;
      max-width: 85%;
    }

    .message .name {
      color: #4da6ff;
      font-size: 13px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .message .text {
      word-wrap: break-word;
    }

    .message .time {
      color: #888;
      font-size: 10px;
      margin-top: 5px;
    }

    .bottom {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: #242424;
    }

    .bottom input {
      flex: 1;
    }

    .bottom button {
      width: 80px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>💬 دردشتي</h1>
    <small>دردشة كتابية</small>
  </div>

  <!-- تسجيل الدخول -->
  <div id="auth" class="auth">

    <h2>تسجيل الدخول</h2>

    <input id="nameInput"
           type="text"
           placeholder="اسمك"
           autocomplete="name">

    <input id="emailInput"
           type="email"
           placeholder="البريد الإلكتروني"
           autocomplete="email">

    <input id="passwordInput"
           type="password"
           placeholder="كلمة المرور"
           autocomplete="current-password">

    <button id="loginBtn">دخول</button>

    <button id="signupBtn" class="secondary">
      إنشاء حساب جديد
    </button>

    <div id="error"></div>

  </div>

  <!-- الدردشة -->
  <div id="chat">

    <div class="chat-top">
      <div>
        المستخدم:
        <span id="currentUser" class="user-name"></span>
      </div>

      <button id="logoutBtn">خروج</button>
    </div>

    <div id="messages"></div>

    <div class="bottom">
      <input id="messageInput"
             type="text"
             placeholder="اكتب رسالتك..."
             autocomplete="off">

      <button id="sendBtn">إرسال</button>
    </div>

  </div>

</div>
