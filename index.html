<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دردشتي Chat</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  height: 100vh;
}

.app {
  max-width: 600px;
  height: 100vh;
  margin: auto;
  background: #181818;
  display: flex;
  flex-direction: column;
}

header {
  background: #242424;
  padding: 18px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

#messages {
  flex: 1;
  padding: 15px;
  overflow-y: auto;
}

.message {
  background: #292929;
  padding: 10px 14px;
  margin-bottom: 10px;
  border-radius: 12px;
  width: fit-content;
  max-width: 85%;
}

.name {
  color: #4da6ff;
  font-size: 13px;
  margin-bottom: 4px;
}

.bottom {
  display: flex;
  gap: 8px;
  padding: 10px;
  background: #242424;
}

input {
  flex: 1;
  padding: 13px;
  border: none;
  border-radius: 10px;
  background: #333;
  color: white;
  outline: none;
}

button {
  padding: 13px 18px;
  border: none;
  border-radius: 10px;
  background: #1877f2;
  color: white;
  font-weight: bold;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="app">

<header>
💬 دردشتي
</header>

<div id="messages"></div>

<div class="bottom">
<input id="messageInput" type="text" placeholder="اكتب رسالتك...">
<button onclick="sendMessage()">إرسال</button>
</div>

</div>

<script>
const input = document.getElementById("messageInput");
const messages = document.getElementById("messages");

function sendMessage() {

  const text = input.value.trim();

  if (text === "") return;

  const message = document.createElement("div");

  message.className = "message";

  message.innerHTML = `
    <div class="name">أنت</div>
    <div>${escapeHTML(text)}</div>
  `;

  messages.appendChild(message);

  input.value = "";

  messages.scrollTop = messages.scrollHeight;
}

function escapeHTML(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}

input.addEventListener("keydown", function(event) {

  if (event.key === "Enter") {
    sendMessage();
  }

});
</script>

</body>
</html>
